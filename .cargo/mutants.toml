# cargo-mutants over paros-core, with the simulation as the test (#269).
#
# Run it with `cargo xtask mutants` (it sets the seed count and forwards
# `--shard`, `--list` and the rest); the weekly `mutants` workflow shards it.
# A mutant is caught when the fixed-seed hunt (`paros-sim-runner`'s `mutants`
# test target, `paros_sim::chain_mutants`) reports a violation or a panic.

# The safety-critical modules, the first pass's scope (#269).
examine_globs = [
  "crates/paros-core/src/acceptor.rs",
  "crates/paros-core/src/acceptor/retention.rs",
  "crates/paros-core/src/proposer/election.rs",
  "crates/paros-core/src/proposer/recovery.rs",
  "crates/paros-core/src/proposer/probe.rs",
  "crates/paros-core/src/proposer/rounds.rs",
  "crates/paros-core/src/replica.rs",
  "crates/paros-core/src/journal_state.rs",
  "crates/paros-core/src/matchmaking.rs",
  "crates/paros-core/src/membership.rs",
  "crates/paros-core/src/node/catch_up.rs",
]

# Equivalent mutants, excluded by construction, one reason each. `#[cfg(test)]`
# code (the model checkers included) is never mutated.
exclude_re = [
  # Formatting is observation only: it changes no decision.
  "impl (std::fmt::|fmt::|core::fmt::)?(Debug|Display) for",
  # An invariant check emptied changes nothing while the invariant holds, and
  # the hunt runs code that keeps it: no test can catch it.
  "replace .*::assert_(invariants|mode) with \\(\\)",

  # The first run's triage (#269, 2026-10-10). Each line names a whole
  # function, or one kind of edit in a function where every such edit is
  # equivalent. Edits a regex cannot isolate from a real mutant stay in the
  # report, listed in `docs/analysis/simulation/mutation-triage.md`.
  #
  # Observability only: a metric, or a read view nothing in the shipped code
  # decides on (examples, the game and test-only checkers read them).
  "Acceptor<V>::faulty_repaired",
  "Replica::chosen_gap",
  "RegisteredPage::from_reply",
  "Matchmaking::(effective|history)\\b",
  "Election<Id, V>::(prior|recovered|promised)\\b",
  "Proposer<Id, V>::(probe_elapsed|round_column)\\b",
  "Rounds<Id, V>::all_at\\b",
  "ReplicaId::(of|is_in)\\b",
  "AcceptorConfig<Id>::(row_of|admits_read_row|is_well_formed)\\b",
  "MatchmakerSet::is_well_formed\\b",
  "impl Fingerprint for Vec<MatchmakerId>",
  # An assertion's own guard: the edit only switches a check off (or on
  # where it holds), never a decision.
  "replace > with (==|<|>=) in Matchmaking::(watermark|disagreements)$",
  "replace Matchmaking::heard_anyone -> bool with true",
  # No two matchmakers ever disagree on a ballot's configuration (the
  # write-once ledger, asserted by the audit): the count is always zero, so
  # zero is the same answer (#343).
  "replace Matchmaking::disagreements -> u64 with 0",
  "replace > with (==|<|>=) in majority_of$",
  "replace == with != in QuorumSystem::phase[12]_quorum_size$",
  "delete ! in QuorumSystem::(is_majority|is_phase[12]_quorum_in)$",
  "replace >= with < in QuorumSystem::read_row$",
  "replace < with (==|>|<=) in MatchmakerGeneration::next$",
  "delete ! in Proposer<Id, V>::phase1_won$",
  # Every caller runs `Replica::advance` right after a learn, and it refolds
  # first: the learn's own refold guard decides nothing the walk does not.
  "replace (&&|==|<) with .* in Replica::learn$",
  # Unreachable by construction: a grid of at least two rows and two
  # columns makes any row or column a valid quorum (only load moves), and
  # the drivers name only admitted rows.
  "replace residue -> usize with [01]$",
  "replace QuorumSystem::admits_read_row -> bool with true",
  "replace < with <= in QuorumSystem::admits_read_row$",
  "replace match guard self.admits_read_row\\(Some\\(row\\)\\) with true in QuorumSystem::read_row$",
]

# The hunt is the test: only `paros-sim-runner`'s `mutants` target runs, in
# release (a debug build runs the simulation many times slower). cargo-mutants'
# own baseline builds the mutated package (paros-core) rather than
# `test_package`, so `cargo xtask mutants` runs the baseline hunt itself and
# passes `--baseline skip` with a timeout sized from it.
test_package = ["paros-sim-runner"]
features = ["mutants"]
additional_cargo_test_args = ["--test", "mutants"]
profile = "release"
