# cargo-mutants over paros-journal-control, the grid controller's decision
# (`scripts/mutants.sh --control`). It has one pass: the controller has no
# trace check yet (the walk of #1261 (grid controller decision tests) that
# trace-checks against `specs/tla/grid-controller/` brings the second).
#
# The judge: the unit tests of paros-journal-control and the sweep of
# journal-sim's `tests/control.rs` (every small view against the reference
# `decide`, the oracles and their controls, and the probes of `decide`).
# Built in release (`profile = "mutants"`), the sweep takes seconds.

# Equivalent mutants only, each with its reason (AGENTS.md, the absolute
# rule: no allow list).
exclude_re = []

test_package = ["paros-journal-control", "journal-sim"]
test_tool = "nextest"
additional_cargo_test_args = ["-E", "package(paros-journal-control) | binary(control)"]
profile = "mutants"
minimum_test_timeout = 120
