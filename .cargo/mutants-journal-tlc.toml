# cargo-mutants over paros-journal, the second pass (`scripts/mutants.sh
# --journal`): the trace checks of journal-sim (`tests/traces.rs`,
# `tests/register_traces.rs` and `tests/roles_traces.rs`), only on
# the mutants that the first pass (`.cargo/mutants-journal.toml`) missed. The
# test that edits recorded traces judges the trace spec, not the fold: it is
# left out, as in `.cargo/mutants-tlc.toml`.

# Equivalent mutants only, each with its reason (AGENTS.md, the absolute
# rule: no allow list).
exclude_re = []

test_package = ["paros-journal", "journal-sim"]
test_tool = "nextest"
additional_cargo_test_args = [
  "-E", "(binary(traces) | binary(register_traces) | binary(roles_traces)) and not test(edited)",
  "--test-threads", "2",
]
profile = "mutants"
