# cargo-mutants over paros-election (`scripts/mutants.sh --election`), in one
# pass. `.cargo/mutants.toml` says how a pass runs.
#
# The judge: the unit tests of paros-election (the fold, the codec, the
# member, the recipes) and the election walk of journal-sim
# (`tests/election.rs`: its oracles and their controls). The store has no
# trace check yet, so no second pass.

# Equivalent mutants only, each with its reason (AGENTS.md, the absolute
# rule: no allow list).
exclude_re = []

test_package = ["paros-election", "journal-sim"]
test_tool = "nextest"
additional_cargo_test_args = ["-E", "package(paros-election) | binary(election)"]
profile = "mutants"
minimum_test_timeout = 120
