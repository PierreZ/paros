# cargo-mutants over paros-journal-io (`scripts/mutants.sh --journal-io`), in
# one pass. `.cargo/mutants.toml` says how a pass runs.
#
# The judge: the unit tests of paros-journal-io (the Host, the driver, the
# on-disk format, the backends in memory and their contract suites) and the
# driver walk of journal-sim (`tests/host.rs`: its oracles and their
# controls). The driver has no trace check yet, so no second pass.

# Equivalent mutants only, each with its reason (AGENTS.md, the absolute
# rule: no allow list).
exclude_re = []

test_package = ["paros-journal-io", "journal-sim"]
test_tool = "nextest"
additional_cargo_test_args = ["-E", "package(paros-journal-io) | binary(host)"]
profile = "mutants"
minimum_test_timeout = 120
