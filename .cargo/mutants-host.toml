# cargo-mutants over paros-host (`scripts/mutants.sh --host`), in one pass.
# `.cargo/mutants.toml` says how a pass runs.
#
# The judge: the unit tests of paros-host (the generic Host and driver on a
# toy family). The host has no trace check yet, so no second pass.

# Equivalent mutants only, each with its reason (AGENTS.md, the absolute
# rule: no allow list).
exclude_re = []

test_package = ["paros-host"]
test_tool = "nextest"
additional_cargo_test_args = ["-E", "package(paros-host)"]
profile = "mutants"
minimum_test_timeout = 120
