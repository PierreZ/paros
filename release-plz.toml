# Release-plz configuration
[workspace]
# Only release when merging a release PR, not on every push to main
release_always = false

# Enable git releases with draft mode
git_release_enable = true
git_release_draft = true

# Create draft pull requests for review
pr_draft = true

# Add release label to PRs for easy identification
pr_labels = ["release"]

# Enable changelog updates
changelog_update = true

# Update dependencies during release
dependencies_update = true

# Disable semver checks (pre-1.0, API is unstable)
semver_check = false

# Features always bump minor version (even in 0.x)
features_always_increment_minor = true

# Every crate that `cargo install parosd` needs is published, all at one
# version (`version_group`). They depend on moonpool by git rev and by
# version: the publish resolves the version from crates.io.
#
# One tag and one GitHub release per version, `v{{ version }}`, on the `paros`
# package: its changelog is the repository's CHANGELOG.md and takes the commits
# of every published crate. The release starts as a draft; the `binaries` job
# of the release-plz workflow attaches the parosd, parosctl and paros-bench
# archives (`cargo binstall`) and then publishes it.
[[package]]
name = "paros"
version_group = "paros"
changelog_path = "CHANGELOG.md"
changelog_include = [
    "paros-core",
    "paros-wire",
    "paros-model",
    "paros-tunables",
    "paros-storage",
    "paros-net",
    "paros-client",
    "paros-observe",
    "paros-roles",
    "paros-coordinator",
    "paros-machine",
    "paros-authz-biscuit",
    "parosd",
    "parosctl",
    "paros-bench",
]
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"

# paros-core keeps its own, hand-written changelog.
[[package]]
name = "paros-core"
version_group = "paros"
changelog_path = "crates/lib/paros-core/CHANGELOG.md"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "paros-wire"
version_group = "paros"
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
