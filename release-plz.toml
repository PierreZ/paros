# Release-plz configuration
[workspace]
# Only release when merging a release PR, not on every push to main
release_always = false

# Enable git releases with draft mode
git_release_enable = true
git_release_draft = true

# Create draft pull requests for review
pr_draft = true

# Add release label to PRs for easy identification
pr_labels = ["release"]

# Enable changelog updates
changelog_update = true

# Update dependencies during release
dependencies_update = true

# Disable semver checks (pre-1.0, API is unstable)
semver_check = false

# Features always bump minor version (even in 0.x)
features_always_increment_minor = true

# Only `paros-core` is released (decided on 2026-11-11, #968 (release-plz)): it is the
# one crate that crates.io can take. Every other library crate depends on moonpool by
# git rev, which crates.io refuses. When moonpool is on crates.io, give each of them
# its `changelog_path` and put it in one `version_group` with `paros-core`.
[[package]]
name = "paros-core"
changelog_path = "crates/lib/paros-core/CHANGELOG.md"

# The library crates that wait for moonpool on crates.io. They take the workspace
# version, so they stay in step with `paros-core`.
[[package]]
name = "paros-wire"
release = false

[[package]]
name = "paros-model"
release = false

[[package]]
name = "paros-tunables"
release = false

[[package]]
name = "paros-storage"
release = false

[[package]]
name = "paros-net"
release = false

[[package]]
name = "paros-client"
release = false

[[package]]
name = "paros-observe"
release = false

[[package]]
name = "paros-roles"
release = false

[[package]]
name = "paros-coordinator"
release = false

[[package]]
name = "paros-machine"
release = false

[[package]]
name = "paros"
release = false

[[package]]
name = "paros-sim"
release = false

# Binaries, the harness tools and the site's wasm are never released.
[[package]]
name = "paros-sim-runner"
release = false
publish = false

[[package]]
name = "paros-sim-wasm-check"
release = false
publish = false

[[package]]
name = "xtask"
release = false
publish = false

[[package]]
name = "parosd"
release = false
publish = false

[[package]]
name = "parosctl"
release = false
publish = false

[[package]]
name = "paros-bench"
release = false
publish = false

[[package]]
name = "paros-wasm"
release = false
publish = false

[[package]]
name = "paros-authz-biscuit"
release = false
publish = false

# Changelog configuration
[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{commit.scope}}**: {% endif %}{{ commit.message | upper_first }}
    {%- endfor %}
{% endfor %}\n
"""

# Parse conventional commits and group them
[[changelog.commit_parsers]]
message = "^feat"
group = "<!-- 0 -->🚀 Features"

[[changelog.commit_parsers]]
message = "^fix"
group = "<!-- 1 -->🐛 Bug Fixes"

[[changelog.commit_parsers]]
message = "^doc"
group = "<!-- 2 -->📚 Documentation"

[[changelog.commit_parsers]]
message = "^perf"
group = "<!-- 3 -->⚡ Performance"

[[changelog.commit_parsers]]
message = "^refactor"
group = "<!-- 4 -->🚜 Refactor"

[[changelog.commit_parsers]]
message = "^style"
group = "<!-- 5 -->🎨 Styling"

[[changelog.commit_parsers]]
message = "^test"
group = "<!-- 6 -->🧪 Testing"

# The prefixes the project uses beside the conventional ones. Only commits that
# touch `paros-core` reach its changelog.
[[changelog.commit_parsers]]
message = "^(core|paros-core|matchmaker)"
group = "<!-- 0 -->🚀 Features"

[[changelog.commit_parsers]]
message = "^(sim|harness)"
group = "<!-- 6 -->🧪 Testing"

[[changelog.commit_parsers]]
message = "^chore\\(release\\): prepare for"
skip = true

[[changelog.commit_parsers]]
message = "^chore\\(deps.*\\)"
skip = true

[[changelog.commit_parsers]]
message = "^chore|^ci"
group = "<!-- 7 -->⚙️ Miscellaneous Tasks"

# Anything that doesn't match above parsers
[[changelog.commit_parsers]]
message = ".*"
group = "<!-- 8 -->📦 Other"
