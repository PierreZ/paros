# TLC, the TLA+ model checker, on the protocol specs of specs/tla/ (#579
# (zero-stall reconfiguration)). The specs are small models of a protocol rule,
# checked before the rule is written in paros-core. It runs only when a spec,
# its script or the flake changes.
name: TLA

on:
  push:
    branches: [main]
    paths:
      - "specs/tla/**"
      - "scripts/check-tla.sh"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/tla.yml"
  pull_request:
    branches: [main]
    paths:
      - "specs/tla/**"
      - "scripts/check-tla.sh"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/tla.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run TLC on the specs
        run: nix develop .#tla --command scripts/check-tla.sh
