# TLC, the TLA+ model checker, on the protocol specs of specs/tla/ (#579
# (zero-stall reconfiguration)). The specs are small models of a protocol rule,
# checked before the rule is written in paros-consensus. It runs only when a spec,
# its script or the flake changes. Each folder of specs/tla/ runs in its own
# job, so a new model adds a job and not time to one job; the job `tlc` is
# green only when every folder's job is green. The job `traces` runs the trace
# checks of consensus-sim and journal-sim (`tests/traces.rs` of each, and
# `tests/register_traces.rs`, `tests/roles_traces.rs` and `tests/live.rs` of
# journal-sim): a trace
# spec EXTENDS its model,
# so a change of a model or of a `*Trace.tla` alone must meet the walks too
# (#1231 (traced walks reach the rules)). The Rust workflow runs them for a
# change of the code. Each CI job has at most 30 minutes, so `traces` runs in
# four shards (nextest `--partition count:i/4`: the tests in name order, dealt
# out in turn). Each shard runs a quarter of the tests and every test runs in
# one shard (#1340 (the traces job reaches its timeout)). The job `proofs`
# checks the TLAPS proofs of specs/tla/ (`scripts/check-proofs.sh`).
name: TLA

on:
  push:
    branches: [main]
    paths:
      - "specs/tla/**"
      - "scripts/check-tla.sh"
      - "scripts/check-proofs.sh"
      - "scripts/mutate-tla.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/tla.yml"
  pull_request:
    branches: [main]
    paths:
      - "specs/tla/**"
      - "scripts/check-tla.sh"
      - "scripts/check-proofs.sh"
      - "scripts/mutate-tla.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/tla.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
    steps:
      - uses: actions/checkout@v7
      - name: List the folders of specs/tla
        id: list
        run: |
          # The models of the plan, then the experiments (specs/tla/experiments/),
          # each named by its path under specs/tla/.
          folders=$(for m in specs/tla/*/checks.txt specs/tla/experiments/*/*/checks.txt; do
              [ -f "$m" ] && dirname "${m#specs/tla/}"; done \
            | jq -R . | jq -sc .)
          test "$folders" != "[]"
          echo "folders=$folders" >>"$GITHUB_OUTPUT"

  spec:
    needs: specs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.specs.outputs.folders) }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run TLC on specs/tla/${{ matrix.folder }}
        run: nix develop .#tla --command scripts/check-tla.sh "${{ matrix.folder }}"
      # Each guard set to TRUE still parses, so that the weekly `TLA mutants`
      # workflow judges every guard (#1311 (mutate spec guards)).
      - name: Parse each guard mutant of specs/tla/${{ matrix.folder }}
        run: nix develop .#tla --command scripts/mutate-tla.py --parse "${{ matrix.folder }}"

  traces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          key: traces
          cache-on-failure: true
      - name: Check the consensus-sim and journal-sim walks against the trace specs (shard ${{ matrix.shard }} of 4)
        run: >-
          nix develop --command cargo nextest run --profile ci --release
          -p consensus-sim -p journal-sim --test traces --test register_traces --test roles_traces --test live
          --partition count:${{ matrix.shard }}/4

  # The TLAPS proofs (`*Proof.tla`, #1307 (inductive invariants, then
  # proofs)): every obligation is proved again, with no cache.
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check the TLAPS proofs of specs/tla
        run: nix develop .#proofs --command scripts/check-proofs.sh

  tlc:
    needs: [specs, spec, traces, proofs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every folder's job is green
        run: |
          test "${{ needs.specs.result }}" = success
          test "${{ needs.spec.result }}" = success
          test "${{ needs.traces.result }}" = success
          test "${{ needs.proofs.result }}" = success
