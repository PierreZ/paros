# Guard mutation of the TLA+ models of specs/tla/ (#1311 (mutate spec guards),
# `scripts/mutate-tla.py`). For each guard of each action (a conjunct that
# changes no variable), the script writes a copy of the model with that one
# guard set to TRUE and runs the `ci` checks of `checks.txt` on it. At least
# one check must then fail. A guard that no check misses is a finding: the
# guard is not necessary, or a property is missing. There is no allow list
# (AGENTS.md, the absolute rule).
#
# One job for each folder times its checks once (`--baseline-out`), as the
# `TLA` workflow runs them. Then one job for each slice of a folder judges
# its mutants one at a time, each TLC on every CPU, with those times
# (`--baseline-from`). `scripts/mutate-tla-shards.txt` gives the number of
# slices of each folder, and lists every folder. A slice has a budget below its 30-minute job: a
# mutant that the budget cuts is `unfinished`, the slice fails, and the fix is
# more slices. A GitHub matrix holds at most 256 jobs, so the slices run in
# two matrices (`tla-mutants-slices.yml`), the first 256 and the rest, at the
# same time. The `report` job lists every survivor and every unfinished
# mutant. It runs each week and on demand. A run on demand can name its
# folders (`folders`, the survivors of a fix judged again) and hold each
# matrix to a number of jobs at a time (`max_parallel`; with both matrices,
# twice that number run), so that the other workflows still get runners. A pull request only checks that
# every mutant parses (`--parse`, the `spec` job of `tla.yml`): the run of
# every mutant takes hours of CI.
name: TLA mutants

on:
  schedule:
    - cron: '41 4 * * 6'
  workflow_dispatch:
    inputs:
      folders:
        description: 'Folders of specs/tla/ to judge, separated by spaces (empty: every folder)'
        required: false
        default: ''
      max_parallel:
        description: 'At most this many slice jobs at a time in each matrix'
        required: false
        default: '256'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slices:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
      first: ${{ steps.list.outputs.first }}
      rest: ${{ steps.list.outputs.rest }}
    steps:
      - uses: actions/checkout@v7
      - name: List the folders of specs/tla and the slices of each
        id: list
        env:
          FOLDERS: ${{ inputs.folders }}
          MAX_PARALLEL: ${{ inputs.max_parallel || '256' }}
        run: |
          if ! [[ "$MAX_PARALLEL" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_parallel must be a positive whole number, not '$MAX_PARALLEL'"
            exit 1
          fi
          all=$(for m in specs/tla/*/checks.txt specs/tla/experiments/*/*/checks.txt; do
              [ -f "$m" ] && dirname "${m#specs/tla/}"; done)
          for f in $all; do
            if ! awk -v f="$f" '$1 == f { ok = 1 } END { exit !ok }' scripts/mutate-tla-shards.txt; then
              echo "::error::$f has no line in scripts/mutate-tla-shards.txt"
              exit 1
            fi
          done
          list=$all
          if [ -n "$FOLDERS" ]; then
            for f in $FOLDERS; do
              if ! grep -qxF -- "$f" <<<"$all"; then
                echo "::error::$f is not a folder of specs/tla with a checks.txt"
                exit 1
              fi
              if [ "$(awk -v f="$f" '$1 == f { print $2 }' scripts/mutate-tla-shards.txt)" = 0 ]; then
                echo "::error::$f has no guard to judge (0 slices)"
                exit 1
              fi
            done
            list=$(tr -s ' ' '\n' <<<"$FOLDERS" | sed '/^$/d' | sort -u)
          fi
          slices=$(for f in $list; do
              n=$(awk -v f="$f" '$1 == f { print $2 }' scripts/mutate-tla-shards.txt)
              for i in $(seq 1 "$n"); do echo "$f $i/$n"; done
            done | jq -R . | jq -sc .)
          folders=$(echo "$list" | jq -R . | jq -sc .)
          test "$slices" != "[]"
          test "$(jq length <<<"$slices")" -le 512
          {
            echo "folders=$folders"
            echo "first=$(jq -c '.[:256]' <<<"$slices")"
            echo "rest=$(jq -c '.[256:]' <<<"$slices")"
          } >>"$GITHUB_OUTPUT"

  baseline:
    needs: slices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.slices.outputs.folders) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - name: Time the checks of specs/tla/${{ matrix.folder }}
        id: name
        run: |
          echo "artifact=baseline-$(echo "${{ matrix.folder }}" | tr '/' '_')" >>"$GITHUB_OUTPUT"
          nix develop .#tla --command scripts/mutate-tla.py --workers 1 \
            --baseline-out baseline.tsv "${{ matrix.folder }}"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: baseline.tsv

  slice:
    needs: [slices, baseline]
    if: ${{ !cancelled() && needs.slices.result == 'success' }}
    uses: ./.github/workflows/tla-mutants-slices.yml
    with:
      slices: ${{ needs.slices.outputs.first }}
      max_parallel: ${{ inputs.max_parallel || '256' }}

  slice-rest:
    needs: [slices, baseline]
    if: ${{ !cancelled() && needs.slices.result == 'success' && needs.slices.outputs.rest != '[]' }}
    uses: ./.github/workflows/tla-mutants-slices.yml
    with:
      slices: ${{ needs.slices.outputs.rest }}
      max_parallel: ${{ inputs.max_parallel || '256' }}

  # One list of every surviving guard, and of every slice that did not end.
  report:
    needs: [slices, baseline, slice, slice-rest]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: mutants-*
          path: mutants
      - name: Survivors and cut slices
        run: |
          cat mutants/*/mutants.tsv >all.tsv
          echo "Verdicts:"; cut -f1 all.tsv | grep -v '^done$' | sort | uniq -c
          echo "Survivors, unfinished mutants and errors:"
          grep -E '^(survived|unfinished|tool-error)' all.tsv | sort -t$'\t' -k2 || true
          echo "Slices that did not end:"
          for d in mutants/*/; do grep -q '^done' "$d/mutants.tsv" || echo "  ${d#mutants/}"; done
          test "${{ needs.slices.result }}" = success
          test "${{ needs.baseline.result }}" = success
          test "${{ needs.slice.result }}" = success
          case "${{ needs.slice-rest.result }}" in success | skipped) ;; *) exit 1 ;; esac
