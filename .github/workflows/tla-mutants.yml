# Guard mutation of the TLA+ models of specs/tla/ (#1311 (mutate spec guards),
# `scripts/mutate-tla.py`). For each guard of each action (a conjunct that
# changes no variable), the script writes a copy of the model with that one
# guard set to TRUE and runs the `ci` checks of `checks.txt` on it. At least
# one check must then fail. A guard that no check misses is a finding: the
# guard is not necessary, or a property is missing. There is no allow list
# (AGENTS.md, the absolute rule).
#
# One job for each folder times its checks once (`--baseline-out`), as the
# `TLA` workflow runs them. Then one job for each slice of a folder judges
# its mutants one at a time, each TLC on every CPU, with those times
# (`--baseline-from`). `scripts/mutate-tla-shards.txt` gives the number of
# slices of each folder, and lists every folder. A slice has a budget below its 30-minute job: a
# mutant that the budget cuts is `unfinished`, the slice fails, and the fix is
# more slices. The `report` job lists every survivor and every unfinished
# mutant. It runs each week and on demand. A pull request only checks that
# every mutant parses (`--parse`, the `spec` job of `tla.yml`): the run of
# every mutant takes hours of CI.
name: TLA mutants

on:
  schedule:
    - cron: '41 4 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slices:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
      slices: ${{ steps.list.outputs.slices }}
    steps:
      - uses: actions/checkout@v7
      - name: List the folders of specs/tla and the slices of each
        id: list
        run: |
          list=$(for m in specs/tla/*/checks.txt specs/tla/experiments/*/*/checks.txt; do
              [ -f "$m" ] && dirname "${m#specs/tla/}"; done)
          for f in $list; do
            if ! awk -v f="$f" '$1 == f { ok = 1 } END { exit !ok }' scripts/mutate-tla-shards.txt; then
              echo "::error::$f has no line in scripts/mutate-tla-shards.txt"
              exit 1
            fi
          done
          slices=$(for f in $list; do
              n=$(awk -v f="$f" '$1 == f { print $2 }' scripts/mutate-tla-shards.txt)
              for i in $(seq 1 "$n"); do echo "$f $i/$n"; done
            done | jq -R . | jq -sc .)
          folders=$(echo "$list" | jq -R . | jq -sc .)
          test "$slices" != "[]"
          echo "folders=$folders" >>"$GITHUB_OUTPUT"
          echo "slices=$slices" >>"$GITHUB_OUTPUT"

  baseline:
    needs: slices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.slices.outputs.folders) }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Time the checks of specs/tla/${{ matrix.folder }}
        id: name
        run: |
          echo "artifact=baseline-$(echo "${{ matrix.folder }}" | tr '/' '_')" >>"$GITHUB_OUTPUT"
          nix develop .#tla --command scripts/mutate-tla.py --workers 1 \
            --baseline-out baseline.tsv "${{ matrix.folder }}"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: baseline.tsv

  slice:
    needs: [slices, baseline]
    if: always() && needs.slices.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.slices.outputs.slices) }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/download-artifact@v6
        with:
          pattern: baseline-*
          path: baselines
      - name: Mutate the guards of specs/tla/${{ matrix.slice }}
        id: name
        run: |
          read -r folder shard <<<"${{ matrix.slice }}"
          echo "artifact=mutants-$(echo "$folder-$shard" | tr '/' '_')" >>"$GITHUB_OUTPUT"
          cat baselines/*/baseline.tsv >baseline.tsv
          touch mutants.tsv
          status=0
          nix develop .#tla --command scripts/mutate-tla.py --workers 1 --budget 1320 \
            --baseline-from baseline.tsv \
            --shard "$shard" --out mutants.tsv "$folder" || status=$?
          printf 'done\t%s\n' "${{ matrix.slice }}" >>mutants.tsv
          exit "$status"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ${{ steps.name.outputs.artifact || format('mutants-{0}', strategy.job-index) }}
          path: mutants.tsv

  # One list of every surviving guard, and of every slice that did not end.
  report:
    needs: [slices, baseline, slice]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: mutants-*
          path: mutants
      - name: Survivors and cut slices
        run: |
          cat mutants/*/mutants.tsv >all.tsv
          echo "Verdicts:"; cut -f1 all.tsv | grep -v '^done$' | sort | uniq -c
          echo "Survivors, unfinished mutants and errors:"
          grep -E '^(survived|unfinished|tool-error)' all.tsv | sort -t$'\t' -k2 || true
          echo "Slices that did not end:"
          for d in mutants/*/; do grep -q '^done' "$d/mutants.tsv" || echo "  ${d#mutants/}"; done
          test "${{ needs.slices.result }}" = success
          test "${{ needs.baseline.result }}" = success
          test "${{ needs.slice.result }}" = success
