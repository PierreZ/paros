# The walks of journal-sim every night, on new seeds. The `test` job of
# `rust.yml` runs every walk from seed 1 on each push. Here the first seed of
# each campaign moves with the date (`JOURNAL_SIM_FROM`,
# `crates/sim/journal-sim/src/campaign.rs`), so the oracles judge runs that
# nobody steered for, and each campaign must still reach its sites. The trace
# checks (`tlc_*`) stay out: they replay fixed seeds and run in the `TLA`
# workflow. The mutant tests (`*catches*`) stay out too: each judges one
# planted bug on the seeds that CI judges. A red night is a finding: a failed walk prints its seed, and a site
# that only the CI seeds reach needs a better walk move or steer.
name: Journal nightly

on:
  schedule:
    - cron: '53 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The day since the epoch, times a million: no two nights share a seed.
      - name: Pick the first seed of the night
        run: echo "JOURNAL_SIM_FROM=$(( $(date +%s) / 86400 * 1000000 ))" >> "$GITHUB_ENV"
      - name: Run the walks of journal-sim on new seeds
        run: >-
          echo "first seed: $JOURNAL_SIM_FROM" &&
          nix develop --command cargo nextest run --profile ci --release
          -p journal-sim -E 'not test(/^tlc_/) and not test(/catches/)'
