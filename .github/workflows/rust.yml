name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo clippy
        run: nix develop --command cargo clippy -- --deny warnings
      - name: Check the core's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-core --no-deps

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo fmt
        run: nix develop --command cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo nextest
        run: nix develop --command cargo nextest run

  # The teaching examples (`crates/paros-core/examples/`) drive the composable roles
  # by hand and assert the property each one teaches, so running them is a test of
  # the public API's shape as much as of the protocol. They are linted under the
  # same pedantic clippy as the crate (the root clippy job does not cover examples).
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Lint the examples
        run: nix develop --command cargo clippy -p paros-core --examples -- --deny warnings
      - name: Run single_decree
        run: nix develop --command cargo run -p paros-core --example single_decree
      - name: Run multi_paxos
        run: nix develop --command cargo run -p paros-core --example multi_paxos
      - name: Run matchmaker
        run: nix develop --command cargo run -p paros-core --example matchmaker

  # The sans-IO core and the library driver stay portable to wasm32: paros-core is
  # zero-dep/std-only, paros (the provider-generic driver) is runtime-free. The
  # gate guards those two contracts, not a browser build (the demo was removed
  # and will return on top of them).
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build paros-core for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-core
      - name: Check paros-core builds for wasm with every feature off (zero deps)
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-core --no-default-features
      - name: Build paros (the library driver) for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros

  # Coverage-guided deterministic simulation under LLVM SanitizerCoverage. Drives
  # the Paxos sim with sancov instrumentation on the shipped library (paros_core +
  # the driver, not the harness) and explores seeds up to the bounded cap,
  # asserting safety on every one. A dedicated job because the instrumented build +
  # sweep is heavier than the plain `cargo nextest` run. Mirrors moonpool's `sim`
  # job.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run sancov simulation sweep
        run: nix develop --command cargo xtask sim run-all
