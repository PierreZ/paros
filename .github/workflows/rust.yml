name: Tests

# A change that touches only Markdown, docs/ or a TLA+ spec runs no Rust job.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'specs/**', 'scripts/check-tla.sh', '.github/workflows/tla.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'specs/**', 'scripts/check-tla.sh', '.github/workflows/tla.yml']

# A new push cancels a pull request's older run, never a run on main: each
# merged commit gets its whole run, so a red on main names the merge that
# brought it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which jobs a pull request needs. `rust` is false when every changed path is
  # Markdown, docs/, specs/** or the TLA+ workflow and script: then no Rust job
  # runs. A push to main always runs everything.
  scope:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          other=$(git diff --name-only "$BASE"...HEAD \
            | grep -vE '^(docs/|specs/|scripts/check-tla\.sh$|\.github/workflows/tla\.yml$)|\.md$' || true)
          if [ -n "$other" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  clippy:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo clippy
        run: nix develop --command cargo clippy --all-targets -- --deny warnings
      - name: Check the rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-core -p paros-storage -p paros-testkit --no-deps

  fmt:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo fmt
        run: nix develop --command cargo fmt --all -- --check
      # #722 (three products): foo.rs + foo/, no mod.rs, no #[path] includes.
      - name: Check the module style
        run: scripts/check-module-style.sh
      # #730 (paros-core rework): foundations <- roles <- deployments.
      - name: Check the paros-core layers
        run: scripts/check-core-layers.sh

  test:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # The test build took 3m25s from nothing on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          cache-on-failure: true
      - name: Run cargo nextest
        run: nix develop --command cargo nextest run --profile ci

  # The teaching examples (`crates/lib/paros-core/examples/`) drive the composable roles
  # by hand and assert the property each one teaches, so running them is a test of
  # the public API's shape as much as of the protocol. They are linted under the
  # same pedantic clippy as the crate by the root clippy job's `--all-targets`.
  examples:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run single_decree
        run: nix develop --command cargo run -p paros-core --example single_decree
      - name: Run multi_paxos
        run: nix develop --command cargo run -p paros-core --example multi_paxos
      - name: Run matchmaker
        run: nix develop --command cargo run -p paros-core --example matchmaker
      - name: Run acceptor_grid
        run: nix develop --command cargo run -p paros-core --example acceptor_grid
      - name: Run quorum_read
        run: nix develop --command cargo run -p paros-core --example quorum_read
      - name: Run proxy_leader
        run: nix develop --command cargo run -p paros-core --example proxy_leader
      - name: Run replica_tier
        run: nix develop --command cargo run -p paros-core --example replica_tier

  # The sans-IO core stays portable to wasm32: paros-core is zero-dep and
  # std-only with every feature off.
  portability:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build paros-core for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-core
      - name: Check paros-core builds for wasm with every feature off (zero deps)
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-core --no-default-features
      - name: Check paros-core with the serde derives on (no crate enables the feature)
        run: nix develop --command cargo check -p paros-core --features serde
