name: Tests

# A change that touches only Markdown, docs/ or the site (website/zola/) runs no Rust job.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/zola/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/zola/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo clippy
        run: nix develop --command cargo clippy --all-targets -- --deny warnings
      - name: Check the core's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-core --no-deps

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo fmt
        run: nix develop --command cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo nextest
        run: nix develop --command cargo nextest run
      # #194 (throughput benchmark): the bench runs, on a local cell of three
      # machines. A check that it works, never a number: shared runners are noise.
      - name: Smoke the bench on a local cell
        run: nix develop --command cargo run -p parosd --bin parosctl -- bench --local 3 --duration 5s

  # The teaching examples (`crates/paros-core/examples/`) drive the composable roles
  # by hand and assert the property each one teaches, so running them is a test of
  # the public API's shape as much as of the protocol. They are linted under the
  # same pedantic clippy as the crate by the root clippy job's `--all-targets`.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run single_decree
        run: nix develop --command cargo run -p paros-core --example single_decree
      - name: Run multi_paxos
        run: nix develop --command cargo run -p paros-core --example multi_paxos
      - name: Run matchmaker
        run: nix develop --command cargo run -p paros-core --example matchmaker
      - name: Run flexible_quorums
        run: nix develop --command cargo run -p paros-core --example flexible_quorums
      - name: Run acceptor_grid
        run: nix develop --command cargo run -p paros-core --example acceptor_grid
      - name: Run quorum_read
        run: nix develop --command cargo run -p paros-core --example quorum_read
      - name: Run proxy_leader
        run: nix develop --command cargo run -p paros-core --example proxy_leader
      - name: Run replica_tier
        run: nix develop --command cargo run -p paros-core --example replica_tier

  # The sans-IO core and the library driver stay portable to wasm32: paros-core is
  # zero-dep/std-only, paros (the provider-generic driver) is runtime-free. The
  # gate guards those two contracts; the browser build itself is the `play` job.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build paros-core for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-core
      - name: Check paros-core builds for wasm with every feature off (zero deps)
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-core --no-default-features
      - name: Check paros-core with the serde derives on (no crate enables the feature)
        run: nix develop --command cargo check -p paros-core --features serde
      - name: Build paros (the library driver) for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros
      - name: Build the Paxos sandbox (paros on moonpool's simulator) for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-sandbox

  # paros play, the interactive game: the engine crate's wasm build, the TypeScript
  # bindings ts-rs generates from its view types (committed; a stale copy fails the
  # diff), and the web app's type check, unit tests and production bundle. Every
  # tool comes from the flake; `npm ci` installs the locked dependencies.
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Regenerate the TypeScript bindings and check they are committed
        run: |
          nix develop --command cargo test -p paros-play --test bindings
          git diff --exit-code -- website/play/src/generated
      - name: Build the game's wasm and the web app
        run: nix develop --command scripts/build-play.sh --wasm-only
      - name: Type-check, test and bundle the web app
        run: nix develop --command bash -c 'cd website/play && npm ci --no-audit --no-fund && npm run check && npm test && npm run build'

  # The toy (#196), the user's demo and no test: the image builds from a fresh
  # clone with Docker alone (the one build outside Nix), and its Rust version is
  # the channel rust-toolchain.toml pins.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The Dockerfile's Rust version is rust-toolchain.toml's channel
        run: scripts/check-dockerfile-toolchain.sh
      - name: Build the image
        run: docker compose build

  # Coverage-guided deterministic simulation under LLVM SanitizerCoverage. Drives
  # the Paxos sim with sancov instrumentation on the shipped library (paros_core +
  # the driver, not the harness) and explores seeds up to the bounded cap,
  # asserting safety on every one. A dedicated job because the instrumented build +
  # sweep is heavier than the plain `cargo nextest` run. Mirrors moonpool's `sim`
  # job.
  #
  # Two shards run the same sweep in parallel (decided on 2026-10-16): each PR gets
  # twice the seeds for the same wall-clock time. The shards draw disjoint seeds
  # without any flag: moonpool derives every iteration seed from a base seed taken
  # from the wall clock in nanoseconds, so two runs on two runners share a seed
  # only by a 64-bit hash collision. A red shard is a red CI: `fail-fast: false`
  # lets the other shard finish, so a red run reports every failing seed.
  # A shard fails on its own on a safety violation or a failed run. It writes
  # its coverage defects to a file instead of failing on them: a declared gate
  # it never ran, a gate it never fired, a sweep that did not saturate. The
  # `sim-gates` job fails only on a defect both shards have. Judged per shard,
  # a rare gate would miss twice as often as with one sweep.
  sim:
    name: sim (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sancov
          cache-on-failure: true
          # Both shards build the same thing; one saves the cache.
          save-if: ${{ matrix.shard == 1 }}
      - name: Run sancov simulation sweep
        env:
          PAROS_SIM_MISSING_GATES: ${{ runner.temp }}/missing-gates.txt
        run: nix develop --command cargo xtask sim run-all
      - name: Keep this shard's coverage defects
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: missing-gates-${{ matrix.shard }}
          path: ${{ runner.temp }}/missing-gates.txt
          if-no-files-found: error

  # The coverage check over both shards (#446 (a gate that never fires cannot
  # fail the sweep)): a gate fails CI only when every shard missed it, and the
  # sweep only when no shard saturated.
  # A shard that wrote no file (it died before its verdict) fails this job.
  sim-gates:
    needs: sim
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: missing-gates-*
          path: missing-gates
      - name: Fail on a coverage defect that every shard has
        run: |
          set -euo pipefail
          test -f missing-gates/missing-gates-1/missing-gates.txt
          test -f missing-gates/missing-gates-2/missing-gates.txt
          never=$(comm -12 \
            <(sort missing-gates/missing-gates-1/missing-gates.txt) \
            <(sort missing-gates/missing-gates-2/missing-gates.txt))
          if [ -n "$never" ]; then
            echo "coverage defects that every shard has:"
            echo "$never"
            exit 1
          fi
          echo "every gate fired, and a sweep saturated, in at least one shard"
