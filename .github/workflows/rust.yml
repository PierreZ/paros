name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo clippy
        run: nix develop --command cargo clippy --all-targets -- --deny warnings
      - name: Check the core's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-core --no-deps

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo fmt
        run: nix develop --command cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo nextest
        run: nix develop --command cargo nextest run

  # The teaching examples (`crates/paros-core/examples/`) drive the composable roles
  # by hand and assert the property each one teaches, so running them is a test of
  # the public API's shape as much as of the protocol. They are linted under the
  # same pedantic clippy as the crate by the root clippy job's `--all-targets`.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run single_decree
        run: nix develop --command cargo run -p paros-core --example single_decree
      - name: Run multi_paxos
        run: nix develop --command cargo run -p paros-core --example multi_paxos
      - name: Run matchmaker
        run: nix develop --command cargo run -p paros-core --example matchmaker
      - name: Run flexible_quorums
        run: nix develop --command cargo run -p paros-core --example flexible_quorums
      - name: Run acceptor_grid
        run: nix develop --command cargo run -p paros-core --example acceptor_grid
      - name: Run quorum_read
        run: nix develop --command cargo run -p paros-core --example quorum_read

  # The sans-IO core and the library driver stay portable to wasm32: paros-core is
  # zero-dep/std-only, paros (the provider-generic driver) is runtime-free. The
  # gate guards those two contracts; the browser build itself is the `play` job.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build paros-core for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-core
      - name: Check paros-core builds for wasm with every feature off (zero deps)
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-core --no-default-features
      - name: Check paros-core with the serde derives on (no crate enables the feature)
        run: nix develop --command cargo check -p paros-core --features serde
      - name: Build paros (the library driver) for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros

  # paros play, the interactive game: the engine crate's wasm build, the TypeScript
  # bindings ts-rs generates from its view types (committed; a stale copy fails the
  # diff), and the web app's type check, unit tests and production bundle. Every
  # tool comes from the flake; `npm ci` installs the locked dependencies.
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Regenerate the TypeScript bindings and check they are committed
        run: |
          nix develop --command cargo test -p paros-play --test bindings
          git diff --exit-code -- web/play/src/generated
      - name: Build the game's wasm and the web app
        run: nix develop --command scripts/build-play.sh --wasm-only
      - name: Type-check, test and bundle the web app
        run: nix develop --command bash -c 'cd web/play && npm ci --no-audit --no-fund && npm run check && npm test && npm run build'

  # Coverage-guided deterministic simulation under LLVM SanitizerCoverage. Drives
  # the Paxos sim with sancov instrumentation on the shipped library (paros_core +
  # the driver, not the harness) and explores seeds up to the bounded cap,
  # asserting safety on every one. A dedicated job because the instrumented build +
  # sweep is heavier than the plain `cargo nextest` run. Mirrors moonpool's `sim`
  # job.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run sancov simulation sweep
        run: nix develop --command cargo xtask sim run-all
