name: Tests

# A change that touches only Markdown, docs/ or the site (website/site/) runs no Rust job.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/site/**', 'specs/**', 'scripts/check-tla.sh', 'scripts/check-proofs.sh', 'scripts/proof-hashes.sh', 'scripts/mutate-tla.py', 'scripts/tla-minutes.txt', 'scripts/mutate-tla-shards.txt', '.github/workflows/tla.yml', '.github/workflows/tla-mutants.yml', '.github/workflows/tla-mutants-slices.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/site/**', 'specs/**', 'scripts/check-tla.sh', 'scripts/check-proofs.sh', 'scripts/proof-hashes.sh', 'scripts/mutate-tla.py', 'scripts/tla-minutes.txt', 'scripts/mutate-tla-shards.txt', '.github/workflows/tla.yml', '.github/workflows/tla-mutants.yml', '.github/workflows/tla-mutants-slices.yml']

# A new push cancels a pull request's older run, never a run on main
# (#920 (sweep budget)): each merged commit gets its whole sweep, so a red on
# main names the merge that brought it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which jobs a pull request needs (`scripts/ci-plan.py rust`). `rust` is
  # false when every changed path is browser side, a document or a TLA+ input:
  # website/**, scripts/build-wasm.sh, Markdown, docs/, specs/** and the TLA+
  # scripts. Then only the `wasm` job runs (the bundle and the traces). A push
  # to main always runs everything.
  scope:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request's checkout is its merge into the tip of main: the first
      # parent is that tip, so the diff holds what the pull request brings.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/ci-plan.py rust --base HEAD^1
          else
            scripts/ci-plan.py rust --all
          fi

  # The fast checks, in one job so that they take one runner (GitHub runs at
  # most 40 jobs at a time for the account): formatting and the repository
  # scripts, clippy and the rustdoc links, the examples, and portability.
  checks:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - name: Run cargo fmt
        run: nix develop --command cargo fmt --all -- --check
      # #722 (three products): foo.rs + foo/, no mod.rs, no #[path] includes.
      - name: Check the module style
        run: scripts/check-module-style.sh
      # #730 (paros-consensus rework): foundations <- roles <- deployments.
      - name: Check the paros-consensus layers
        run: scripts/check-core-layers.sh && scripts/check-core-layers.sh --self-test
      # #248 (TigerStyle assertions): the assertions per function of paros-consensus only go up.
      # The floor is the density of main, to four places; a pull request that raises the density raises it.
      - name: Check the paros-consensus assertion density
        run: scripts/count-assertions.py --min 1.6580
      # docs/journal/04-roles.md §J4.3: no runtime, I/O or storage dependency in the pure crates.
      - name: Check the pure crates' dependencies
        run: nix develop --command scripts/check-core-deps.sh
      # docs/architecture/04-roles.md §4.4: the layer table (scripts/layers.sh), no dependency
      # up or sideways, no name of a higher crate, no fault switch in a pure crate. `cargo metadata --no-deps`, no build.
      - name: Check the layers of the crates
        run: nix develop --command scripts/check-layers.sh
      # AGENTS.md, "Examples": every composing crate has examples, and the examples steps of the `checks` job run each one.
      - name: Check the examples of the composing crates
        run: scripts/check-examples.sh
      - name: Run cargo clippy
        run: nix develop --command cargo clippy --all-targets -- --deny warnings
      - name: Check the core's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-consensus --no-deps
      - name: Check the journal core's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-journal --no-deps
      - name: Check the grid controller's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-journal-control --no-deps
      - name: Check the journal IO crate's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-journal-io --no-deps
      # The examples (`crates/lib/paros-consensus/examples/`) drive the composable roles by hand
      # or `ColocatedNode` as a driver does, and assert the property each one shows, so running
      # them is a test of the public API's shape as much as of the protocol. The examples of
      # `paros-journal` (`crates/lib/paros-journal/examples/`, #1370 (journal examples)) and of
      # `paros-journal-io` (#1329) do the same for the journal fold and for the journal roles on
      # the traits and the driver, with backends in memory and a storage written by hand. The
      # examples of the facade `paros` run a journal through `paros::` paths alone, in one process
      # (`journal`) and on three tokio tasks (`tokio_tasks`; tokio is a dev-dependency of the facade). Every composing
      # crate has examples (`scripts/check-examples.sh`). They are linted under the
      # same pedantic clippy as the crate by the clippy step's `--all-targets` above.
      - name: Run single_decree
        run: nix develop --command cargo run -p paros-consensus --example single_decree
      - name: Run multi_paxos
        run: nix develop --command cargo run -p paros-consensus --example multi_paxos
      - name: Run matchmaker
        run: nix develop --command cargo run -p paros-consensus --example matchmaker
      - name: Run acceptor_grid
        run: nix develop --command cargo run -p paros-consensus --example acceptor_grid
      - name: Run quorum_read
        run: nix develop --command cargo run -p paros-consensus --example quorum_read
      - name: Run proxy_leader
        run: nix develop --command cargo run -p paros-consensus --example proxy_leader
      - name: Run replica_tier
        run: nix develop --command cargo run -p paros-consensus --example replica_tier
      - name: Run quickstart
        run: nix develop --command cargo run -p paros-consensus --example quickstart
      - name: Run journal_calls
        run: nix develop --command cargo run -p paros-consensus --example journal_calls
      - name: Run leader_handoff
        run: nix develop --command cargo run -p paros-consensus --example leader_handoff
      - name: Run reconfiguration
        run: nix develop --command cargo run -p paros-consensus --example reconfiguration
      - name: Run the journal example fold
        run: nix develop --command cargo run -p paros-journal --example fold
      - name: Run the journal example register
        run: nix develop --command cargo run -p paros-journal --example register
      - name: Run the journal example in_memory
        run: nix develop --command cargo run -p paros-journal-io --example in_memory
      - name: Run the journal example custom_storage
        run: nix develop --command cargo run -p paros-journal-io --example custom_storage
      - name: Run the journal example multi_writer
        run: nix develop --command cargo run -p paros-journal-io --example multi_writer
      - name: Run the journal example single_writer
        run: nix develop --command cargo run -p paros-journal-io --example single_writer
      - name: Run the grid controller example controller
        run: nix develop --command cargo run -p paros-journal-control --example controller
      - name: Run the grid controller example driver
        run: nix develop --command cargo run -p paros-journal-control --example driver
      - name: Run the facade example journal
        run: nix develop --command cargo run -p paros --example journal
      - name: Run the facade example tokio_tasks
        run: nix develop --command cargo run -p paros --example tokio_tasks
      # nextest runs no doc test, so the examples of the rustdoc run here.
      - name: Run the doc examples
        run: nix develop --command cargo test --doc -p paros-consensus -p paros-journal-io

      # The sans-IO core and the library facade stay portable to wasm32: paros-consensus
      # is zero-dep/std-only. The browser build itself is the `wasm` job.
      - name: Check paros-consensus builds for wasm with every feature off (zero deps)
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-consensus --no-default-features
      - name: Check paros-consensus with the serde derives on (no crate enables the feature)
        run: nix develop --command cargo check -p paros-consensus --features serde
      # Every pure crate (layers 0 to 5 of scripts/layers.sh) builds for wasm32-unknown-unknown.
      - name: Build each pure crate for wasm32-unknown-unknown
        run: nix develop --command scripts/check-layers.sh --wasm
      - name: Build paros (the library facade) for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros
      # The two public crates (`release-plz.toml`) build as crates.io builds
      # them: from the packaged files, with each git dependency replaced by its
      # `version` (moonpool-assertions from crates.io). Nothing is uploaded.
      - name: Package the public crates as crates.io builds them
        run: nix develop --command cargo publish --dry-run --workspace --locked

  test:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      # The test build took 3m25s from nothing on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          cache-on-failure: true
      # The coverage gate walks every flavor at its full budget: it runs in
      # release, in the `coverage` job, and not here in debug. The edits of
      # recorded traces run TLC on hundreds of edited walks, and the driver
      # mutants of each flavor on dozens of walks: they run in release, in the
      # `trace-edits` job.
      - name: Run cargo nextest
        run: >-
          nix develop --command cargo nextest run --profile ci
          -E 'not (package(consensus-sim) & (binary(coverage) | (binary(traces) & (test(edited) | test(no_record) | test(driver_mutants)))))'

  # The edits of recorded traces (#1308 (mutate recorded traces)): each trace
  # spec refuses every named edit of its recorded walks at the edited event or
  # after it, and refuses a learn whose record is gone; and each trace spec
  # refuses the driver mutants of other flavors (#1198). A change of the
  # walks can change the traces they start from, so they run for a change of
  # the code. In debug they took the `test` job over its 30 minutes.
  trace-edits:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - uses: Swatinem/rust-cache@v2
        with:
          key: trace-edits
          cache-on-failure: true
      - name: Check that every trace spec refuses the edits of its walks
        run: >-
          nix develop --command cargo nextest run --profile ci --release
          -p consensus-sim --test traces -E 'test(edited) | test(no_record) | test(driver_mutants)'

  # Coverage-driven simulation with real branch coverage (#1199): the coverage
  # gate of consensus-sim, with `paros-consensus` alone instrumented by
  # SanitizerCoverage, so a run that covers a new edge of the core is
  # branched too. A separate target directory keeps the instrumented build
  # apart from the plain one. Every core probe must be reached: the gate has
  # no list of excused probes. Each walk runs in its own process, one per CPU,
  # at the gate's own budget (`tests/coverage.rs`). The `test` job leaves the
  # gate out.
  #
  # Each job has 30 minutes (Pierre, 2026-11-20), so the walks are split over
  # two shards (a shard took 6 to 7 minutes when there were four). A shard
  # walks every second walk and saves what each reached (`COVERAGE_SHARD`,
  # `COVERAGE_SAVE`). The `coverage` job judges the union of the two shards
  # (`COVERAGE_FROM`): every probe reached, every allowed move made, no walk
  # missing.
  coverage-shard:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - uses: Swatinem/rust-cache@v2
        with:
          key: sancov
          workspaces: ". -> target/sancov"
          cache-on-failure: true
      - name: Walk one shard of the coverage gate on instrumented code
        env:
          SANCOV_CRATES: paros_consensus
          COVERAGE_SHARD: ${{ matrix.shard }}/2
          COVERAGE_SAVE: ${{ github.workspace }}/coverage-walks
        run: >-
          RUSTC_WRAPPER="$PWD/scripts/sancov-rustc.sh"
          nix develop --command cargo nextest run --profile ci --release
          --target-dir target/sancov -p consensus-sim --test coverage --no-capture
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-walks-${{ matrix.shard }}
          path: coverage-walks/
          if-no-files-found: error

  coverage:
    needs: [scope, coverage-shard]
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-walks-*
          path: coverage-walks/
          merge-multiple: true
      - name: Judge the union of the shards
        env:
          COVERAGE_FROM: ${{ github.workspace }}/coverage-walks
        run: >-
          nix develop --command cargo nextest run --profile ci --release
          -p consensus-sim --test coverage --no-capture

  # The jobs of `mutants` (`scripts/mutants-plan.sh`): one for each shard of
  # each crate whose `src/` the pull request changes. Its input is the diff of
  # the four `src/` folders from the tip of main; a crate with an empty diff has
  # no mutant to test, so no job of it runs.
  mutants-plan:
    needs: scope
    if: ${{ github.event_name == 'pull_request' && needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: plan
        run: scripts/mutants-plan.sh HEAD^1

  # Mutation testing of the lines a pull request changes in paros-consensus,
  # in paros-journal, in paros-journal-control and in paros-journal-io
  # (`.cargo/mutants.toml`, `scripts/mutants.sh`): each mutant of a changed
  # line must be caught by the crate's tests or the simulation (the fast tests
  # first, then the trace checks for the mutants they miss). A survivor fails
  # the job: add the test that sees it in the same pull request. Each crate
  # runs in shards of its own (`--shard k/n`, round-robin, so that the slow
  # mutants of one function spread over the shards; `scripts/mutants-plan.sh`),
  # so a large pull request stays inside the 90 minutes of a job. The `Mutants`
  # workflow runs every mutant of the core each week.
  mutants:
    needs: mutants-plan
    if: ${{ needs.mutants-plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutants-plan.outputs.matrix) }}
    name: mutants (${{ matrix.crate }} ${{ matrix.shard }}/${{ matrix.of }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix
      # The checkout is the merge of the pull request into the tip of main:
      # its first parent is that tip, so the diff holds the lines the pull
      # request brings, numbered as in the tree the mutants are built from.
      # The base sha of the event can be older than that tip, and a diff from
      # it would also hold what main merged since.
      # A mutant can make a test allocate without end (a decoder that reads
      # no byte for each item of a list): the host then shuts the whole runner
      # down. earlyoom sends SIGTERM to a test binary when less than 8 % of
      # the memory is free, so the test fails and the mutant is caught, as in
      # the `Mutants` workflow (`mutants.yml`). The build tools and the runner
      # are never chosen.
      - name: Start earlyoom
        run: |
          earlyoom=$(nix build --inputs-from . 'nixpkgs#earlyoom^out' --print-out-paths --no-link)/bin/earlyoom
          sudo "$earlyoom" -m 8 -s 100 -r 0 \
            --prefer '^(paros_consensu|consensus_sim|paros_journal|journal_sim|flavors|walks|mutants|traces|coverage|host)' \
            --avoid '^(java|cargo|rustc|nix|node|Runner\.|earlyoom)' \
            > earlyoom.log 2>&1 &
      # `scripts/mutants.sh` (no flag) is paros-consensus; `--journal` adds the
      # trace checks of journal-sim as a second pass; `--control` and
      # `--journal-io` run one pass.
      - name: Run the mutants of the changed lines
        env:
          CRATE: ${{ matrix.crate }}
          FLAG: ${{ matrix.flag }}
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: |
          set -euo pipefail
          git diff HEAD^1 HEAD -- "crates/lib/$CRATE/src" > crate.diff
          # shellcheck disable=SC2086 # FLAG is empty or one word.
          nix develop --command scripts/mutants.sh $FLAG --in-diff crate.diff \
            --shard "$SHARD" --sharding round-robin
      - name: Show the survivors
        if: failure()
        run: |
          echo "== processes that earlyoom stopped"; grep -i 'sending SIG' earlyoom.log || true
          cat survivors.txt 2>/dev/null || true

  # The site's wasm tool (#540): `paros-wasm`, built for wasm32-unknown-unknown
  # (`paxos`: the step-through engine on paros-consensus). Then the step-through
  # traces of the Paxos pages (committed; a stale copy fails the diff). Every
  # tool comes from the flake.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - name: Re-record the step-through traces of the Paxos and Segments pages and check they are committed (#811 (Paxos flavor pages), #1365 (reshape and seal step-through))
        run: |
          nix develop --command cargo test -p paros-wasm --test paxos_traces --test journal_traces
          git diff --exit-code -- website/site/src/traces
      - name: Build the wasm tool
        run: nix develop --command scripts/build-wasm.sh --wasm-only
