name: Tests

# A change that touches only Markdown, docs/ or the site (website/site/) runs no Rust job.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/site/**', 'specs/**', 'scripts/check-tla.sh', '.github/workflows/tla.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/site/**', 'specs/**', 'scripts/check-tla.sh', '.github/workflows/tla.yml']

# A new push cancels a pull request's older run, never a run on main
# (#920 (sweep budget)): each merged commit gets its whole sweep, so a red on
# main names the merge that brought it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which jobs a pull request needs. `rust` is false when every changed path is
  # browser side or a TLA+ spec: website/**, scripts/build-wasm.sh, Markdown, docs/,
  # specs/** or scripts/check-tla.sh. Then
  # only the `wasm` job runs (the bundle and the traces).
  # A push to main always runs everything.
  scope:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          other=$(git diff --name-only "$BASE"...HEAD \
            | grep -vE '^(website/|docs/|specs/|scripts/build-wasm\.sh$|scripts/check-tla\.sh$|\.github/workflows/tla\.yml$)|\.md$' || true)
          if [ -n "$other" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  clippy:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo clippy
        run: nix develop --command cargo clippy --all-targets -- --deny warnings
      - name: Check the core's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-consensus --no-deps
      - name: Check the journal core's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-journal --no-deps
      - name: Check the grid controller's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-journal-control --no-deps

  fmt:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo fmt
        run: nix develop --command cargo fmt --all -- --check
      # #722 (three products): foo.rs + foo/, no mod.rs, no #[path] includes.
      - name: Check the module style
        run: scripts/check-module-style.sh
      # #730 (paros-consensus rework): foundations <- roles <- deployments.
      - name: Check the paros-consensus layers
        run: scripts/check-core-layers.sh
      # docs/journal/04-roles.md §J4.3: no runtime, I/O or storage dependency in the pure crates.
      - name: Check the pure crates' dependencies
        run: nix develop --command scripts/check-core-deps.sh

  test:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # The test build took 3m25s from nothing on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          cache-on-failure: true
      # The coverage gate walks every flavor at its full budget: it runs in
      # release, in the `coverage` job, and not here in debug. The edits of
      # recorded traces run TLC on hundreds of edited walks: they run in
      # release, in the `trace-edits` job.
      - name: Run cargo nextest
        run: >-
          nix develop --command cargo nextest run --profile ci
          -E 'not (package(consensus-sim) & (binary(coverage) | (binary(traces) & (test(edited) | test(no_record)))))'

  # The edits of recorded traces (#1308 (mutate recorded traces)): each trace
  # spec refuses every named edit of its recorded walks at the edited event or
  # after it, and refuses a learn whose record is gone. A change of the
  # walks can change the traces they start from, so they run for a change of
  # the code. In debug they took the `test` job over its 30 minutes.
  trace-edits:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          key: trace-edits
          cache-on-failure: true
      - name: Check that every trace spec refuses the edits of its walks
        run: >-
          nix develop --command cargo nextest run --profile ci --release
          -p consensus-sim --test traces -E 'test(edited) | test(no_record)'

  # Coverage-driven simulation with real branch coverage (#1199): the coverage
  # gate of consensus-sim, with `paros-consensus` alone instrumented by
  # SanitizerCoverage, so a run that covers a new edge of the core is
  # branched too. A separate target directory keeps the instrumented build
  # apart from the plain one. Every core probe must be reached: the gate has
  # no list of excused probes. Each walk runs in its own process, one per CPU,
  # at the gate's own budget (`tests/coverage.rs`). The `test` job leaves the
  # gate out.
  #
  # Each job has 30 minutes (Pierre, 2026-11-20), so the walks are split over
  # four shards. A shard walks every fourth walk and saves what each reached
  # (`COVERAGE_SHARD`, `COVERAGE_SAVE`). The `coverage` job judges the union
  # of the four shards (`COVERAGE_FROM`): every probe reached, every allowed
  # move made, no walk missing.
  coverage-shard:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          key: sancov
          workspaces: ". -> target/sancov"
          cache-on-failure: true
      - name: Walk one shard of the coverage gate on instrumented code
        env:
          SANCOV_CRATES: paros_consensus
          COVERAGE_SHARD: ${{ matrix.shard }}/4
          COVERAGE_SAVE: ${{ github.workspace }}/coverage-walks
        run: >-
          RUSTC_WRAPPER="$PWD/scripts/sancov-rustc.sh"
          nix develop --command cargo nextest run --profile ci --release
          --target-dir target/sancov -p consensus-sim --test coverage --no-capture
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-walks-${{ matrix.shard }}
          path: coverage-walks/
          if-no-files-found: error

  coverage:
    needs: [scope, coverage-shard]
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-walks-*
          path: coverage-walks/
          merge-multiple: true
      - name: Judge the union of the shards
        env:
          COVERAGE_FROM: ${{ github.workspace }}/coverage-walks
        run: >-
          nix develop --command cargo nextest run --profile ci --release
          -p consensus-sim --test coverage --no-capture

  # Mutation testing of the lines a pull request changes in paros-consensus,
  # in paros-journal and in paros-journal-control
  # (`.cargo/mutants.toml`, `scripts/mutants.sh`): each mutant of a changed
  # line must be caught by the core's tests or the simulation (the fast tests
  # first, then the trace checks for the mutants they miss). A survivor fails
  # the job: add the test that sees it in the same pull request. The `Mutants`
  # workflow runs every mutant of the core each week.
  mutants:
    needs: scope
    if: ${{ github.event_name == 'pull_request' && needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # The checkout is the merge of the pull request into the tip of main:
      # its first parent is that tip, so the diff holds the lines the pull
      # request brings, numbered as in the tree the mutants are built from.
      # The base sha of the event can be older than that tip, and a diff from
      # it would also hold what main merged since.
      # A mutant can make a test allocate without end (a decoder that reads
      # no byte for each item of a list): the host then shuts the whole runner
      # down. earlyoom sends SIGTERM to a test binary when less than 8 % of
      # the memory is free, so the test fails and the mutant is caught, as in
      # the `Mutants` workflow (`mutants.yml`). The build tools and the runner
      # are never chosen.
      - name: Start earlyoom
        run: |
          earlyoom=$(nix build --inputs-from . 'nixpkgs#earlyoom^out' --print-out-paths --no-link)/bin/earlyoom
          sudo "$earlyoom" -m 8 -s 100 -r 0 \
            --prefer '^(paros_consensu|consensus_sim|paros_journal|journal_sim|flavors|walks|mutants|traces|coverage)' \
            --avoid '^(java|cargo|rustc|nix|node|Runner\.|earlyoom)' \
            > earlyoom.log 2>&1 &
      - name: Run the mutants of the changed lines
        run: |
          set -euo pipefail
          git diff HEAD^1 HEAD -- crates/lib/paros-consensus/src > pr.diff
          if [ ! -s pr.diff ]; then
            echo "The pull request changes no line of paros-consensus/src."
            exit 0
          fi
          nix develop --command scripts/mutants.sh --in-diff pr.diff
      # The same for the journal core (`scripts/mutants.sh --journal`): its
      # unit tests and the walks of journal-sim, then the trace checks of
      # journal-sim for the mutants they miss.
      - name: Run the mutants of the changed lines of paros-journal
        run: |
          set -euo pipefail
          git diff HEAD^1 HEAD -- crates/lib/paros-journal/src > journal.diff
          if [ ! -s journal.diff ]; then
            echo "The pull request changes no line of paros-journal/src."
            exit 0
          fi
          nix develop --command scripts/mutants.sh --journal --in-diff journal.diff
      # The same for the grid controller (`scripts/mutants.sh --control`): its
      # unit tests and journal-sim's sweep of its decisions, in one pass.
      - name: Run the mutants of the changed lines of paros-journal-control
        run: |
          set -euo pipefail
          git diff HEAD^1 HEAD -- crates/lib/paros-journal-control/src > control.diff
          if [ ! -s control.diff ]; then
            echo "The pull request changes no line of paros-journal-control/src."
            exit 0
          fi
          nix develop --command scripts/mutants.sh --control --in-diff control.diff
      - name: Show the survivors
        if: failure()
        run: |
          echo "== processes that earlyoom stopped"; grep -i 'sending SIG' earlyoom.log || true
          cat survivors.txt 2>/dev/null || true

  # The examples (`crates/lib/paros-consensus/examples/`) drive the composable roles by hand
  # or `ColocatedNode` as a driver does, and assert the property each one shows, so running
  # them is a test of the public API's shape as much as of the protocol. The examples of
  # `paros-journal` (`crates/lib/paros-journal/examples/`, #1370 (journal examples)) do the
  # same for the journal fold and the journal roles, with storage written by hand. They are linted under the
  # same pedantic clippy as the crate by the root clippy job's `--all-targets`.
  examples:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run single_decree
        run: nix develop --command cargo run -p paros-consensus --example single_decree
      - name: Run multi_paxos
        run: nix develop --command cargo run -p paros-consensus --example multi_paxos
      - name: Run matchmaker
        run: nix develop --command cargo run -p paros-consensus --example matchmaker
      - name: Run acceptor_grid
        run: nix develop --command cargo run -p paros-consensus --example acceptor_grid
      - name: Run quorum_read
        run: nix develop --command cargo run -p paros-consensus --example quorum_read
      - name: Run proxy_leader
        run: nix develop --command cargo run -p paros-consensus --example proxy_leader
      - name: Run replica_tier
        run: nix develop --command cargo run -p paros-consensus --example replica_tier
      - name: Run quickstart
        run: nix develop --command cargo run -p paros-consensus --example quickstart
      - name: Run journal_calls
        run: nix develop --command cargo run -p paros-consensus --example journal_calls
      - name: Run leader_handoff
        run: nix develop --command cargo run -p paros-consensus --example leader_handoff
      - name: Run reconfiguration
        run: nix develop --command cargo run -p paros-consensus --example reconfiguration
      - name: Run the journal example fold
        run: nix develop --command cargo run -p paros-journal --example fold
      - name: Run the journal example in_memory
        run: nix develop --command cargo run -p paros-journal --example in_memory
      # nextest runs no doc test, so the examples of the rustdoc run here.
      - name: Run the doc examples
        run: nix develop --command cargo test --doc -p paros-consensus

  # The sans-IO core and the library facade stay portable to wasm32: paros-consensus
  # is zero-dep/std-only. The browser build itself is the `wasm` job.
  portability:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build paros-consensus for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-consensus
      - name: Check paros-consensus builds for wasm with every feature off (zero deps)
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-consensus --no-default-features
      - name: Check paros-consensus with the serde derives on (no crate enables the feature)
        run: nix develop --command cargo check -p paros-consensus --features serde
      - name: Build paros-journal (the journal core) for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-journal
      - name: Build paros-journal-control (the grid controller) for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-journal-control
      - name: Build paros (the library facade) for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros
      # The two public crates (`release-plz.toml`) build as crates.io builds
      # them: from the packaged files, with each git dependency replaced by its
      # `version` (moonpool-assertions from crates.io). Nothing is uploaded.
      - name: Package the public crates as crates.io builds them
        run: nix develop --command cargo publish --dry-run --workspace --locked

  # The site's wasm tool (#540): `paros-wasm`, built for wasm32-unknown-unknown
  # (`paxos`: the step-through engine on paros-consensus). Then the step-through
  # traces of the Paxos pages (committed; a stale copy fails the diff). Every
  # tool comes from the flake.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Re-record the Paxos pages' step-through traces and check they are committed (#811 (Paxos flavor pages))
        run: |
          nix develop --command cargo test -p paros-wasm --test paxos_traces
          git diff --exit-code -- website/site/src/traces
      - name: Build the wasm tool
        run: nix develop --command scripts/build-wasm.sh --wasm-only
