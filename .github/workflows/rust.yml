name: Tests

# A change that touches only Markdown, docs/ or the site (website/site/) runs no Rust job.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/site/**', 'specs/**', 'scripts/check-tla.sh', 'scripts/check-proofs.sh', 'scripts/proof-hashes.sh', 'scripts/mutate-tla.py', 'scripts/tla-minutes.txt', 'scripts/mutate-tla-shards.txt', '.github/workflows/tla.yml', '.github/workflows/tla-mutants.yml', '.github/workflows/tla-mutants-slices.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/site/**', 'specs/**', 'scripts/check-tla.sh', 'scripts/check-proofs.sh', 'scripts/proof-hashes.sh', 'scripts/mutate-tla.py', 'scripts/tla-minutes.txt', 'scripts/mutate-tla-shards.txt', '.github/workflows/tla.yml', '.github/workflows/tla-mutants.yml', '.github/workflows/tla-mutants-slices.yml']

# A new push cancels a pull request's older run, never a run on main
# (#920 (sweep budget)): each merged commit gets its whole sweep, so a red on
# main names the merge that brought it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The sets of tests that the jobs below split (nextest filter expressions).
  # Every test of the workspace runs in exactly one job: `test` runs the
  # complement of COVERAGE and TRACES, the two shards of `trace-edits` run
  # EDITS, which is inside TRACES, cut in two by count, and the two shards of
  # `traces` run the rest of TRACES, cut in two by REFUSALS. `coverage-shard`
  # runs COVERAGE (`--test coverage`).
  COVERAGE: package(consensus-sim) & binary(coverage)
  TRACES: package(consensus-sim) & binary(traces)
  EDITS: package(consensus-sim) & binary(traces) & (test(edited) | test(no_record) | test(driver_mutants))
  REFUSALS: package(consensus-sim) & binary(traces) & test(/^tlc_refuses_/)

jobs:
  # Which jobs a pull request needs (`scripts/ci-plan.py rust`). `rust` is
  # false when every changed path is browser side, a document or a TLA+ input:
  # website/**, scripts/build-wasm.sh, Markdown, docs/, specs/** and the TLA+
  # scripts. Then only the `wasm` job runs (the bundle and the traces). A push
  # to main always runs everything.
  scope:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request's checkout is its merge into the tip of main: the first
      # parent is that tip, so the diff holds what the pull request brings.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/ci-plan.py rust --base HEAD^1
          else
            scripts/ci-plan.py rust --all
          fi

  # The fast checks, in one job so that they take one runner (GitHub runs at
  # most 40 jobs at a time for the account): formatting and the repository
  # scripts, clippy and the rustdoc links, the examples, and portability.
  checks:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - name: Run cargo fmt
        run: nix develop --command cargo fmt --all -- --check
      # #722 (three products): foo.rs + foo/, no mod.rs, no #[path] includes.
      - name: Check the module style
        run: scripts/check-module-style.sh
      # #730 (paros-consensus rework): foundations <- roles <- deployments.
      - name: Check the paros-consensus layers
        run: scripts/check-core-layers.sh && scripts/check-core-layers.sh --self-test
      # #248 (TigerStyle assertions): the assertions per function of paros-consensus only go up.
      # The floor is the density of main, to four places; a pull request that raises the density raises it.
      - name: Check the paros-consensus assertion density
        run: scripts/count-assertions.py --min 1.6805
      # docs/architecture/04-roles.md §4.4: no runtime, I/O or storage dependency in the pure crates.
      - name: Check the pure crates' dependencies
        run: nix develop --command scripts/check-core-deps.sh
      # docs/architecture/04-roles.md §4.4: the layer table (scripts/layers.sh), no dependency
      # up or sideways, no name of a higher crate, no fault switch in a pure crate. `cargo metadata --no-deps`, no build.
      - name: Check the layers of the crates
        run: nix develop --command scripts/check-layers.sh
      # AGENTS.md, "Examples": every composing crate has examples, and the examples steps of the `checks` job run each one.
      - name: Check the examples of the composing crates
        run: scripts/check-examples.sh
      - name: Run cargo clippy
        run: nix develop --command cargo clippy --all-targets -- --deny warnings
      - name: Check the core's rustdoc links
        run: RUSTDOCFLAGS="-D warnings" nix develop --command cargo doc -p paros-consensus --no-deps
      # The examples (`crates/lib/paros-consensus/examples/`) drive the deployments as a
      # driver does (`grow`; `single_decree` drives `Decree`), and assert the property each one
      # shows, so running them is a test of the public API's shape as much as of the protocol. The example of the
      # facade `paros` drives three nodes through `paros::` paths alone (`consensus`). Every composing
      # crate has examples (`scripts/check-examples.sh`). They are linted under the
      # same pedantic clippy as the crate by the clippy step's `--all-targets` above.
      - name: Run single_decree
        run: nix develop --command cargo run -p paros-consensus --example single_decree
      - name: Run grow
        run: nix develop --command cargo run -p paros-consensus --example grow
      - name: Run the facade example consensus
        run: nix develop --command cargo run -p paros --example consensus
      # nextest runs no doc test, so the examples of the rustdoc run here.
      - name: Run the doc examples
        run: nix develop --command cargo test --doc -p paros-consensus

      # The sans-IO core and the library facade stay portable to wasm32: paros-consensus
      # is zero-dep/std-only. The browser build itself is the `wasm` job.
      - name: Check paros-consensus builds for wasm with every feature off (zero deps)
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros-consensus --no-default-features
      - name: Check paros-consensus with the serde derives on (no crate enables the feature)
        run: nix develop --command cargo check -p paros-consensus --features serde
      # Every pure crate (layers 0 to 5 of scripts/layers.sh) builds for wasm32-unknown-unknown.
      - name: Build each pure crate for wasm32-unknown-unknown
        run: nix develop --command scripts/check-layers.sh --wasm
      - name: Build paros (the library facade) for wasm32-unknown-unknown
        run: nix develop --command cargo check --target wasm32-unknown-unknown -p paros
      # The two public crates (`release-plz.toml`) build as crates.io builds
      # them: from the packaged files, with each git dependency replaced by its
      # `version` (moonpool-assertions from crates.io). Nothing is uploaded.
      - name: Package the public crates as crates.io builds them
        run: nix develop --command cargo publish --dry-run --workspace --locked

  # The workspace tests, in debug, without the trace checks and the coverage
  # gate. Each CI job has at most 30 minutes, and the trace checks took the
  # whole `test` job to 33 minutes on main (2026-11-24): they run in the
  # `traces` job. The coverage gate walks every flavor at its full budget: it
  # runs in release, in the `coverage` job. The edits of recorded traces run
  # TLC on hundreds of edited walks, and the driver mutants of each flavor on
  # dozens of walks: they run in release, in the `trace-edits` job.
  # The test sets are the filters of the workflow's `env`.
  test:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      # The test build took 3m25s from nothing on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          cache-on-failure: true
      - name: Run cargo nextest
        run: >-
          nix develop --command cargo nextest run --profile ci
          -E "not (($COVERAGE) | ($TRACES))"

  # The trace checks (#1198 (trace checking)): each walk of consensus-sim
  # is checked against its `*Trace.tla` spec with TLC, in debug as
  # in the `test` job before. The edits of recorded traces are left to
  # `trace-edits`. Two shards keep each job well inside its 30 minutes: the
  # refusals of consensus-sim (`tlc_refuses_*`, which hold the two longest
  # tests, 19 and 13 minutes with four TLC runs at a time) and the rest. The
  # two filters are complements inside TRACES, so every trace check runs in
  # one shard. The `traces` job of the `TLA` workflow runs the same tests,
  # edits too, when this job does not run (`scripts/ci-plan.py`).
  traces:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [refusals, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      # Its own cache: `-p` builds the sim crates with their own features, so
      # the build differs from the workspace build of the `test` job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: traces-${{ matrix.shard }}
          cache-on-failure: true
      - name: Check the walks against the trace specs (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = refusals ]; then
            filter="(($TRACES) & not ($EDITS)) & ($REFUSALS)"
          else
            filter="(($TRACES) & not ($EDITS)) & not ($REFUSALS)"
          fi
          nix develop --command cargo nextest run --profile ci -p consensus-sim -E "$filter"

  # The edits of recorded traces (#1308 (mutate recorded traces)): each trace
  # spec refuses every named edit of its recorded walks at the edited event or
  # after it, and refuses a learn whose record is gone; and each trace spec
  # refuses the driver mutants of other flavors (#1198). A change of the
  # walks can change the traces they start from, so they run for a change of
  # the code. In debug they took the `test` job over its 30 minutes. The set
  # is EDITS of the workflow's `env`. In one job they took 24 minutes on main
  # and 30 on a busy runner, so two shards cut EDITS in two by count
  # (`--partition count:i/2`): every test of EDITS runs in exactly one shard.
  trace-edits:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - uses: Swatinem/rust-cache@v2
        with:
          key: trace-edits
          cache-on-failure: true
      - name: Check that every trace spec refuses the edits of its walks (shard ${{ matrix.shard }} of 2)
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          nix develop --command cargo nextest run --profile ci --release
          -p consensus-sim --test traces -E "$EDITS" --partition "count:$SHARD/2"

  # Coverage-driven simulation with real branch coverage (#1199): the coverage
  # gate of consensus-sim, with `paros-consensus` alone instrumented by
  # SanitizerCoverage, so a run that covers a new edge of the core is
  # branched too. A separate target directory keeps the instrumented build
  # apart from the plain one. Every core probe must be reached: the gate has
  # no list of excused probes. Each walk runs in its own process, one per CPU,
  # at the gate's own budget (`tests/coverage.rs`). The `test` job leaves the
  # gate out.
  #
  # Each job has 30 minutes (Pierre, 2026-11-20), so the walks are split over
  # two shards (a shard took 6 to 7 minutes when there were four). A shard
  # walks every second walk and saves what each reached (`COVERAGE_SHARD`,
  # `COVERAGE_SAVE`). The `coverage` job judges the union of the two shards
  # (`COVERAGE_FROM`): every probe reached, every allowed move made, no walk
  # missing.
  coverage-shard:
    needs: scope
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - uses: Swatinem/rust-cache@v2
        with:
          key: sancov
          workspaces: ". -> target/sancov"
          cache-on-failure: true
      - name: Walk one shard of the coverage gate on instrumented code
        env:
          SANCOV_CRATES: paros_consensus
          COVERAGE_SHARD: ${{ matrix.shard }}/2
          COVERAGE_SAVE: ${{ github.workspace }}/coverage-walks
        run: >-
          RUSTC_WRAPPER="$PWD/scripts/sancov-rustc.sh"
          nix develop --command cargo nextest run --profile ci --release
          --target-dir target/sancov -p consensus-sim --test coverage --no-capture
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-walks-${{ matrix.shard }}
          path: coverage-walks/
          if-no-files-found: error

  coverage:
    needs: [scope, coverage-shard]
    if: ${{ needs.scope.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-walks-*
          path: coverage-walks/
          merge-multiple: true
      - name: Judge the union of the shards
        env:
          COVERAGE_FROM: ${{ github.workspace }}/coverage-walks
        run: >-
          nix develop --command cargo nextest run --profile ci --release
          -p consensus-sim --test coverage --no-capture

  # The site's wasm tool (#540): `paros-wasm`, built for wasm32-unknown-unknown
  # (`paxos`: the step-through engine on paros-consensus). Then the step-through
  # traces of the Paxos pages (committed; a stale copy fails the diff). Every
  # tool comes from the flake.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
      - name: Re-record the step-through traces of the Paxos pages and check they are committed (#811 (Paxos flavor pages))
        run: |
          nix develop --command cargo test -p paros-wasm --test paxos_traces
          git diff --exit-code -- website/site/src/traces
      - name: Build the wasm tool
        run: nix develop --command scripts/build-wasm.sh --wasm-only
