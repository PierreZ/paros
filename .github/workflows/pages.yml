name: Deploy the site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Build (never deploy) a pull request that touches the site, the game or their tooling.
  pull_request:
    paths:
      - "website/**"
      - "crates/support/paros-wasm/**"
      - "scripts/build-wasm.sh"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A pull request builds in its own group, so it never cancels a deploy of main.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build the playground's wasm and stage it at /playground/app/
        run: nix develop --command scripts/build-wasm.sh
      - name: Build the site (Astro, #810 (website redo 1/4))
        run: nix develop --command bash -c 'cd website/site && npm ci --no-audit --no-fund && npm run build'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
