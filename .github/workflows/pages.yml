name: Deploy the site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Build (never deploy) a pull request that touches the site, the game or their tooling.
  pull_request:
    paths:
      - "web/**"
      - "crates/paros-play/**"
      - "web/site/build.sh"
      - "scripts/build-play.sh"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build the site
        run: nix develop --command web/site/build.sh
      - name: Build and stage the game at /play/
        run: nix develop --command scripts/build-play.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./web/site/public

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
