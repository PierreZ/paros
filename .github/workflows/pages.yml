name: Deploy the site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Build and test (never deploy) a pull request that touches the site, its
  # tooling, or a crate that its wasm or its pages show (#1362). The Concepts
  # page is built from the knowledge base (concepts.astro reads
  # docs/knowledge/concepts.md and docs/knowledge/concepts/*.md, the only files
  # outside website/ that a page is built from), so a change there builds the
  # site too. The link check also reads the repository files that the site
  # links to; this filter does not cover all of them yet (#1469).
  pull_request:
    paths:
      - "website/**"
      - "docs/knowledge/concepts.md"
      - "docs/knowledge/concepts/**"
      - "crates/support/paros-wasm/**"
      - "crates/lib/paros-consensus/**"
      - "crates/lib/paros-journal/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/build-wasm.sh"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A pull request builds in its own group, so it never cancels a deploy of main.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The 30-minute budget of every CI job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build the wasm tools and stage them at /paxos/wasm/ and /journal/wasm/
        run: nix develop --command scripts/build-wasm.sh
      - name: Build the site (Astro, #810 (website redo 1/4))
        id: site
        run: nix develop --command bash -c 'cd website/site && npm ci --no-audit --no-fund && npm run build'
      # The site links files at other refs than main (the tag v0.2.0-alpha.1):
      # fetch every tag, so the link check can read them.
      - name: Fetch the tags that the site links
        run: git fetch --depth 1 origin 'refs/tags/*:refs/tags/*'
      - name: Check every link of the built site (#1362)
        run: nix develop --command bash -c 'cd website/site && npm run check-links'
      # It runs after a red link check too, so one run reports both.
      - name: Browser smoke test of the live parts (Playwright, Chromium, #1362)
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        run: nix develop .#site --command bash -c 'cd website/site && npm test'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
