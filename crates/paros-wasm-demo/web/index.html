<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>paros · Paxos in the browser</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* IBM Plex, self-hosted and staged next to this file (build-wasm-demo.sh copies
     them from nixpkgs#ibm-plex). If the woff2 files are absent, the CSS font
     stacks in tokens.js fall back to system-ui / ui-monospace — the demo still
     works, it just loses the exact Plex look. The plex-fonts markers let the
     build script strip this block from the staged copy when staging fails, so
     the book never 404s on fonts that are not there. */
  /* plex-fonts-begin */
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-display: swap;
    src: url('./app/fonts/IBMPlexSans-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; font-display: swap;
    src: url('./app/fonts/IBMPlexSans-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-display: swap;
    src: url('./app/fonts/IBMPlexMono-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; font-display: swap;
    src: url('./app/fonts/IBMPlexMono-Bold.woff2') format('woff2'); }
  /* plex-fonts-end */
  html, body { margin: 0; }
  body {
    background: #0A0C10; color: #E7EBF2;
    font: 15px/1.5 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  body.embed { padding: 10px; }
  #status { color: #7E8798; font-size: 12px; min-height: 1.2em;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  #raw { display: none; width: min(900px, 100%); white-space: pre-wrap; word-break: break-word;
    background: #0F131A; border: 1px solid #222835; border-radius: 12px; padding: 12px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #C9D1DC; }
</style>
</head>
<body>
  <!-- The whole widget renders into #paros-root; the shell owns its own chrome.
       #status is a pre-boot line (hidden once the shell mounts); #raw backs ?dump. -->
  <div id="paros-root"></div>
  <div id="status">loading…</div>
  <pre id="raw"></pre>
  <script type="module" src="./app/main.js"></script>
</body>
</html>
