[package]
name = "parosd"
description = "The paros daemon and the parosctl CLI: every role of a paros deployment over Tokio providers and a real filesystem, and its client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
paros = { path = "../paros", version = "0.2.0" }

# The production providers (#206): the first build of paros that links
# `TokioProviders`. The `paros` library pulls moonpool without them so it
# stays wasm-safe; this binary layers them back on. Same rev as `paros`.
#
# Built together with `paros-sim` (a workspace-wide `cargo build` or
# `nextest`), cargo unifies moonpool-core's features and this binary gets
# moonpool-sim's deterministic `select!` expansion; `cargo build -p parosd`
# alone — the shipped build — keeps tokio's macro verbatim.
moonpool-core = { git = "https://github.com/PierreZ/moonpool", rev = "1112d5ea5787f7a7b51d979bf543cbef77604681", features = ["tokio-providers", "select"] }
# `parosctl`'s client-only RPC runtime, under `paros::client`.
moonpool-rpc = { git = "https://github.com/PierreZ/moonpool", rev = "1112d5ea5787f7a7b51d979bf543cbef77604681", default-features = false, features = ["prost"] }

clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# `parosctl --json`.
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
