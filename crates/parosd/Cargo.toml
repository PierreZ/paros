[package]
name = "parosd"
description = "The paros daemon and the parosctl CLI: every role of a paros deployment over Tokio providers and a real filesystem, and its client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
paros = { path = "../paros", version = "0.2.0", features = ["tls"] }
# `parosctl key` and `parosctl token` (#400): Biscuit keys and tokens, offline.
paros-authz-biscuit = { path = "../paros-authz-biscuit" }

# The production providers: moonpool's `CompioProviders`, the local
# (non-`Send`) bundle on compio's thread-per-core runtime (io_uring on Linux,
# polling where a seccomp profile or an old kernel refuses it). Every
# binary of this crate runs on one compio thread. The `paros` library pulls
# moonpool without them so it stays wasm-safe; this crate layers them back
# on. Same rev as `paros`.
#
# Built together with `paros-sim` (a workspace-wide `cargo build` or
# `nextest`), cargo unifies moonpool-core's features and this binary gets
# moonpool-sim's deterministic `select!` expansion; `cargo build -p parosd`
# alone — the shipped build — keeps tokio's macro verbatim.
moonpool-core = { git = "https://github.com/PierreZ/moonpool", rev = "9493056dab06be41222753c25629e2061dee6ad0", default-features = false, features = ["compio-providers", "select"] }
# `parosctl`'s client-only RPC runtime, under `paros::client`.
moonpool-rpc = { git = "https://github.com/PierreZ/moonpool", rev = "9493056dab06be41222753c25629e2061dee6ad0", default-features = false, features = ["prost"] }

clap = { version = "4", features = ["derive", "env"] }
# The runtime every binary runs on: one thread, its timers and its signals.
compio = { version = "0.19", default-features = false, features = ["runtime", "time", "signal", "io-uring", "polling"] }
futures = "0.3"
libc = "0.2"
# Only for the OTLP exporters (#366 (metrics)): tonic needs a Tokio runtime,
# so a pushing `parosd` runs one worker thread beside the compio thread.
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
# `PAROS_OTLP_*` (#366 (metrics)): spans and the machine's metrics pushed to
# an OpenTelemetry collector over OTLP/gRPC.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
tracing-opentelemetry = "0.34"
# Reading the machine's registry for the OTLP push: paros's version.
prometheus = { version = "0.14", default-features = false }
# `parosctl --json`.
serde_json = "1"
# `parosctl tls show`: a certificate's names, use and validity. The same
# version moonpool-rpc's certificate authority reads authorities with.
x509-parser = "0.18"
# `parosctl bench` (#517): latency histograms, and their raw export.
hdrhistogram = "7"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
