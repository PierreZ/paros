[package]
name = "paros-core"
description = "Sans-IO Multi-Paxos state machine core: no I/O, no clock, no randomness, zero dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# paros-core is std-only and portable to wasm32-unknown-unknown; every
# dependency is optional and observation-only, so `default-features = false`
# gives a dependency-free build (the wasm CI gate checks both). No feature
# touches behavior: `serde` adds derives, `tracing` adds spans, `assertions`
# adds coverage probes. See the turbulence doctrine in AGENTS.md — the core is
# never buggified, and no feature is a perturbation.
[features]
default = ["tracing", "assertions"]
# Derive Serialize/Deserialize on the public protocol types so a driver can put
# the *same* `Message` on the wire (no duplicate DTO). Off by default; serde is
# itself wasm-safe, so the portability guarantee holds.
serde = ["dep:serde"]
# `#[tracing::instrument]` spans on the state machine's entry points and
# message handlers (`ColocatedNode::step`/`tick`/`propose`/…, `on_prepare`, …). On by
# default so `paros` and `paros-sim` see the core's spans under the driver's
# own; disable with `default-features = false` for a zero-dependency build.
# Spans only observe: with the feature off the generated code is the bare
# function body, so the feature can never change a decision the core takes.
tracing = ["dep:tracing"]
# Coverage probes (#317): the crate's `probe!` shim marks rare protocol
# branches with moonpool's `reachable`/`sometimes` accounting, so the
# simulation sweep must reach them. Probes only observe: outside a simulation
# no assertion table is installed and a probe is one pointer read; with the
# feature off a probe compiles to nothing and its condition is never
# evaluated. A probe and a simulation `assert_reachable!` with the same
# message share one slot, so never reword a probe's message.
assertions = ["dep:moonpool-assertions"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }
# Pure std, zero dependencies, wasm-safe. Pinned to the same moonpool rev as
# every other moonpool line (advanced together): the probes must land in the
# simulation's own assertion table, so the workspace must resolve one copy.
# `version` is what a crates.io publish of paros-core resolves instead.
moonpool-assertions = { git = "https://github.com/PierreZ/moonpool", rev = "d2788360bc96cb8ea0fb4217a0fb4c68139dfb7c", version = "0.8", optional = true }

[lints]
workspace = true
