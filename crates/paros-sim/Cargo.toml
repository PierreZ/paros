[package]
name = "paros-sim"
description = "Deterministic-simulation harness for paros: the moonpool Process adapter, the workload, the fault world, and the audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The node driver + RPC contract + MemStorage live in `paros` (the library); this
# crate is just the DST harness on top: the `Process` adapter, workloads, oracles.
paros = { path = "../paros", version = "0.2.0", features = ["tls"] }
# The Biscuit authorization the frontends run (#192 (the frontend), #245):
# the same `BiscuitAuthz` `paros-frontend` ships.
paros-authz-biscuit = { path = "../paros-authz-biscuit" }

# moonpool is pinned to a commit on `main` (not the crates.io release): it evolves
# fast and we track it deliberately, bumping `rev` by hand. The sim needs only the
# simulated providers plus the fork-free timeline explorer.
moonpool-sim = { git = "https://github.com/PierreZ/moonpool", rev = "3e919b56b193de1f8eb0b915245211e3f5370c9d", default-features = false, features = ["exploration"] }

async-trait = "0.1"
# `join_all`, so the chain workload can fan concurrent proposals out (the
# priming batch, the dual-submit and duplicate-repropose operations) and await
# them together.
futures = "0.3"
# The workloads' own RPC runtime (a client-only moonpool-rpc driver per
# workload), same rev as every other moonpool line.
moonpool-rpc = { git = "https://github.com/PierreZ/moonpool", rev = "3e919b56b193de1f8eb0b915245211e3f5370c9d", default-features = false, features = ["prost"] }
# `CancellationToken`, to stop a workload's client runtime when it drops.
tokio-util = "0.7"
tracing = "0.1"

# paros-sim builds for the browser (#307 (paros-sim in wasm)). On
# `wasm32-unknown-unknown`, `getrandom` has no source of entropy unless its
# JavaScript backend is on. The run draws nothing from it: every key the
# harness makes comes from the seed. These lines only let the crates that link
# it (Biscuit's keys, rustls's ring) build for wasm32; rustls's own clock is
# unused too (`paros::tls` validates against the simulated time). ring's C code
# needs a clang that targets wasm32 (`CC_wasm32_unknown_unknown`, set by the
# flake).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }
# Biscuit's own `Instant` has no wasm32 source without its `wasm` feature.
# The rev is `paros-authz-biscuit`'s.
biscuit-auth = { git = "https://github.com/eclipse-biscuit/biscuit-rust", rev = "93832a82bf509ad81f05fdb6adaf69d03c56887b", default-features = false, features = ["wasm"] }

[lints]
workspace = true
