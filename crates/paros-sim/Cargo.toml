[package]
name = "paros-sim"
description = "Deterministic-simulation harness for paros: the moonpool Process adapter, the workload, the fault world, and the audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The node driver + RPC contract + MemStorage live in `paros` (the library); this
# crate is just the DST harness on top: the `Process` adapter, workloads, oracles.
paros = { path = "../paros", version = "0.2.0" }

# moonpool is pinned to a commit on `main` (not the crates.io release): it evolves
# fast and we track it deliberately, bumping `rev` by hand. The sim needs only the
# simulated providers plus the fork-free timeline explorer.
moonpool-sim = { git = "https://github.com/PierreZ/moonpool", rev = "3a6d9d215f5745ce2c180f86d38c5a724d6336f7", default-features = false, features = ["exploration"] }

async-trait = "0.1"
# `join_all`, to drive the `Pipelined` workload mode's concurrent proposals.
futures = "0.3"
http = "1"
moonpool-hyper = { git = "https://github.com/PierreZ/moonpool", rev = "3a6d9d215f5745ce2c180f86d38c5a724d6336f7" }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tracing = "0.1"

[lints]
workspace = true
