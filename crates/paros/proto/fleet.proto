syntax = "proto3";

package paros.fleet.v1;

// The fleet tenant's control journal (#229): the fleet's directory, tenant ->
// cell, plus the cell entries (`docs/architecture.md` §3.7). Its identifier is
// random like every identifier (§3.8), drawn at `init`. Each entry is one record
// of a `Write`, written by the fleet tenant's coordinator (whoever claimed the journal
// with `SetLeader`); `paros::fleet::FleetDirectory` is the one fold of them. The core
// keeps the records as opaque as any other.
//
// Every entry names the fleet it was written for and the metadata version
// its writer speaks: a step of a fleet operation that finds another fleet is
// refused (FDB's `MetaclusterOperationContext`), and a reader refuses a
// version it does not understand. The fleet tenant is checkpointed with
// `paros::client::checkpoint` (#227): `FleetDirectoryState` is the checkpoint's state.
//
// Enums are `uint32`s whose `0` is unset and refused: nothing defaults.
message FleetEntry {
  uint64 fleet_id = 1;
  uint32 version = 2;
  oneof kind {
    FormFleet form_fleet = 3;
    AddCell add_cell = 4;
    MarkCell mark_cell = 5;
    RegisterTenant register_tenant = 6;
    MarkTenant mark_tenant = 7;
    RemoveTenant remove_tenant = 8;
    AddRootKey add_root_key = 9;
    RemoveRootKey remove_root_key = 10;
  }
}

// `init`: the fleet tenant records the fleet's id, once, and registers itself as the
// fleet's first tenant (`{internal, fleet}`) under its own identifier. A re-run
// with the same id and identifier changes nothing; anything else is refused.
message FormFleet {
  uint64 fleet_tenant = 1;
  uint64 fleet_journal = 2;
  // The universe's name, for people (#252, #399): a label, never its
  // identity. Kept on the fleet tenant's own entry. The first name written
  // stays: a re-run never renames.
  bytes name = 3;
}

// `init` (and adding a cell, M12): the cell `cell_id` joins the directory,
// `REGISTERING`, and its cell tenant is registered (`{internal, cell}`) under
// the identifier of its control journal.
message AddCell {
  uint64 cell_id = 1;
  uint64 control_tenant = 2;
  uint64 control_journal = 3;
  // The cell's name, for people (#252, #399): a label, never its identity,
  // unique among the universe's cells. Kept on the cell tenant's entry. The
  // first name written stays: a re-run never renames.
  bytes name = 4;
}

// Move cell `cell_id` to `state` (see `CellState` for the transitions).
message MarkCell {
  uint64 cell_id = 1;
  uint32 state = 2;
}

// Tenant creation's first step: tenant `tenant` (a random id its creator
// drew) named `name`, its control journal `control_journal` (random too),
// assigned to cell `cell_id`, `REGISTERING`. Always a `{users}` tenant: the
// tenant API cannot create an `internal` one. A taken id or a taken name is
// refused.
message RegisterTenant {
  uint64 tenant = 1;
  bytes name = 2;
  uint64 cell_id = 3;
  uint64 control_journal = 4;
  // 5 was the `movable`/`pinned` placement, dropped on 2026-10-04 (#243):
  // the groups alone decide whether a tenant moves.
  reserved 5;
  // What the tenant survives (#252): 1 az, 2 region. Mirrored into its
  // control journal (#210).
  uint32 survives = 6;
}

// Move tenant `tenant` to `state` (see `TenantState` for the transitions).
message MarkTenant {
  uint64 tenant = 1;
  uint32 state = 2;
}

// Tenant removal's last step: a `REMOVING` tenant leaves the directory. Its
// id is never reused; its name frees up.
message RemoveTenant {
  uint64 tenant = 1;
}

// A root public key joins the universe entry (#245 (Biscuit tokens)):
// `init --root-public-key` writes the first, `universe key add` the next.
// Every entry role verifies a token against the keys the directory holds.
// A key id or a label any key holds, or ever held, is refused: neither is
// reused. The same key again changes nothing.
message AddRootKey {
  // The Biscuit `root_key_id`: random, never 0.
  uint32 key_id = 1;
  // The key's name, for people: what an operator types.
  string label = 2;
  // The key in Biscuit's text form, `ed25519/<64 hex>`. paros stores it
  // and never reads it: the verifier does.
  string public_key = 3;
}

// `universe key remove`: the key `label` leaves the universe entry, for
// good. The last key is never removed: no token could administer the
// universe again. A removal of a removed key changes nothing.
message RemoveRootKey {
  string label = 1;
}

// One root public key of the universe entry, in a checkpoint.
message RootKey {
  uint32 key_id = 1;
  string label = 2;
  string public_key = 3;
}

// The checkpoint state: the fleet, every cell and tenant entry by id, and
// every removed tenant id — in id order, so equal states encode to equal
// bytes.
message FleetDirectoryState {
  uint64 fleet_id = 1;
  uint32 version = 2;
  repeated CellEntry cells = 3;
  repeated TenantEntry tenants = 4;
  repeated uint64 removed = 5;
  uint64 fleet_tenant = 6;
  uint64 fleet_journal = 7;
  // The root public keys in force, in key id order (#245).
  repeated RootKey root_keys = 8;
  // The keys removed, in key id order: their ids and labels are never
  // reused.
  repeated RootKey removed_keys = 9;
}

message CellEntry {
  uint64 cell_id = 1;
  uint32 state = 2;
  uint32 version = 3;
  uint64 control_tenant = 4;
}

message TenantEntry {
  uint64 tenant = 1;
  bytes name = 2;
  uint64 cell_id = 3;
  uint32 state = 4;
  uint64 config_seq = 5;
  reserved 6;
  uint64 control_journal = 7;
  // 8 was the single group (1 internal, 2 users) and 9 the placement, both
  // replaced by `groups` (metadata version 2, #243).
  reserved 8, 9;
  // The tenant's set of groups, a bit per group: 1 internal, 2 cell, 4
  // fleet, 8 users. Only {internal, fleet} (5), {internal, cell} (3) and
  // {users} (8) exist; any other set is refused.
  uint32 groups = 10;
  // What the tenant survives (#252): 1 az, 2 region.
  uint32 survives = 11;
}
