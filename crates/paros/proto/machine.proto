syntax = "proto3";

package paros.machine.v1;

import "common.proto";

// The machine contract (#196, #216, #277): what an idle `parosd` serves while
// it waits for `cell init`, and what a formed one keeps answering. A machine
// starts with an identity minted at format (`node_id`, #225) and never forms
// a cell on its own: one `CellInit`, sent to any listed machine, forms the
// cell over the listed machines with a single-decree Paxos on the cell plan,
// every listed machine an acceptor and all of them the quorum. The `service`
// block documents the method set; each method's id lives in
// `src/rpc/methods.rs`.
service Machine {
  // Who this machine is: its identity.
  rpc Identify(.paros.machine.v1.Identify) returns (.paros.machine.v1.IdentifyAck);
  // Phase 1 of the cell decree: promise to accept no plan under a lower
  // `init`, and report the plan this machine accepted, if any. Answered by
  // a formed machine too, from its record.
  rpc PrepareCell(.paros.machine.v1.PrepareCell) returns (.paros.machine.v1.PrepareCellAck);
  // Phase 2 of the cell decree: accept `plan` at `init` unless a higher
  // `init` was promised. Accepting is forming: record the plan durably,
  // format its journals, and start serving them. Idempotent for the same
  // plan, at any `init`, on a formed machine.
  rpc FormCell(.paros.machine.v1.FormCell) returns (.paros.machine.v1.FormCellAck);
  // `cell init`: the receiver drives the decree over the listed machines.
  // Resumable: a plan any listed machine accepted is finished, never
  // redrawn.
  rpc CellInit(.paros.machine.v1.CellInit) returns (.paros.machine.v1.CellInitAck);
  // `cell add-machine` (#216): join the cell `cell_id` as an admitted machine.
  // The admin call is the authority: an idle machine never joins on its own.
  // The caller registered the machine in the cell control journal first
  // (`RegisterNode`), so an admitted machine is always a registered one. The
  // machine records the cell durably before it answers, and finds the cell
  // from that record on every later start. Idempotent for the same cell;
  // refused by a machine of another cell, or one promised in a `cell init`.
  rpc Admit(.paros.machine.v1.Admit) returns (.paros.machine.v1.AdmitAck);
  // A tenant's journal create or delete (#210), sent to the tenant
  // coordinator: until #212 and #225, the elected cell coordinator, at the
  // interface its election renewals publish. The coordinator writes the
  // request to the tenant's control journal; the fold judges it at apply and
  // records its outcome under `request`. A retry with the same `request`
  // reads that outcome back, so it acts once, across a coordinator change
  // too.
  rpc JournalRequest(.paros.machine.v1.JournalRequest) returns (.paros.machine.v1.JournalRequestAck);
}

message Identify {}

message IdentifyAck {
  uint64 node_id = 1;
  // `storage` or `stateless`.
  string class = 2;
  uint64 capacity = 3;
  string failure_domain = 4;
  // The address this machine serves at.
  string addr = 5;
  // 6 was `seed` (the rendezvous join list, retired by #277).
  reserved 6;
  // The cell this machine belongs to, founded or admitted (#216); 0 while it
  // is idle.
  uint64 cell_id = 7;
}

// One member of a cell's bootstrap: its identity and address.
message Member {
  uint64 node_id = 1;
  string addr = 2;
}

// A journal's identifier: its tenant and the journal inside it (#235).
message JournalIdentifier {
  uint64 tenant = 1;
  uint64 journal = 2;
}

message PrepareCell {
  // The decree's ballot: a fresh random `init_id` and the receiver's node.
  .paros.common.v1.Ballot init = 1;
}

message PrepareCellAck {
  // Who answered.
  IdentifyAck identity = 1;
  // Whether it promised `init`.
  bool promised = 2;
  // The promise that refused `init`, when it did not promise.
  .paros.common.v1.Ballot promise = 3;
  // The plan it accepted, at the ballot it accepted it (its `init`), if any.
  FormCell vote = 4;
  // Why it could not answer, when it could not: "storage".
  string refusal = 5;
}

message FormCell {
  uint64 cell_id = 1;
  repeated Member members = 2;
  // The journals every member serves from its formation: the cell control
  // journal, the fleet tenant's when this cell hosts it, and the static assignment that
  // stands in for placement until M9 (#212). No identifier is fixed: every one is
  // drawn at `cell init` (`docs/architecture.md` §3.8).
  repeated JournalIdentifier journals = 3;
  // The cell tenant's control journal.
  JournalIdentifier control = 4;
  // The fleet tenant's control journal, when this cell hosts the fleet tenant (unset otherwise).
  JournalIdentifier fleet = 5;
  // The decree's ballot this plan is proposed (or was accepted) at.
  .paros.common.v1.Ballot init = 6;
  // The cell's first election journal (#240): a multi-writer journal of the
  // cell tenant, over which the founding members elect the cell coordinator.
  JournalIdentifier election = 7;
}

message FormCellAck {
  bool formed = 1;
  // Why not, when not: "not_a_member", "other_cell", "malformed",
  // "stateless", "storage", "promised_higher".
  string refusal = 2;
  // The promise that refused it, on "promised_higher".
  .paros.common.v1.Ballot promise = 3;
}

message CellInit {
  // The founding members, by address: every one an acceptor of the decree.
  repeated string members = 1;
}

message CellInitAck {
  bool initialized = 1;
  // Why not, when not: "not_a_member", "malformed", "stateless_member",
  // "member_unreachable", "contended", "other_cell_init", "cell_lost" (a
  // majority of the accepted plan's members were wiped), "cell_exists" (a
  // member is admitted into a cell already, #216), "storage".
  string refusal = 2;
  uint64 cell_id = 3;
  repeated Member members = 4;
  repeated JournalIdentifier journals = 5;
  // Retired (#240): the lowest member id, once named the first coordinator.
  // The founding members elect it over the election journal now.
  reserved 6;
  // The cell tenant's control journal, the fleet tenant's and the cell's
  // election journal (see `FormCell`).
  JournalIdentifier control = 7;
  JournalIdentifier fleet = 8;
  JournalIdentifier election = 9;
}

message Admit {
  // The cell, and its control journals: the cell tenant's and, on the cell
  // that hosts it, the fleet tenant's.
  uint64 cell_id = 1;
  JournalIdentifier control = 2;
  JournalIdentifier fleet = 3;
  // The cell's machines the caller knows, by id and address: the founding
  // members and the registered machines. The admitted machine caches them
  // (its cached registry fold, `docs/architecture.md` §3.2).
  repeated Member members = 4;
  // The cell's election journal (#240), when the caller knows it.
  JournalIdentifier election = 5;
}

message AdmitAck {
  bool admitted = 1;
  // Why not, when not: "malformed", "other_cell" (the machine belongs to
  // another cell), "in_cell_init" (it promised in a `cell init` and has no
  // cell: admitting it could put it in two cells), "storage".
  string refusal = 2;
}

message JournalRequest {
  // The idempotency id: drawn by the caller, set, and the same on every
  // retry of one request.
  uint64 request = 1;
  // The tenant whose journal it is.
  uint64 tenant = 2;
  oneof op {
    CreateJournalOp create = 3;
    DeleteJournalOp delete = 4;
  }
}

// Create journal `name`, written in `writer` mode, under a desired mode: a
// redundancy (1 single, 2 double, 3 triple), or a grid `{rows, cols}`
// (redundancy 0, both at least 2). `replicas` is the replica count. The
// coordinator draws the id and picks the members: a caller never names one.
message CreateJournalOp {
  bytes name = 1;
  paros.common.v1.WriterMode writer = 2;
  uint32 redundancy = 3;
  uint32 rows = 4;
  uint32 cols = 5;
  uint32 replicas = 6;
}

// Delete the live journal named `name`: a tombstone, never a reuse.
message DeleteJournalOp {
  bytes name = 1;
}

message JournalRequestAck {
  // What the request folded to: "created", "deleted", "name_taken" (a live
  // journal holds the name: `journal` is its id), "unknown_journal" (no live
  // journal has the name). Or why it did not reach the fold, to retry with
  // the same `request`: "not_coordinator", "unavailable". Or a refusal:
  // "unknown_tenant", "unplaceable" (too few machines for the desired mode),
  // "malformed".
  string outcome = 1;
  // The journal's id, on "created", "deleted" and "name_taken".
  uint64 journal = 2;
  // Its members, on "created".
  paros.common.v1.AcceptorConfig config = 3;
}
