syntax = "proto3";

package paros.tenant.v1;

import "common.proto";

// A tenant's control journal (#210, `docs/architecture.md` §3.1, §3.3): the
// tenant describes itself here, and every journal it creates or deletes is
// an entry here. Its identifier is random (§3.8), drawn with the tenant and
// recorded in the fleet directory's tenant entry and in the cell's
// `HostTenant`. Its single writer is the tenant coordinator; each entry is
// one record of a `Write`. `paros::tenant::TenantControl` is the one fold of
// them.
//
// A request to the coordinator carries an idempotency id (`request`). The
// coordinator writes the request as an entry, the fold judges it at apply and
// records its outcome under that id, so a retry that crosses a coordinator
// change reads the outcome back and acts once.
//
// Enums are `uint32`s whose `0` is unset and refused: nothing defaults.
message TenantEntry {
  oneof kind {
    Describe describe = 1;
    CreateJournal create_journal = 2;
    DeleteJournal delete_journal = 3;
  }
}

// The tenant's own description, written once by its first coordinator: its
// id, its name, what it survives (1 az, 2 region), the name and kind of the
// cell that hosts it, and its default desired mode. No rendezvous name.
message Describe {
  uint64 tenant = 1;
  bytes name = 2;
  uint32 survives = 3;
  bytes cell_name = 4;
  CellKind cell_kind = 5;
  Desired desired = 6;
}

// The kind of a cell (#253): regional (one region, `regions` holds it) or
// multi-region (`regions` holds the three, `witness` the witness region).
message CellKind {
  // 1 regional, 2 multi-region.
  uint32 kind = 1;
  repeated string regions = 2;
  string witness = 3;
}

// A desired mode (§3.4): a redundancy (1 single, 2 double, 3 triple) or a
// grid `{rows, cols}` (redundancy 0, both set), and the replica count.
message Desired {
  uint32 redundancy = 1;
  uint32 rows = 2;
  uint32 cols = 3;
  uint32 replicas = 4;
}

// Request `request`: create journal `id` (drawn by the coordinator) named
// `name`, written in `writer` mode, under `desired`, placed on `config` (the
// coordinator's choice of members; a caller never names one). An id the
// tenant already used is refused and the coordinator redraws; a live name
// answers the request `name_taken`.
message CreateJournal {
  uint64 request = 1;
  uint64 id = 2;
  bytes name = 3;
  paros.common.v1.WriterMode writer = 4;
  Desired desired = 5;
  paros.common.v1.AcceptorConfig config = 6;
}

// Request `request`: delete journal `id`. An id that names no live journal
// (`0` included) answers the request `unknown_journal`. A tombstone, never a
// reuse: the id stays taken, the name is free again.
message DeleteJournal {
  uint64 request = 1;
  uint64 id = 2;
}

// The checkpoint state (#230): the description, every journal ever created
// (tombstones included) and every request's outcome, each in id order so
// equal states encode to equal bytes.
message TenantState {
  Describe describe = 1;
  repeated JournalState journals = 2;
  repeated OutcomeState outcomes = 3;
}

message JournalState {
  uint64 id = 1;
  bytes name = 2;
  paros.common.v1.WriterMode writer = 3;
  Desired desired = 4;
  paros.common.v1.AcceptorConfig config = 5;
  // The position of the delete that tombstoned it, plus one; 0 while live.
  uint64 deleted_at = 6;
}

message OutcomeState {
  uint64 request = 1;
  // 1 created, 2 deleted, 3 name taken, 4 unknown journal.
  uint32 kind = 2;
  uint64 id = 3;
}
