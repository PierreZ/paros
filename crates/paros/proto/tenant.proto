syntax = "proto3";

package paros.tenant.v1;

import "common.proto";

// A tenant's control journal (#210, `docs/architecture.md` §3.1, §3.3): the
// tenant describes itself here, and every journal it creates or deletes is
// an entry here. Its identifier is random (§3.8), drawn with the tenant and
// recorded in the fleet directory's tenant entry and in the cell's
// `HostTenant`. Its single writer is the tenant coordinator; each entry is
// one record of a `Write`. `paros::tenant::TenantControl` is the one fold of
// them.
//
// A request to the coordinator carries an idempotency id (`request`). The
// coordinator writes the request as an entry, the fold judges it at apply and
// records its outcome under that id, so a retry that crosses a coordinator
// change reads the outcome back and acts once.
//
// Enums are `uint32`s whose `0` is unset and refused: nothing defaults.
message TenantEntry {
  oneof kind {
    Describe describe = 1;
    CreateJournal create_journal = 2;
    DeleteJournal delete_journal = 3;
    Unplaceable unplaceable = 4;
    SetJournalTags set_journal_tags = 7;
    Configure configure = 5;
    Placed placed = 6;
    Scrubbed scrubbed = 8;
  }
}

// The tenant's own description, written once by its first coordinator: its
// id, its name, what it survives (1 az, 2 region), the name of the cell that
// hosts it, and its default desired mode. No rendezvous name. 5 was the
// cell's kind, now the cell's reserved tags in the universe directory
// (#575 (key:value tags)).
message Describe {
  reserved 5;
  reserved "cell_kind";
  uint64 tenant = 1;
  bytes name = 2;
  uint32 survives = 3;
  bytes cell_name = 4;
  Desired desired = 6;
}

// A desired mode (§3.4, #523): the durability, `failures_per_partition`
// (0 to 3) over `partitions` acceptor partitions (at least 1, 0 is refused),
// and the replica count. Tags 1 to 3 held the retired redundancy and grid.
message Desired {
  reserved 1, 2, 3;
  reserved "redundancy", "rows", "cols";
  uint32 replicas = 4;
  uint32 failures_per_partition = 5;
  uint32 partitions = 6;
}

// Request `request`: create journal `id` (drawn by the coordinator) named
// `name`, written in `writer` mode, under `desired`, placed on `config` (the
// coordinator's choice of members; a caller never names one), with its
// first user tags `tags` (#575 (key:value tags)). An id the tenant already
// used is refused and the coordinator redraws; a live name answers the
// request `name_taken`. A reserved tag or a set over the cap is refused.
message CreateJournal {
  uint64 request = 1;
  uint64 id = 2;
  bytes name = 3;
  paros.common.v1.WriterMode writer = 4;
  Desired desired = 5;
  paros.common.v1.AcceptorConfig config = 6;
  repeated paros.common.v1.Tag tags = 7;
}

// Request `request`: live journal `id`'s user tags become `tags`, all of
// them at once (#575 (key:value tags)). An id that names no live journal
// answers `unknown_journal`. A reserved tag or a set over the cap is
// refused. A journal stores no copy of its tenant's tags.
message SetJournalTags {
  uint64 request = 1;
  uint64 id = 2;
  repeated paros.common.v1.Tag tags = 3;
}

// Request `request`: delete journal `id`. An id that names no live journal
// (`0` included) answers the request `unknown_journal`. A tombstone, never a
// reuse: the id stays taken, the name is free again.
message DeleteJournal {
  uint64 request = 1;
  uint64 id = 2;
}

// Request `request`: a create of `name` the cell cannot place (#212
// (placement)): too few machines for its desired mode, or no free slot for
// one of its acceptors. Recorded so a retry reads the refusal back; the
// caller asks again under a new id. A live name answers `name_taken` instead.
// An empty `name` is a configure's refusal (#214 (tenant modes)): a mode the
// cell cannot place, which changes nothing.
message Unplaceable {
  uint64 request = 1;
  bytes name = 2;
}

// Request `request`: change a desired mode (#214 (tenant modes), §3.4), the
// tenant's FDB `configure`. `tenant_default` changes the default a create
// that names no mode takes; else `id` names the live journal whose mode
// changes (an id that names no live journal, `0` included, answers the
// request `unknown_journal`). The coordinator applies a journal's new mode
// by reconfiguration and placement, then records `Placed`. The writer mode
// never changes.
message Configure {
  uint64 request = 1;
  uint64 id = 2;
  bool tenant_default = 3;
  Desired desired = 4;
}

// The configuration in force of journal `id` once the coordinator applied
// its desired mode (#214 (tenant modes)): what views show. The create's
// `config` stays the journal's bootstrap configuration. A journal that is not
// live changes nothing.
message Placed {
  uint64 id = 1;
  paros.common.v1.AcceptorConfig config = 2;
}

// The tenant scrubber's progress (#362 (background scrubbing), §5): the
// elected tenant coordinator reads every live journal's records on each
// acceptor, in journal id order, and flushes where it stands here so a
// later term resumes from it. Not a request: it records no outcome. A
// record behind the one held (by `pass`, then `done`, then `journal`, then
// `next_slot`) changes nothing.
message Scrubbed {
  // The pass, from 1.
  uint64 pass = 1;
  // The pass read every live journal.
  bool done = 2;
  // The journal the pass reads now, and its next slot (0: before the first
  // journal, or the pass is done).
  uint64 journal = 3;
  uint64 next_slot = 4;
  // This pass's counts: records read on every acceptor, records found
  // damaged, damaged records the acceptors wrote again, and slots where two
  // acceptors hold different values under the chosen prefix.
  uint64 checked = 5;
  uint64 damaged = 6;
  uint64 repaired = 7;
  uint64 mismatched = 8;
  // Counts over every pass.
  uint64 damaged_total = 9;
  uint64 repaired_total = 10;
  uint64 mismatched_total = 11;
  // The pass outlived the full-pass bound (`scrub_pass_within`).
  bool late = 12;
}

// The checkpoint state (#230): the description, every journal ever created
// (tombstones included) and every request's outcome, each in id order so
// equal states encode to equal bytes.
message TenantState {
  Describe describe = 1;
  repeated JournalState journals = 2;
  repeated OutcomeState outcomes = 3;
  // The default desired mode, once a `Configure` changed it (#214).
  Desired default_desired = 4;
  // The scrubber's progress, once it recorded some (#362).
  Scrubbed scrub = 5;
}

message JournalState {
  uint64 id = 1;
  bytes name = 2;
  paros.common.v1.WriterMode writer = 3;
  Desired desired = 4;
  paros.common.v1.AcceptorConfig config = 5;
  // The position of the delete that tombstoned it, plus one; 0 while live.
  uint64 deleted_at = 6;
  // Its user tags (#575).
  repeated paros.common.v1.Tag tags = 8;
  // The configuration in force the coordinator last recorded (#214); unset
  // while it is the create's `config`.
  paros.common.v1.AcceptorConfig placed = 7;
}

message OutcomeState {
  uint64 request = 1;
  // 1 created, 2 deleted, 3 name taken, 4 unknown journal, 5 unplaceable,
  // 6 configured (`id` 0: the tenant default), 7 tagged (#575).
  uint32 kind = 2;
  uint64 id = 3;
}
