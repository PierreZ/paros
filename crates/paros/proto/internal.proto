syntax = "proto3";

package paros.internal.v1;

// Cluster-internal consensus traffic. This surface is not part of the public
// journal API and may evolve with the replication protocol.
service ParosInternal {
  rpc Deliver(.paros.internal.v1.Deliver) returns (.paros.internal.v1.DeliverAck);
  // Private replica inspection used by deterministic workloads and future
  // operational tooling. The application bytes remain opaque to paros.
  rpc Inspect(.paros.internal.v1.InspectRequest) returns (.paros.internal.v1.InspectReply);
}

message Deliver {
  repeated WireMessage messages = 1;
}

message DeliverAck {}

// Integrity envelope for one typed protobuf Paxos message. The checksum covers
// the encoded ConsensusMessage so accidental corruption is fail-stop, never
// converted into a different command.
message WireMessage {
  ConsensusMessage message = 1;
  fixed64 checksum = 2;
}

message ConsensusMessage {
  oneof kind {
    Prepare prepare = 1;
    Promise promise = 2;
    Accept accept = 3;
    Accepted accepted = 4;
    Nack nack = 5;
    Commit commit = 6;
    CatchUpRequest catch_up_request = 7;
    CatchUpResponse catch_up_response = 8;
    InstallSnapshot install_snapshot = 9;
    CheckLeader check_leader = 10;
    Heartbeat heartbeat = 11;
    HeartbeatAck heartbeat_ack = 12;
  }
}

message Ballot {
  uint64 round = 1;
  uint64 node = 2;
}

message UserEntry {
  uint64 client = 1;
  uint64 seq = 2;
  bytes value = 3;
}

message Truncate {
  uint64 up_to = 1;
}

message Noop {}

message ControlCommand {
  oneof kind {
    Truncate truncate = 1;
    Noop noop = 2;
  }
}

message Command {
  oneof kind {
    UserEntry user = 1;
    ControlCommand control = 2;
  }
}

message SlotCommand {
  uint64 slot = 1;
  Ballot ballot = 2;
  Command command = 3;
}

message Prepare {
  uint64 from = 1;
  Ballot ballot = 2;
  uint64 from_slot = 3;
  uint64 config_id = 4;
}

message Promise {
  uint64 from = 1;
  Ballot ballot = 2;
  uint64 from_slot = 3;
  repeated SlotCommand accepted = 4;
  optional uint64 next_from_slot = 5;
  uint64 config_id = 6;
  // Stage 8 tri-state: slots whose accepted value this acceptor lost to
  // corruption but whose identity (slot, accepted ballot) survived.
  repeated FaultySlot faulty = 7;
}

// One faulty-entry report inside a Promise page (Stage 8, CTRL).
message FaultySlot {
  uint64 slot = 1;
  Ballot ballot = 2;
}

message Accept {
  uint64 from = 1;
  Ballot ballot = 2;
  uint64 slot = 3;
  Command command = 4;
  uint64 config_id = 5;
}

message Accepted {
  uint64 from = 1;
  Ballot ballot = 2;
  uint64 slot = 3;
  uint64 vhash = 4;
  uint64 config_id = 5;
}

message Nack {
  uint64 from = 1;
  Ballot ballot = 2;
  Ballot promised = 3;
  uint64 slot = 4;
  uint64 config_id = 5;
}

message Commit {
  uint64 from = 1;
  Ballot ballot = 2;
  uint64 slot = 3;
  Command command = 4;
  uint64 config_id = 5;
}

message CatchUpRequest {
  uint64 from = 1;
  uint64 from_slot = 2;
}

message CatchUpResponse {
  uint64 from = 1;
  repeated SlotCommand entries = 2;
}

message InstallSnapshot {
  uint64 from = 1;
  Ballot ballot = 2;
  uint64 chosen_index = 3;
  bytes snapshot = 4;
  // The serving peer's at-most-once session ledger for the folded prefix —
  // paros-owned metadata beside the opaque application bytes (#94). The
  // receiver persists these as sealed dedup records.
  repeated SessionRecord sessions = 5;
  uint64 config_id = 6;
}

// One at-most-once ledger record: (client, seq) applied at slot.
message SessionRecord {
  uint64 client = 1;
  uint64 seq = 2;
  uint64 slot = 3;
}

message CheckLeader {
  uint64 from = 1;
}

message Heartbeat {
  uint64 from = 1;
  Ballot ballot = 2;
  optional uint64 commit = 3;
  uint64 seq = 4;
  uint64 config_id = 5;
}

message HeartbeatAck {
  uint64 from = 1;
  Ballot ballot = 2;
  uint64 seq = 3;
  uint64 config_id = 4;
}

message InspectRequest {}

message InspectReply {
  optional uint64 chosen_index = 1;
  uint64 first_slot = 2;
  bytes snapshot = 3;
}
