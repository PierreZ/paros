syntax = "proto3";

package paros.internal.v1;

import "common.proto";

// Cluster-internal consensus traffic. This surface is not part of the public
// journal API and may evolve with the replication protocol.
service ParosInternal {
  rpc Deliver(.paros.internal.v1.Deliver) returns (.paros.internal.v1.DeliverAck);
  // Private replica inspection used by deterministic workloads and future
  // operational tooling. The application bytes remain opaque to paros.
  rpc Inspect(.paros.internal.v1.InspectRequest) returns (.paros.internal.v1.InspectReply);
  // Operator decommissioning (#123): shut this node down for good once a
  // leader's garbage collection named it retirable. Refused while the node
  // is a member of the configuration it believes in force.
  rpc Retire(.paros.internal.v1.RetireRequest) returns (.paros.internal.v1.RetireAck);
}

message RetireRequest {}

message RetireAck {
  bool accepted = 1;
  // Why it was refused, when it was: "member".
  string refusal = 2;
}

message Deliver {
  repeated WireMessage messages = 1;
}

message DeliverAck {}

// Integrity envelope for one typed protobuf Paxos message. The checksum covers
// the encoded ConsensusMessage so accidental corruption is fail-stop, never
// converted into a different command.
message WireMessage {
  ConsensusMessage message = 1;
  fixed64 checksum = 2;
}

message ConsensusMessage {
  oneof kind {
    Prepare prepare = 1;
    Promise promise = 2;
    Accept accept = 3;
    Accepted accepted = 4;
    Nack nack = 5;
    Commit commit = 6;
    CatchUpRequest catch_up_request = 7;
    CatchUpResponse catch_up_response = 8;
    InstallSnapshot install_snapshot = 9;
    CheckLeader check_leader = 10;
    Heartbeat heartbeat = 11;
    HeartbeatAck heartbeat_ack = 12;
    SnapAck snap_ack = 13;
    SnapChunkRequest snap_chunk_request = 14;
    SnapChunkResponse snap_chunk_response = 15;
    Relinquish relinquish = 16;
  }
}

message UserEntry {
  uint64 client = 1;
  uint64 seq = 2;
  bytes value = 3;
}

message Truncate {
  uint64 up_to = 1;
}

message Noop {}

// A decided snapshot point (CTRL's `snap` marker): every node snapshots at
// this marker's slot when it applies it, so the snapshots are byte-identical
// cluster-wide and chunk-level repair is sound.
message Snap {
  uint64 at_index = 1;
}

message ControlCommand {
  oneof kind {
    Truncate truncate = 1;
    Noop noop = 2;
    Snap snap = 3;
  }
}

message Command {
  oneof kind {
    UserEntry user = 1;
    ControlCommand control = 2;
  }
}

message SlotCommand {
  uint64 slot = 1;
  .paros.common.v1.Ballot ballot = 2;
  Command command = 3;
}

// An acceptor configuration bound to a ballot (Matchmaker Paxos): the
// membership plus the quorum system over it. Carried by the messages that
// let acceptors learn the configuration a ballot was registered with; absent
// on plain Multi-Paxos, whose messages are unchanged.
message Prepare {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 from_slot = 3;
  uint64 config_id = 4;
  // The configuration the candidate registered for `ballot` (absent on plain
  // Multi-Paxos).
  optional .paros.common.v1.AcceptorConfig config = 5;
}

message Promise {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 from_slot = 3;
  repeated SlotCommand accepted = 4;
  optional uint64 next_from_slot = 5;
  uint64 config_id = 6;
  // Stage 8 tri-state: slots whose accepted value this acceptor lost to
  // corruption but whose identity (slot, accepted ballot) survived.
  repeated FaultySlot faulty = 7;
}

// One faulty-entry report inside a Promise page (Stage 8, CTRL).
message FaultySlot {
  uint64 slot = 1;
  .paros.common.v1.Ballot ballot = 2;
}

message Accept {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 slot = 3;
  Command command = 4;
  uint64 config_id = 5;
}

message Accepted {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 slot = 3;
  uint64 vhash = 4;
  uint64 config_id = 5;
}

message Nack {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  .paros.common.v1.Ballot promised = 3;
  uint64 slot = 4;
  uint64 config_id = 5;
}

message Commit {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 slot = 3;
  Command command = 4;
  uint64 config_id = 5;
}

message CatchUpRequest {
  uint64 from = 1;
  uint64 from_slot = 2;
}

message CatchUpResponse {
  uint64 from = 1;
  repeated SlotCommand entries = 2;
}

message InstallSnapshot {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 chosen_index = 3;
  bytes snapshot = 4;
  // The serving peer's at-most-once session ledger for the folded prefix —
  // paros-owned metadata beside the opaque application bytes (#94). The
  // receiver persists these as sealed dedup records.
  repeated SessionRecord sessions = 5;
  uint64 config_id = 6;
}

// One at-most-once ledger record: (client, seq) applied at slot.
message SessionRecord {
  uint64 client = 1;
  uint64 seq = 2;
  uint64 slot = 3;
}

message CheckLeader {
  uint64 from = 1;
}

message Heartbeat {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  optional uint64 commit = 3;
  uint64 seq = 4;
  uint64 config_id = 5;
  // The leader's registered configuration (absent on plain Multi-Paxos).
  optional .paros.common.v1.AcceptorConfig config = 6;
}

message HeartbeatAck {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 seq = 3;
  uint64 config_id = 4;
  // The follower's chosen index (absent on plain Multi-Paxos).
  optional uint64 chosen = 5;
}

// Driver-terminal snapshot-repair traffic (never enters consensus).
message SnapAck {
  uint64 from = 1;
  uint64 at_index = 2;
  uint64 config_id = 3;
}

message SnapChunkRequest {
  uint64 from = 1;
  uint64 at_index = 2;
  repeated uint32 chunks = 3;
  uint64 config_id = 4;
}

message SnapChunk {
  uint32 index = 1;
  bytes bytes = 2;
}

message SnapChunkResponse {
  uint64 from = 1;
  uint64 at_index = 2;
  repeated SnapChunk chunks = 3;
  uint64 config_id = 4;
}

// Cooperative leader handoff (DPaxos "Leader Handoff"): the outgoing leader
// transfers the Phase-2 authority of `ballot` to exactly one successor, which
// continues under it without running another Phase 1.
message Relinquish {
  // The current holder giving the authority up (not necessarily ballot.node,
  // which keeps naming the node that minted the ballot).
  uint64 from = 1;
  // The single intended successor. Carried inside the payload so a duplicate,
  // a misroute, or a replay can never hand the authority to a second node.
  uint64 to = 2;
  .paros.common.v1.Ballot ballot = 3;
  uint64 from_slot = 4;
  // The allocator frontier the successor inherits.
  uint64 next_slot = 5;
  // Tail slots the outgoing leader knows are chosen, with their choosing ballot.
  repeated SlotCommand decided = 6;
  // Tail slots with an open Phase-2 round at `ballot` (the ballot is implied).
  repeated SlotCommand pending = 7;
  uint64 config_id = 8;
  // The authority's registered configuration, transferred verbatim (absent on
  // plain Multi-Paxos).
  optional .paros.common.v1.AcceptorConfig config = 9;
}

message InspectRequest {}

message InspectReply {
  optional uint64 chosen_index = 1;
  uint64 first_slot = 2;
  bytes snapshot = 3;
  // The acceptor configuration this node believes is the latest (its
  // bootstrap membership on plain Multi-Paxos), and the ballot it was
  // registered under.
  repeated uint64 members = 4;
  .paros.common.v1.Ballot config_ballot = 5;
  // Whether this node currently leads.
  bool leader = 6;
  // The matchmaker set this node believes authoritative (#125): its
  // generation and members (empty on plain Multi-Paxos).
  uint64 matchmaker_generation = 7;
  repeated uint64 matchmakers = 8;
  // Acceptors this leadership's garbage collection retired (#123): members
  // of the prior configurations outside the one in force, once a
  // matchmaker quorum acked the floor. Empty on a non-leader.
  repeated uint64 retirable = 9;
  // The floor that leadership made effective, when any.
  .paros.common.v1.Ballot gc_watermark = 10;
}
