syntax = "proto3";

package paros.internal.v1;

import "common.proto";

// Cluster-internal consensus traffic. This surface is not part of the public
// journal API and may evolve with the replication protocol.
// The `service` block documents the method set; the transport is
// moonpool-rpc, not gRPC. Each rpc is a well-known endpoint whose method id
// and schema version live in `src/rpc/methods.rs`; only the messages are
// generated from this file.
service ParosInternal {
  // Hand a batch of consensus messages to a peer. The ack means every message
  // entered the peer's bounded inbox — not that its node loop processed them.
  rpc Deliver(.paros.internal.v1.Deliver) returns (.paros.internal.v1.DeliverAck);
  // Private replica inspection used by deterministic workloads and future
  // operational tooling.
  rpc Inspect(.paros.internal.v1.InspectRequest) returns (.paros.internal.v1.InspectReply);
  // Operator decommissioning (#123): shut this node down for good once a
  // leader's garbage collection named it retirable. Refused while the node
  // is a member of the configuration it believes in force, while it leads,
  // and — the condition that makes the other two mean something — unless the
  // request carries an effective GC watermark strictly above every ballot a
  // configuration naming this node was bound to.
  rpc Retire(.paros.internal.v1.RetireRequest) returns (.paros.internal.v1.RetireAck);
}

message RetireRequest {
  // The GC watermark the operator read from a leader's Inspect *after* that
  // floor became effective at a matchmaker quorum. It is the evidence that
  // no surviving configuration can still ask this node for a Phase-1
  // promise; without it the node's own "I am not a member" is a volatile
  // belief a reboot resets. Absent, or at or below the node's own membership
  // fence, the request is refused with "not_collected".
  .paros.common.v1.Ballot gc_watermark = 1;
}

message RetireAck {
  bool accepted = 1;
  // Why it was refused, when it was: "plain" (no matchmakers, so nothing is
  // ever collected), "leader", "member", or "not_collected" (no effective
  // floor above this node's membership).
  string refusal = 2;
}

message Deliver {
  repeated ConsensusMessage messages = 1;
  // The sender's cell (#216): `docs/architecture.md` §3.2's session `Hello`
  // id, carried on every batch. A receiver of another cell refuses the
  // batch, so a machine never steps a peer of another cell. `0` is a
  // deployment without a cell plan; it meets only another such node.
  uint64 cell_id = 2;
}

message DeliverAck {}

message ConsensusMessage {
  // 10 was CheckLeader, a tick-injected self-event that never crossed the wire.
  // 9 was InstallSnapshot and 13..=15 the snapshot-point repair plane
  // (SnapAck, SnapChunkRequest, SnapChunkResponse), deleted with the
  // application (#186).
  reserved 9, 10, 13, 14, 15;
  oneof kind {
    Prepare prepare = 1;
    Promise promise = 2;
    Accept accept = 3;
    Accepted accepted = 4;
    Nack nack = 5;
    Commit commit = 6;
    CatchUpRequest catch_up_request = 7;
    CatchUpResponse catch_up_response = 8;
    Heartbeat heartbeat = 11;
    HeartbeatAck heartbeat_ack = 12;
    Relinquish relinquish = 16;
    PreRead pre_read = 17;
    PreReadAck pre_read_ack = 18;
    TrimmedTo trimmed_to = 19;
  }
  // The journal this message belongs to, named with its tenant (#188, #235):
  // the envelope, per message, that keeps one journal's protocol state out
  // of another's. Every node demuxes on the pair; an unset half (`0`) is
  // refused at the edge.
  uint64 journal = 20;
  uint64 tenant = 21;
}

// A journal `Write` decided into one slot (#204): judged at apply by the
// journal state machine — the safety rule; any propose-time check is only
// an optimisation (`docs/architecture.md` §2.2).
message WriteEntry {
  // 1 and 2 were the M7 writer `(generation, owner)` (#241).
  reserved 1, 2;
  uint64 seq = 3;
  repeated bytes records = 4;
  .paros.common.v1.LeaderUuid leader = 5;
}

// Drop every record below `up_to` (a position, #204), fenced by the
// leader uuid like a `Write` (#228, #241).
message Truncate {
  uint64 up_to = 1;
  reserved 2, 3;
  .paros.common.v1.LeaderUuid leader = 4;
}

message Noop {}

// Compare-and-set the journal's leader (#241): `new` leads iff `old` is
// the current leader (absent: none).
message SetLeader {
  reserved 1, 2;
  .paros.common.v1.LeaderUuid new = 3;
  .paros.common.v1.LeaderUuid old = 4;
}

message ControlCommand {
  // 3 was Snap, the decided snapshot point, deleted with the application
  // (#186).
  reserved 3;
  oneof kind {
    Truncate truncate = 1;
    Noop noop = 2;
    SetLeader set_leader = 4;
  }
}

message Command {
  // 1 was the #185 `UserEntry` (client, seq, value), replaced by the
  // journal `Write` (#204).
  reserved 1;
  oneof kind {
    ControlCommand control = 2;
    WriteEntry write = 3;
  }
}

message SlotCommand {
  uint64 slot = 1;
  .paros.common.v1.Ballot ballot = 2;
  Command command = 3;
}

// An acceptor configuration bound to a ballot (Matchmaker Paxos): the
// membership plus the quorum system over it. Carried by the messages that
// let acceptors learn the configuration a ballot was registered with; absent
// on plain Multi-Paxos, whose messages are unchanged.
message Prepare {
  // Where the Promise/Nack is addressed.
  uint64 reply_to = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 from_slot = 3;
  reserved 4; // was config_id, the dropped configuration tag
  // The configuration the candidate registered for `ballot` (absent on plain
  // Multi-Paxos).
  optional .paros.common.v1.AcceptorConfig config = 5;
  // was `leader`: Phase 1 is always run by the ballot's owner (proxy leaders
  // take over Phase 2 only), so the campaigner is `ballot.node` and the field
  // was redundant.
  reserved 6;
}

message Promise {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 from_slot = 3;
  repeated SlotCommand accepted = 4;
  optional uint64 next_from_slot = 5;
  reserved 6; // was config_id, the dropped configuration tag
  // Stage 8 tri-state: slots whose accepted value this acceptor lost to
  // corruption but whose identity (slot, accepted ballot) survived.
  repeated FaultySlot faulty = 7;
}

// One faulty-entry report inside a Promise page (Stage 8, CTRL).
message FaultySlot {
  uint64 slot = 1;
  .paros.common.v1.Ballot ballot = 2;
}

message Accept {
  // Where the Accepted/Nack is addressed: the node, unless `reply_to_proxy`
  // is set, in which case this is zero and ignored.
  uint64 reply_to = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 slot = 3;
  Command command = 4;
  reserved 5; // was config_id, the dropped configuration tag
  // The node exercising the ballot's Phase-2 authority (the leader hint an
  // acceptor adopts). Absent means "the reply address is the leader", which
  // is every colocated round, so a deployment without proxies never puts
  // it on the wire and its encoding is unchanged.
  optional uint64 leader = 6;
  // The proxy leader the Accepted/Nack is addressed to (#142): set on a
  // delegated round — the leader's delegation to the proxy and the proxy's
  // fan-out to the acceptors alike. Absent on a deployment without proxies.
  optional uint64 reply_to_proxy = 7;
  // The configuration the ballot was registered with, on the delegation a
  // matchmaker deployment's leader hands a proxy (the proxy learns a
  // configuration no other way). Absent on plain Multi-Paxos and on every
  // acceptor-bound Accept.
  optional .paros.common.v1.AcceptorConfig config = 8;
}

message Accepted {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 slot = 3;
  uint64 vhash = 4;
  reserved 5; // was config_id, the dropped configuration tag
}

message Nack {
  // 3 was the acceptor's promise, a diagnostic the receiver never used.
  reserved 3;
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 slot = 4;
  reserved 5; // was config_id, the dropped configuration tag
}

message Commit {
  // The deciding node, unless `from_proxy` is set, in which case this is
  // zero and ignored.
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  uint64 slot = 3;
  Command command = 4;
  reserved 5; // was config_id, the dropped configuration tag
  // The proxy leader that folded the delegated round and decided it
  // (#142). Absent on a deployment without proxies.
  optional uint64 from_proxy = 6;
}

message CatchUpRequest {
  uint64 from = 1;
  uint64 from_slot = 2;
}

message CatchUpResponse {
  uint64 from = 1;
  repeated SlotCommand entries = 2;
}

// Below the serving peer's trim point (#186): the log below `point` is gone
// there, and everything below it is chosen. The requester jumps its floor to
// `point` and its chosen index to `point - 1`, takes the journal state the
// log folded to below it, and catches up from `point`. No bytes and no
// ballot: its promise does not move.
message TrimmedTo {
  uint64 from = 1;
  uint64 point = 2;
  // 3 was the #94 session ledger, gone with #204: the log is the
  // deduplication table.
  reserved 3;
  // The journal state the serving peer's log folded to below `point`.
  .paros.common.v1.JournalState state = 4;
}

message Heartbeat {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  optional uint64 commit = 3;
  reserved 4; // was seq, the beat sequence the retired read-index rounds counted
  reserved 5; // was config_id, the dropped configuration tag
  // The leader's registered configuration (absent on plain Multi-Paxos).
  optional .paros.common.v1.AcceptorConfig config = 6;
  // The leadership's fence (#260): with `config`, the read basis a follower
  // judges its quorum reads over (absent on plain Multi-Paxos, or when the
  // leadership fenced nothing).
  optional uint64 fence = 7;
}

message HeartbeatAck {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  reserved 3; // was seq, the beat sequence the retired read-index rounds counted
  reserved 4; // was config_id, the dropped configuration tag
  // The follower's chosen index (absent on plain Multi-Paxos).
  optional uint64 chosen = 5;
}

// Cooperative leader handoff (DPaxos "Leader Handoff"): the outgoing leader
// transfers the Phase-2 authority of `ballot` to exactly one successor, which
// continues under it without running another Phase 1.
message Relinquish {
  // The current holder giving the authority up (not necessarily ballot.node,
  // which keeps naming the node that minted the ballot).
  uint64 from = 1;
  // The single intended successor. Carried inside the payload so a duplicate,
  // a misroute, or a replay can never hand the authority to a second node.
  uint64 to = 2;
  .paros.common.v1.Ballot ballot = 3;
  uint64 from_slot = 4;
  // The allocator frontier the successor inherits.
  uint64 next_slot = 5;
  // Tail slots the outgoing leader knows are chosen, with their choosing ballot.
  repeated SlotCommand decided = 6;
  // Tail slots with an open Phase-2 round at `ballot` (the ballot is implied).
  repeated SlotCommand pending = 7;
  reserved 8; // was config_id, the dropped configuration tag
  // The authority's registered configuration, transferred verbatim (absent on
  // plain Multi-Paxos).
  optional .paros.common.v1.AcceptorConfig config = 9;
}

// Leaderless reads (Paxos Quorum Reads, #143): a reader asks a Phase-1
// quorum of acceptors (a row of a grid) for their vote watermarks, takes the
// maximum, and serves the read from any replica that has applied it. No
// ballot, no clock, no durable obligation on either side.
message PreRead {
  // Where the PreReadAck is addressed.
  uint64 reply_to = 1;
  // The reader's correlation token, echoed by the ack.
  uint64 ctx = 2;
}

message PreReadAck {
  uint64 from = 1;
  uint64 ctx = 2;
  // The highest slot this acceptor has voted in (absent: never voted).
  optional uint64 watermark = 3;
  // The ballot of the configuration the answering node believes in force
  // (absent on plain Multi-Paxos).
  optional .paros.common.v1.Ballot config_since = 4;
}

message InspectRequest {
  // The journal to inspect, with its tenant (#188, #235). No identifier has a
  // default (#243): a request that names no journal is refused (`unset`)
  // unless it asks for the node alone.
  uint64 journal = 1;
  uint64 tenant = 2;
  // Ask for the answering node's own facts alone — its id, its cell and the
  // control journals' identifiers (§3.2) — and no journal's. How a client handed
  // only an address learns the identifiers before it can name a journal. The
  // identifier must then be unset; a request that names one too is `malformed`.
  bool node_only = 3;
}

message InspectReply {
  optional uint64 chosen_index = 1;
  uint64 first_slot = 2;
  // 3 was the application's opaque snapshot, deleted with the application
  // (#186): a client reads the journal through `Read`.
  reserved 3;
  // The acceptor configuration this node believes is the latest (its
  // bootstrap membership on plain Multi-Paxos), and the ballot it was
  // registered under.
  repeated uint64 members = 4;
  .paros.common.v1.Ballot config_ballot = 5;
  // Whether this node currently leads.
  bool leader = 6;
  // The quorum system of that configuration — what an operator composing a
  // successor reads beside the members. The same encoding as
  // `paros.common.v1.AcceptorConfig`.
  .paros.common.v1.QuorumSystem quorum_system = 11;
  uint64 phase1_quorum = 12;
  uint64 phase2_quorum = 13;
  uint64 rows = 14;
  uint64 cols = 15;
  // The matchmaker set this node believes authoritative (#125): its
  // generation and members (empty on plain Multi-Paxos).
  uint64 matchmaker_generation = 7;
  repeated uint64 matchmakers = 8;
  // Acceptors this leadership's garbage collection retired (#123): members
  // of the prior configurations outside the one in force, once a
  // matchmaker quorum acked the floor. Empty on a non-leader.
  repeated uint64 retirable = 9;
  // The floor that leadership made effective, when any.
  .paros.common.v1.Ballot gc_watermark = 10;
  // The journal fold (#204): the first slot this node has not folded, and
  // the journal state after every slot below it. An observation of this
  // node alone — a read of the journal is `Read`, which a quorum confirms.
  uint64 folded = 16;
  .paros.common.v1.JournalState journal = 17;
  // The answering node's own id (#196): node ids are random (#225), so a
  // client given addresses alone learns each server's id here.
  uint64 node = 18;
  // The answering node's cell (#229, `docs/architecture.md` §3.2): no identifier
  // is fixed (§3.8), so a client handed only addresses learns the control
  // journals here. `0` when the node knows no cell (a deployment without a
  // cell plan); the identifiers are unset when unknown, the fleet tenant's when this cell
  // hosts no fleet tenant.
  uint64 cell_id = 19;
  uint64 control_tenant = 20;
  uint64 control_journal = 21;
  uint64 fleet_tenant = 22;
  uint64 fleet_journal = 23;
  // Why the journal half was not answered, when it was not (#243): "unset"
  // (the request named no journal and did not ask for the node alone),
  // "malformed" (it asked for the node alone and named a journal too), or
  // "unknown_journal" (the journal is not live on this node). Empty on an
  // answered journal and on a node-only reply. The node's own facts (`node`,
  // `cell_id` and the identifiers) are answered either way; every journal field
  // is empty on a refusal.
  string refusal = 24;
}
