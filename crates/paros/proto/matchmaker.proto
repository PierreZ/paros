syntax = "proto3";

package paros.matchmaker.v1;

import "common.proto";

// The matchmaker contract (Matchmaker Paxos §3.2): a per-ballot registry of
// acceptor configurations, consulted only on a round change, never on the
// command path. Separate from the consensus contract on purpose — a cluster
// deployed without matchmakers never speaks it, and a node never steps it.
//
// Evolution rule: fields are only ever appended (a matchmaker-set generation
// tag lands as a new field on every message here, not as a rewrite).
service ParosMatchmaker {
  // Register a configuration under a ballot and learn every configuration
  // registered below it (the paper's MatchA / MatchB).
  rpc Matchmake(.paros.matchmaker.v1.MatchRequest) returns (.paros.matchmaker.v1.MatchReply);
  // Raise the garbage-collection watermark (the paper's GarbageA / GarbageB):
  // registrations below it are dropped and nothing below it may register.
  rpc GarbageCollect(.paros.matchmaker.v1.GarbageCollect) returns (.paros.matchmaker.v1.GarbageCollectAck);
  // One step of a matchmaker-set reconfiguration (the paper's §5: stop,
  // bootstrap, the successor decree, and the chosen publication).
  rpc Reconfigure(.paros.matchmaker.v1.ReconfigureRequest) returns (.paros.matchmaker.v1.ReconfigureReply);
}

// A matchmaker set bound to its generation.
message MatchmakerSet {
  uint64 generation = 1;
  repeated uint64 members = 2;
}

message MatchRequest {
  uint64 from = 1;
  .paros.common.v1.Ballot ballot = 2;
  .paros.common.v1.AcceptorConfig config = 3;
  // Whether this registers a reconfiguration (a leader's explicit change)
  // rather than a candidate's belief about the configuration in force.
  bool reconfiguration = 4;
  // The matchmaker generation addressed (a matchmaker not active for
  // exactly this generation refuses with what it knows).
  uint64 generation = 5;
}

message Registration {
  .paros.common.v1.Ballot ballot = 1;
  .paros.common.v1.AcceptorConfig config = 2;
  bool reconfiguration = 3;
}

// The effective configuration: the highest-ballot reconfiguration
// registration a matchmaker holds. A monotone scalar the GC watermark never
// collects, so it survives a floor raised over the record it came from.
message EffectiveConfiguration {
  .paros.common.v1.Ballot ballot = 1;
  .paros.common.v1.AcceptorConfig config = 2;
}

// The successful answer: every registration strictly below the request's
// ballot and at or above the watermark, plus the watermark itself.
message Registered {
  repeated Registration history = 1;
  .paros.common.v1.Ballot gc_watermark = 2;
  optional EffectiveConfiguration effective = 3;
}

// A refusal, carrying what the requester needs to make progress. Diagnostics
// only: the requester never adopts these ballots as trusted input.
// A frozen generation: the successor, once learned.
message RefusedStopped {
  optional MatchmakerSet successor = 1;
}

message RefusedInactive {}

// The request's configuration does not admit its own quorum system.
message RefusedMalformed {}

message Refused {
  oneof reason {
    .paros.common.v1.Ballot stale_highest = 1;
    .paros.common.v1.Ballot below_watermark = 2;
    RefusedStopped stopped = 3;
    // Active for another generation: the set this matchmaker serves.
    MatchmakerSet generation = 4;
    RefusedInactive inactive = 5;
    RefusedMalformed malformed = 6;
  }
}

message MatchReply {
  uint64 matchmaker = 1;
  uint64 to = 2;
  .paros.common.v1.Ballot ballot = 3;
  oneof outcome {
    Registered registered = 4;
    Refused refused = 5;
  }
  // The request's generation, echoed.
  uint64 generation = 6;
}

message GarbageCollect {
  uint64 from = 1;
  .paros.common.v1.Ballot watermark = 2;
  uint64 generation = 3;
}

message GarbageCollectAck {
  uint64 matchmaker = 1;
  // The durable watermark after the request (at least the requested one, or
  // the higher floor already in force).
  .paros.common.v1.Ballot watermark = 2;
  uint64 generation = 3;
  // Whether the request was applied at that generation.
  bool applied = 4;
}

// ---- matchmaker-set reconfiguration (#125) ----------------------------------

message Stop {
  uint64 generation = 1;
}

message Bootstrap {
  MatchmakerSet set = 1;
  .paros.common.v1.Ballot gc_watermark = 2;
  repeated Registration history = 3;
  // The reconstructed effective configuration (the maximum over the stop
  // quorum), carried beside the registry the GC watermark may have collected
  // it from.
  optional EffectiveConfiguration effective = 4;
}

message DecreePrepare {
  uint64 generation = 1;
  .paros.common.v1.Ballot ballot = 2;
}

message DecreeAccept {
  uint64 generation = 1;
  .paros.common.v1.Ballot ballot = 2;
  repeated uint64 members = 3;
}

message Chosen {
  uint64 generation = 1;
  MatchmakerSet successor = 2;
}

message ReconfigureRequest {
  uint64 from = 1;
  oneof kind {
    Stop stop = 2;
    Bootstrap bootstrap = 3;
    DecreePrepare decree_prepare = 4;
    DecreeAccept decree_accept = 5;
    Chosen chosen = 6;
  }
}

message StopAck {
  uint64 generation = 1;
  .paros.common.v1.Ballot gc_watermark = 2;
  repeated Registration history = 3;
  optional MatchmakerSet successor = 4;
  // The highest decree ballot promised for the frozen generation: the
  // reconfigurer opens its decree strictly above the maximum over its stop
  // quorum, so a rebooted node never reuses a ballot of its earlier
  // incarnation.
  .paros.common.v1.Ballot decree_promised = 5;
  // The effective configuration this matchmaker durably holds.
  optional EffectiveConfiguration effective = 6;
}

message BootstrapAck {
  MatchmakerSet set = 1;
}

message DecreeVote {
  .paros.common.v1.Ballot ballot = 1;
  repeated uint64 members = 2;
}

message DecreePromise {
  uint64 generation = 1;
  .paros.common.v1.Ballot ballot = 2;
  optional DecreeVote vote = 3;
}

message DecreeAccepted {
  uint64 generation = 1;
  .paros.common.v1.Ballot ballot = 2;
}

message DecreeNack {
  uint64 generation = 1;
  .paros.common.v1.Ballot ballot = 2;
  .paros.common.v1.Ballot promised = 3;
}

message Learned {
  uint64 generation = 1;
  bool activated = 2;
  // The generation the answering matchmaker now serves or is frozen for: a
  // publisher counts it toward the successor's own quorum only once this
  // reaches the successor's generation.
  uint64 at = 3;
}

enum MatchmakerPhase {
  MATCHMAKER_PHASE_FRESH = 0;
  MATCHMAKER_PHASE_INACTIVE = 1;
  MATCHMAKER_PHASE_ACTIVE = 2;
  MATCHMAKER_PHASE_STOPPED = 3;
}

message ReconfigureRefused {
  MatchmakerSet current = 1;
  MatchmakerPhase phase = 2;
  optional MatchmakerSet successor = 3;
}

message ReconfigureReply {
  uint64 matchmaker = 1;
  oneof kind {
    StopAck stopped = 2;
    BootstrapAck bootstrapped = 3;
    DecreePromise promised = 4;
    DecreeAccepted accepted = 5;
    DecreeNack nacked = 6;
    Learned learned = 7;
    ReconfigureRefused refused = 8;
  }
}
