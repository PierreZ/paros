syntax = "proto3";

package paros.v1;

import "common.proto";

// Client-facing journal API. A future proxy can expose this contract while the
// nodes keep their consensus protocol on the separate internal service.
// The `service` block documents the method set; the transport is
// moonpool-rpc, not gRPC. Each rpc is a well-known endpoint whose method id
// and schema version live in `src/rpc/methods.rs`; only the messages are
// generated from this file.
service Paros {
  // Append a batch to a journal at `seq` (#204): fenced by `(generation,
  // owner)`, contiguous by `seq`, idempotent on retry, pipelineable. Every
  // rule is judged at apply, in slot order, by the journal state machine;
  // the reply is held until the deciding slot applies, or redirected to
  // the leader.
  rpc Write(.paros.v1.Write) returns (.paros.v1.WriteAck);
  // The committed records from `from_seq` (#204), plus `first_seq`,
  // `next_seq` and the current writer, or `truncated` below `first_seq`.
  // Served by any node or replica through the leaderless read (#143): a
  // Phase-1 quorum's vote watermarks, then this server's fold once it
  // covers them. Long-polls at the tail for `wait_ms`.
  rpc Read(.paros.v1.Read) returns (.paros.v1.ReadAck);
  // Drop every record below `up_to` (#204). Fenced by `(generation, owner)`
  // like a `Write` (#228), monotone, decided by consensus and judged at
  // apply in slot order; a stale or foreign caller is refused in place.
  rpc Truncate(.paros.v1.Truncate) returns (.paros.v1.TruncateAck);
  // Compare-and-swap the journal's writer (#204): wins iff `expected` is the
  // current generation, which then becomes `expected + 1`.
  rpc SetLeader(.paros.v1.SetLeader) returns (.paros.v1.SetLeaderAck);
  // Change the acceptor set (Matchmaker Paxos reconfiguration, #122). Only the
  // leader admits it, and only on a deployment that names matchmakers; every
  // other case is refused (`accepted: false`) and the client may retry.
  rpc Reconfigure(.paros.v1.Reconfigure) returns (.paros.v1.ReconfigureAck);
  // Change the matchmaker set (Matchmaker Paxos §5, #125): any node of a
  // deployment that names matchmakers may drive it; refused (`accepted:
  // false`) on a plain deployment, while another handover runs here, or for
  // a target outside the matchmaker pool.
  rpc ReconfigureMatchmakers(.paros.v1.ReconfigureMatchmakers) returns (.paros.v1.ReconfigureMatchmakersAck);
}

// Every journal call names its journal by the frame `(tenant, journal)`
// (#184, #235): a `0` half is unset and always refused (`unknown_journal`),
// as is any journal this process does not serve.
// A reply that carries no verdict — a redirect, an unknown journal, a
// deliberately abandoned wait — is ambiguous: the call may still take effect.

message Write {
  uint64 journal = 1;
  uint64 generation = 2;
  uint64 owner = 3;
  // The position the batch's first record asks for.
  uint64 seq = 4;
  // The records, in order: accepted or refused whole, in one slot.
  repeated bytes records = 5;
  uint64 tenant = 6;
}

enum WriteOutcome {
  // No verdict: redirected, unknown journal, or not answered here.
  WRITE_OUTCOME_NONE = 0;
  // Accepted: the records occupy `[seq, seq + count)`.
  WRITE_OUTCOME_ACCEPTED = 1;
  // A retry of the write accepted at `seq`: acked, nothing moved.
  WRITE_OUTCOME_DUPLICATE = 2;
  // Refused in place: `state` names the current writer and `next_seq`.
  WRITE_OUTCOME_REFUSED = 3;
  // `seq` is below `first_seq`: ambiguous, read the tail.
  WRITE_OUTCOME_TRUNCATED = 4;
}

message WriteAck {
  WriteOutcome outcome = 1;
  // A redirect hint, when there is no verdict.
  optional uint64 leader = 2;
  bool unknown_journal = 3;
  // Accepted or duplicate: where the batch sits.
  uint64 seq = 4;
  uint64 count = 5;
  // Refused or truncated: the journal state the write was judged against.
  .paros.common.v1.JournalState state = 6;
}

message Read {
  uint64 journal = 1;
  uint64 from_seq = 2;
  // At most this many records (0: the server's page size).
  uint64 limit = 3;
  // Wait at the tail up to this long for a record (0: answer at once).
  uint64 wait_ms = 4;
  uint64 tenant = 5;
}

message ReadAck {
  // Whether this server answered: false when it could not confirm a read
  // (its quorum did not answer in time) — retry, here or elsewhere.
  bool served = 1;
  bool unknown_journal = 2;
  // `from_seq` is below `first_seq`: no records, and `state` says where the
  // journal starts.
  bool truncated = 3;
  // The first record's position and the records, dense from it.
  uint64 from_seq = 4;
  repeated bytes records = 5;
  // The state the page was served from: `first_seq`, `next_seq` (the
  // committed end) and the current writer.
  .paros.common.v1.JournalState state = 6;
}

message Truncate {
  uint64 journal = 1;
  // The first position the client still needs.
  uint64 up_to = 2;
  // The writer fence (#228): the caller's generation and owner id, judged
  // against the journal's current writer at apply.
  uint64 generation = 3;
  uint64 owner = 4;
  uint64 tenant = 5;
}

message TruncateAck {
  // Whether the truncation was judged at apply (applied or refused).
  bool decided = 1;
  optional uint64 leader = 2;
  bool unknown_journal = 3;
  // Applied: the state after it. Refused: the state it was judged against,
  // naming the current writer.
  .paros.common.v1.JournalState state = 4;
  // Judged and refused (#228): `(generation, owner)` is not the current
  // writer. Nothing moved.
  bool refused = 5;
}

message SetLeader {
  uint64 journal = 1;
  // The generation the caller believes current.
  uint64 expected = 2;
  // The client that should own the journal.
  uint64 owner = 3;
  uint64 tenant = 4;
}

message SetLeaderAck {
  // Whether the compare-and-swap was judged (won or lost).
  bool decided = 1;
  // Whether it won: `state` is then the new generation, the new owner and
  // the position it continues from; lost, `state` names the current writer.
  bool won = 2;
  optional uint64 leader = 3;
  bool unknown_journal = 4;
  .paros.common.v1.JournalState state = 5;
}

message Reconfigure {
  // The new acceptor set (node ids drawn from the deployment's pool).
  repeated uint64 members = 1;
  // The quorum system the new configuration runs under, encoded exactly as
  // `paros.common.v1.AcceptorConfig` encodes it (the same field numbers):
  // a majority leaves every scalar at zero, so a request that names members
  // alone is byte-identical to before the field existed. A configuration
  // the membership does not admit is refused as `malformed`.
  .paros.common.v1.QuorumSystem quorum_system = 2;
  uint64 phase1_quorum = 3;
  uint64 phase2_quorum = 4;
  uint64 rows = 5;
  uint64 cols = 6;
}

message ReconfigureMatchmakers {
  // The new matchmaker set (matchmaker ids drawn from the deployment's pool).
  repeated uint64 members = 1;
}

message ReconfigureMatchmakersAck {
  // Whether the handover was started at this node.
  bool accepted = 1;
  // Why it was refused, when it was: "no_matchmakers", "busy", "empty",
  // "unknown_matchmaker".
  string refusal = 2;
  // The generation being replaced, when accepted.
  optional uint64 generation = 3;
}

message ReconfigureAck {
  optional uint64 leader = 1;
  // Whether the reconfiguration was started (a fresh ballot registered with
  // the new configuration). A refusal names its reason for diagnostics.
  bool accepted = 2;
  // Why it was refused, when it was: "not_leader", "no_matchmakers",
  // "unchanged", "unknown_member", "unsettled", "round_exhausted".
  string refusal = 3;
  // The ballot round the reconfiguration campaigns at, when accepted.
  optional uint64 round = 4;
}
