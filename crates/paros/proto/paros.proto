syntax = "proto3";

package paros.v1;

import "common.proto";

// Client-facing journal API. A future proxy can expose this contract while the
// nodes keep their consensus protocol on the separate internal service.
// The `service` block documents the method set; the transport is
// moonpool-rpc, not gRPC. Each rpc is a well-known endpoint whose method id
// and schema version live in `src/rpc/methods.rs`; only the messages are
// generated from this file.
service Paros {
  // Append records to a journal (#185): today's proposal plus the #94
  // at-most-once dedup — a retry keeps `(client, seq, records)` and a
  // duplicate is answered with the original position. All records of one
  // append land in one slot, and the LSN is the slot. Answered once the
  // slot is chosen (ack-on-commit), or redirected to the leader.
  rpc Append(.paros.v1.Append) returns (.paros.v1.AppendAck);
  // Read chosen entries from `from_lsn` up (#185), from this node's (or
  // replica's) chosen prefix: holes — `Noop`s, control commands, #94
  // duplicates — are skipped; above the end it waits (long-poll) until
  // something is chosen or a deadline passes; below the trim point it
  // answers `trimmed_to` and nothing else.
  rpc Read(.paros.v1.Read) returns (.paros.v1.ReadAck);
  // A linearizable tail (#185): through read-index on the leader, or a
  // leaderless quorum read (#143) on any node or replica. The result is at
  // least every append acked before the call started.
  rpc CheckTail(.paros.v1.CheckTail) returns (.paros.v1.CheckTailAck);
  // Trim the journal below `up_to` (#185, formerly `Compact`): the leader
  // proposes a decided `Truncate`, so every reader gets one trim point.
  rpc Trim(.paros.v1.Trim) returns (.paros.v1.TrimAck);
  // Change the acceptor set (Matchmaker Paxos reconfiguration, #122). Only the
  // leader admits it, and only on a deployment that names matchmakers; every
  // other case is refused (`accepted: false`) and the client may retry.
  rpc Reconfigure(.paros.v1.Reconfigure) returns (.paros.v1.ReconfigureAck);
  // Change the matchmaker set (Matchmaker Paxos §5, #125): any node of a
  // deployment that names matchmakers may drive it; refused (`accepted:
  // false`) on a plain deployment, while another handover runs here, or for
  // a target outside the matchmaker pool.
  rpc ReconfigureMatchmakers(.paros.v1.ReconfigureMatchmakers) returns (.paros.v1.ReconfigureMatchmakersAck);
}

// Every journal call names its journal (#184): `0` is unset and always
// refused (`unknown_journal`), as is any journal this process does not serve.

message Append {
  uint64 journal = 1;
  uint64 client = 2;
  uint64 seq = 3;
  // The records, in order. They land in one slot together.
  repeated bytes records = 4;
}

message AppendAck {
  uint64 seq = 1;
  optional uint64 leader = 2;
  bool committed = 3;
  // The slot the append landed in (its LSN), when committed.
  optional uint64 first_lsn = 4;
  bool unknown_journal = 5;
}

// The payload a user slot carries: the records of one append, in order. The
// core keeps it opaque; only the journal edge frames and unframes it.
message RecordBatch {
  repeated bytes records = 1;
}

message Read {
  uint64 journal = 1;
  uint64 from_lsn = 2;
  // A budget on the page's record bytes. A page that can hold an entry
  // always holds at least one, whatever its size.
  uint64 max_bytes = 3;
}

message LogEntry {
  uint64 lsn = 1;
  uint64 client = 2;
  uint64 seq = 3;
  repeated bytes records = 4;
}

message ReadAck {
  repeated LogEntry entries = 1;
  // Where the next read starts (entries and skipped holes alike).
  uint64 next_lsn = 2;
  // One past the serving node's contiguous chosen prefix.
  uint64 committed_end = 3;
  // Set when `from_lsn` is below the trim point: the first readable LSN.
  // Nothing else is answered then.
  optional uint64 trimmed_to = 4;
  bool unknown_journal = 5;
}

enum TailPath {
  // Read-index on the leader (a non-leader redirects).
  TAIL_PATH_LEADER = 0;
  // A leaderless quorum read (#143), on any node or replica.
  TAIL_PATH_QUORUM = 1;
}

message CheckTail {
  uint64 journal = 1;
  uint64 client = 2;
  uint64 seq = 3;
  TailPath path = 4;
}

message CheckTailAck {
  uint64 seq = 1;
  optional uint64 leader = 2;
  bool committed = 3;
  // One past the confirmed chosen prefix, when committed.
  optional uint64 committed_end = 4;
  bool unknown_journal = 5;
}

message Trim {
  uint64 journal = 1;
  // The last LSN the client permits dropping (inclusive).
  uint64 up_to = 2;
}

message TrimAck {
  optional uint64 leader = 1;
  bool accepted = 2;
  // The serving node's trim point (its first retained LSN).
  uint64 trim_point = 3;
  bool unknown_journal = 4;
}

message Reconfigure {
  // The new acceptor set (node ids drawn from the deployment's pool).
  repeated uint64 members = 1;
  // The quorum system the new configuration runs under, encoded exactly as
  // `paros.common.v1.AcceptorConfig` encodes it (the same field numbers):
  // a majority leaves every scalar at zero, so a request that names members
  // alone is byte-identical to before the field existed. A configuration
  // the membership does not admit is refused as `malformed`.
  .paros.common.v1.QuorumSystem quorum_system = 2;
  uint64 phase1_quorum = 3;
  uint64 phase2_quorum = 4;
  uint64 rows = 5;
  uint64 cols = 6;
}

message ReconfigureMatchmakers {
  // The new matchmaker set (matchmaker ids drawn from the deployment's pool).
  repeated uint64 members = 1;
}

message ReconfigureMatchmakersAck {
  // Whether the handover was started at this node.
  bool accepted = 1;
  // Why it was refused, when it was: "no_matchmakers", "busy", "empty",
  // "unknown_matchmaker".
  string refusal = 2;
  // The generation being replaced, when accepted.
  optional uint64 generation = 3;
}

message ReconfigureAck {
  optional uint64 leader = 1;
  // Whether the reconfiguration was started (a fresh ballot registered with
  // the new configuration). A refusal names its reason for diagnostics.
  bool accepted = 2;
  // Why it was refused, when it was: "not_leader", "no_matchmakers",
  // "unchanged", "unknown_member", "unsettled", "round_exhausted".
  string refusal = 3;
  // The ballot round the reconfiguration campaigns at, when accepted.
  optional uint64 round = 4;
}
