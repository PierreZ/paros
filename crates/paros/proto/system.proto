syntax = "proto3";

package paros.system.v1;

import "common.proto";

// The entries of the cell control journal (#189), the node registry: the
// cell tenant's control journal (#211, #235). Each is one record of a
// `Write`, and a slot holds exactly one: the slot is the entry's identity.
// The core keeps them opaque like every user entry; only `paros::system`
// reads them, and every node folds them the same way. A tenant's journals
// live in its own control journal (`tenant.proto`, #210).
//
// Keyed by `node_id` (random, minted at format): `RegisterNode` (a first
// registration, or a re-registration of the same node: a reboot),
// `DrainNode`, `RetireNode`, and the capacity bookings `BookCapacity` /
// `ReleaseCapacity` the cell coordinator writes, and the cell's side of the
// fleet (#229): `JoinFleet`, `HostTenant` and `DropTenant`. The node pool is
// the founding members plus every registered node not yet retired. The
// registry is checkpointed with `paros::client::checkpoint` (#230):
// `RegistryState` is the checkpoint's state, the latest entry per `node_id`
// and every live booking.
message SystemEntry {
  // 1 and 2 were the directory's `CreateJournal` and `DeleteJournal`,
  // moved to each tenant's control journal (#210).
  reserved 1, 2;
  oneof kind {
    RegisterNode register_node = 3;
    DrainNode drain_node = 4;
    RetireNode retire_node = 5;
    BookCapacity book_capacity = 6;
    ReleaseCapacity release_capacity = 7;
    JoinFleet join_fleet = 8;
    HostTenant host_tenant = 9;
    DropTenant drop_tenant = 10;
    MachineDown machine_down = 11;
    MachineUp machine_up = 12;
    MachineAdmitted machine_admitted = 13;
    GrantCapacity grant_capacity = 14;
    SetMachineTags set_machine_tags = 15;
    MachineSlow machine_slow = 16;
  }
}

// Add node `id`, reachable at `addr`, to the pool, as a machine of its
// class advertising `capacity` role slots of it. `tags` are its reserved
// tags (#575 (key:value tags)), as the machine is configured: `paros/class`
// (`storage` or `stateless`, required), `paros/zone` and `paros/rack`; any
// other key is refused. A registered node registering again (a reboot, a new
// incarnation) updates its address, capacity, zone, rack and incarnation; its
// class never changes, and its user tags stay.
//
// `incarnation` is the machine's RPC incarnation (moonpool-rpc's
// `Incarnation`, new at every process start), split in two halves: with
// `addr` it is the machine's `InterfaceRef` identity, since a machine serves
// well-known endpoints only. 0 is unknown.
message RegisterNode {
  // 3 was `failure_domain` and 4 `class`, now reserved tags (#575).
  reserved 3, 4;
  reserved "failure_domain", "class";
  uint64 id = 1;
  string addr = 2;
  uint64 capacity = 5;
  fixed64 incarnation_high = 6;
  fixed64 incarnation_low = 7;
  // The machine's name, for people (#399): a label, never its identity.
  string name = 8;
  // The machine's dynamic interface for this incarnation (#404), as its
  // `IdentifyAck` carries it; empty when it serves none.
  bytes machine_interface = 9;
  repeated paros.common.v1.Tag tags = 10;
}

// Request `request` (an idempotency id the caller draws): registered machine
// `id`'s user tags become `tags`, all of them at once (#575 (key:value
// tags)). A reserved key or a set over the cap is refused; a request already
// applied changes nothing, so a retry never undoes a later change.
message SetMachineTags {
  uint64 request = 1;
  uint64 id = 2;
  repeated paros.common.v1.Tag tags = 3;
}

// Stop placing new work on node `id` (it stays in the pool).
message DrainNode {
  uint64 id = 1;
}

// Remove a drained node `id` from the pool for good (its live bookings are
// released with it).
message RetireNode {
  uint64 id = 1;
}

// Book one role slot of node `node` for role `role` of the journal
// `(tenant, journal)`, or of the matchmaker set `(tenant, set)` when `set` is
// set (then `journal` is 0), under the booking id `booking` its writer drew.
// The role names the slot's class. Refused at apply when the id was ever
// booked (ids are never reused, across checkpoints too), the node is not
// registered (or is draining), is of another class than the role's, has no
// slot left, or already holds a live booking for the same role of the same
// journal or set.
message BookCapacity {
  uint64 booking = 1;
  uint64 node = 2;
  // 3 was `class`: the role names it.
  reserved 3;
  uint64 tenant = 4;
  uint64 journal = 5;
  string role = 6;
  uint64 set = 7;
  // A slot of the tenant as a whole (#476): its footprint or a tenant-wide
  // role. `journal` and `set` are 0.
  bool tenant_level = 8;
}

// The cell coordinator saw machine `id` stop answering (#211, D6): written
// only on a change, never twice for one incarnation. `incarnation` is the
// one the registry holds for the machine (two halves, as in `RegisterNode`).
message MachineDown {
  uint64 id = 1;
  fixed64 incarnation_high = 2;
  fixed64 incarnation_low = 3;
}

// The cell coordinator saw machine `id` answer again, as incarnation
// `incarnation` (#211, D6): written only on a change.
message MachineUp {
  uint64 id = 1;
  fixed64 incarnation_high = 2;
  fixed64 incarnation_low = 3;
}

// The cell coordinator judged machine `id`, as incarnation `incarnation`,
// slow (`slow`) or fast again (#361 (slow machines)): written only on a
// change, with the latency facts the judgement read.
message MachineSlow {
  uint64 id = 1;
  fixed64 incarnation_high = 2;
  fixed64 incarnation_low = 3;
  bool slow = 4;
  // Its `Identify` round trip, in microseconds, as the coordinator timed it.
  uint64 rtt_us = 5;
  // Its disk's busy ratio, in thousandths, from its last `Load` window.
  uint32 disk_busy_permille = 6;
  // Its CPU's busy ratio, in thousandths, from its last `Load` window.
  uint32 cpu_busy_permille = 7;
}

// The cell coordinator saw registered machine `id` answer `Identify` as a
// machine of this cell (#511 (placement books machines that never served)):
// its admission landed, so placement may book it. Written once, never for a
// founding member.
message MachineAdmitted {
  uint64 id = 1;
}

// Release booking `booking`: its slot is free again.
message ReleaseCapacity {
  uint64 booking = 1;
}

// The cell side of the fleet's registration (#229, `docs/architecture.md`
// §3.7): cell `cell_id` belongs to fleet `fleet_id`, speaking metadata
// `version`. Written once by `init` step 3; a re-run with the same pair
// changes nothing, any other pair is refused.
message JoinFleet {
  uint64 fleet_id = 1;
  uint64 cell_id = 2;
  uint32 version = 3;
}

// Tenant creation's cell step: the cell hosts tenant `tenant` (#229). The
// fleet named must be the one the cell joined. It records the tenant's
// control journal (#210), where the cell's machines learn its journals, and
// the name and `survives` (1 az, 2 region) its first coordinator describes
// it with. Booking the tenant's minimum footprint is #212.
message HostTenant {
  uint64 fleet_id = 1;
  uint64 tenant = 2;
  uint64 control_journal = 3;
  bytes name = 4;
  uint32 survives = 5;
}

// Tenant removal's cell step: the cell forgets tenant `tenant`, for good —
// a tombstone, written whether it was hosted or not; a later `HostTenant`
// of it is refused.
message DropTenant {
  uint64 fleet_id = 1;
  uint64 tenant = 2;
}

// The registry's checkpoint state (#230): every node registered at runtime,
// by id, and every live booking, by id — both in id order, so equal states
// encode to equal bytes.
message RegistryState {
  repeated RegisteredNodeState nodes = 1;
  repeated BookingState bookings = 2;
  // The fleet registration (#229): 0 while the cell joined none.
  uint64 fleet_id = 3;
  uint64 cell_id = 4;
  uint32 version = 5;
  // 6 was the hosted tenants' ids, replaced by `hosted` (#210).
  reserved 6;
  // The tenants the cell dropped, in id order: never hosted again.
  repeated uint64 dropped = 7;
  // Every booking id ever booked, in id order: a booking id is never booked
  // twice, across checkpoints (#211).
  repeated uint64 spent = 8;
  // What the cell coordinator last wrote of each machine's liveness, by id
  // (#211, D6): a genesis node or a registered one.
  repeated LivenessState liveness = 9;
  // The tenants the cell hosts, in id order (#210).
  repeated HostedTenantState hosted = 10;
  repeated GrantState grants = 11;
  // Every tag request applied (#575), in id order: never applied twice.
  repeated uint64 tagged = 12;
}

message HostedTenantState {
  uint64 tenant = 1;
  uint64 control_journal = 2;
  bytes name = 3;
  uint32 survives = 4;
}

message LivenessState {
  uint64 id = 1;
  fixed64 incarnation_high = 2;
  fixed64 incarnation_low = 3;
  bool up = 4;
  // Whether the cell coordinator holds it slow (#361 (slow machines)).
  bool slow = 5;
}

message RegisteredNodeState {
  // 3 was `failure_domain` and 4 `class`, now in `tags` (#575).
  reserved 3, 4;
  reserved "failure_domain", "class";
  uint64 id = 1;
  string addr = 2;
  uint64 capacity = 5;
  // 0 registered, 1 draining, 2 retired.
  uint32 standing = 6;
  uint64 registrations = 7;
  fixed64 incarnation_high = 8;
  fixed64 incarnation_low = 9;
  // The machine's name (#399).
  string name = 10;
  // The machine's dynamic interface (#404).
  bytes machine_interface = 11;
  // Whether the cell coordinator saw it in the cell (`MachineAdmitted`,
  // #511).
  bool admitted = 12;
  // Its tags (#575): its reserved tags, then its user tags.
  repeated paros.common.v1.Tag tags = 13;
}

message BookingState {
  uint64 booking = 1;
  uint64 node = 2;
  // 3 was `class`: the role names it.
  reserved 3;
  uint64 tenant = 4;
  uint64 journal = 5;
  string role = 6;
  uint64 set = 7;
  // A slot of the tenant as a whole (#476): its footprint or a tenant-wide
  // role. `journal` and `set` are 0.
  bool tenant_level = 8;
}

// A capacity request's outcome (#476), written by the cell coordinator (or,
// for a tenant's footprint at its birth, by the session that hosts it):
// every booking of `bookings` lands, or none does. `footprint` names the
// tenant's footprint (and `request` is 0); otherwise `request` is the
// requester's idempotency id. `refused` records that the writer found no
// room: `bookings` is then empty.
message GrantCapacity {
  uint64 request = 1;
  uint64 tenant = 2;
  bool footprint = 3;
  bool refused = 4;
  repeated BookCapacity bookings = 5;
}

// One recorded grant (#476): its key, tenant, and the booking ids it
// granted (none when refused).
message GrantState {
  uint64 request = 1;
  uint64 tenant = 2;
  bool footprint = 3;
  bool refused = 4;
  repeated uint64 bookings = 5;
}
