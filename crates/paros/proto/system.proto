syntax = "proto3";

package paros.system.v1;

import "common.proto";

// The entries of the system journals (#189, #229). Each is one record of an
// `Append`, and a system journal's slot holds exactly one: the slot is the
// entry's identity. The core keeps them opaque like every user entry; only
// `paros::system` reads them, and every node folds them the same way.
//
// The **directory**, a tenant's control journal (#235): `CreateJournal` and
// `DeleteJournal`. A created journal's id is random, drawn by its creator
// from the user range (`>= 256`) and checked here at apply: a reserved or
// already used id is refused and the creator redraws. An id is never reused.
//
// The **node registry**, the cell tenant's control journal (#211): keyed by
// `node_id` (random, minted at format), `RegisterNode` (a first registration,
// or a re-registration of the same node: a reboot), `DrainNode`,
// `RetireNode`, and the capacity bookings `BookCapacity` / `ReleaseCapacity`
// the cell coordinator writes. The node pool is the genesis pool plus every
// registered node not yet retired. The registry is checkpointed with
// `paros::client::checkpoint` (#230): `RegistryState` is the checkpoint's
// state, the latest entry per `node_id` and every live booking. It also
// holds the cell's half of the fleet registration (`RegisterFleet`) and the
// tenants the cell hosts (`HostTenant` / `UnhostTenant`, #229).
//
// The **meta tenant's control journal** (`1/1`, #229): the fleet's
// directory — every cell (`RegisterCell`, `CellReady`) and every tenant with
// its cell assignment and state (`RegisterTenant`, `TenantReady`,
// `RemoveTenant`, `ForgetTenant`). Every fleet step names the fleet (and the
// cell) it believes it talks to, and is refused at apply when they are not
// the ones recorded: the registration is verified on every step. `MetaState`
// is its checkpoint's state.
message SystemEntry {
  oneof kind {
    CreateJournal create_journal = 1;
    DeleteJournal delete_journal = 2;
    RegisterNode register_node = 3;
    DrainNode drain_node = 4;
    RetireNode retire_node = 5;
    BookCapacity book_capacity = 6;
    ReleaseCapacity release_capacity = 7;
    RegisterCell register_cell = 8;
    CellReady cell_ready = 9;
    RegisterTenant register_tenant = 10;
    TenantReady tenant_ready = 11;
    RemoveTenant remove_tenant = 12;
    ForgetTenant forget_tenant = 13;
    RegisterFleet register_fleet = 14;
    HostTenant host_tenant = 15;
    UnhostTenant unhost_tenant = 16;
    DescribeTenant describe_tenant = 17;
  }
}

// Create journal `id` named `name` (opaque bytes) over `config`, its static
// acceptor configuration. Of two creates with one name, or one id, the
// lower slot wins.
message CreateJournal {
  bytes name = 1;
  paros.common.v1.AcceptorConfig config = 2;
  uint64 id = 3;
}

// A tenant's control journal describes its tenant (#210): its name, written
// once by the tenant's creator, so every index above it — the cell's hosted
// list, meta's directory — can be rebuilt from it.
message DescribeTenant {
  bytes name = 1;
}

// Delete journal `id`: a tombstone, never a reuse.
message DeleteJournal {
  uint64 id = 1;
}

// Add node `id`, reachable at `addr`, to the pool, as a machine of `class`
// (`storage` or `stateless`) advertising `capacity` role slots of it. A
// registered node registering again (a reboot) updates its address and
// capacity; its class never changes.
message RegisterNode {
  uint64 id = 1;
  string addr = 2;
  string failure_domain = 3;
  string class = 4;
  uint64 capacity = 5;
}

// Stop placing new work on node `id` (it stays in the pool).
message DrainNode {
  uint64 id = 1;
}

// Remove a drained node `id` from the pool for good (its live bookings are
// released with it).
message RetireNode {
  uint64 id = 1;
}

// Book one `class` role slot of node `node` for the journal
// `(tenant, journal)`, under the booking id `booking` its writer drew. Refused
// at apply when the id names a live booking, the node is not registered (or is
// draining), is of another class, or has no slot left.
message BookCapacity {
  uint64 booking = 1;
  uint64 node = 2;
  string class = 3;
  uint64 tenant = 4;
  uint64 journal = 5;
}

// Release booking `booking`: its slot is free again.
message ReleaseCapacity {
  uint64 booking = 1;
}

// Meta: register cell `cell_id` in fleet `fleet_id` (the first one names
// the fleet), state REGISTERING. `metadata_version` is the format the writer
// speaks; a reader refuses one it does not understand.
message RegisterCell {
  uint64 fleet_id = 1;
  uint64 cell_id = 2;
  uint32 metadata_version = 3;
}

// Meta: cell `cell_id` is READY (from REGISTERING or RESTORING).
message CellReady {
  uint64 fleet_id = 1;
  uint64 cell_id = 2;
}

// Meta: register tenant `tenant` (random, drawn by its creator) named `name`
// in cell `cell_id`, state REGISTERING. Refused for a reserved, taken or
// forgotten id (the creator redraws), a taken name, or a cell not READY.
message RegisterTenant {
  uint64 fleet_id = 1;
  uint64 cell_id = 2;
  uint64 tenant = 3;
  bytes name = 4;
}

// Meta: tenant `tenant`, created in cell `cell_id`, is READY.
message TenantReady {
  uint64 fleet_id = 1;
  uint64 cell_id = 2;
  uint64 tenant = 3;
}

// Meta: tenant `tenant` is REMOVING (from any state).
message RemoveTenant {
  uint64 fleet_id = 1;
  uint64 tenant = 2;
}

// Meta: a REMOVING tenant is gone; its id is never used again, its name is
// free.
message ForgetTenant {
  uint64 fleet_id = 1;
  uint64 tenant = 2;
}

// Cell: this cell is `cell_id` of fleet `fleet_id` — the cell's half of the
// registration, written once.
message RegisterFleet {
  uint64 fleet_id = 1;
  uint64 cell_id = 2;
  uint32 metadata_version = 3;
}

// Cell: this cell hosts tenant `tenant` named `name`, whose control journal
// (`tenant/1`, #210) runs over `control` — placed by the creator until the
// cell coordinator places it (#212). Every machine `control` names starts it.
message HostTenant {
  uint64 fleet_id = 1;
  uint64 cell_id = 2;
  uint64 tenant = 3;
  bytes name = 4;
  paros.common.v1.AcceptorConfig control = 5;
}

// Cell: this cell no longer hosts tenant `tenant`; its id is never hosted
// again.
message UnhostTenant {
  uint64 fleet_id = 1;
  uint64 cell_id = 2;
  uint64 tenant = 3;
}

// The registry's checkpoint state (#230): every node registered at runtime,
// by id, and every live booking, by id — both in id order, so equal states
// encode to equal bytes.
message RegistryState {
  repeated RegisteredNodeState nodes = 1;
  repeated BookingState bookings = 2;
  // The cell's registration, if written (#229).
  FleetRegistration registration = 3;
  // The tenants the cell hosts, in id order, and the ids it hosted once.
  repeated HostedTenantState tenants = 4;
  repeated uint64 unhosted = 5;
}

message FleetRegistration {
  uint64 fleet_id = 1;
  uint64 cell_id = 2;
  uint32 metadata_version = 3;
}

message HostedTenantState {
  uint64 tenant = 1;
  bytes name = 2;
  paros.common.v1.AcceptorConfig control = 3;
}

// A tenant control journal's checkpoint state (#210): the tenant's name, every
// journal it created (in id order, a deleted one with its tombstone's
// position, 0 for a live one plus one), so equal states encode to equal bytes.
message DirectoryState {
  bytes name = 1;
  bool described = 2;
  repeated CreatedJournalState journals = 3;
}

message CreatedJournalState {
  uint64 id = 1;
  bytes name = 2;
  paros.common.v1.AcceptorConfig config = 3;
  // The tombstone's position plus one; 0: live.
  uint64 deleted_at = 4;
}

// Meta's checkpoint state (#229): the fleet id, every cell and every
// tenant in id order, and every forgotten tenant id.
message MetaState {
  uint64 fleet_id = 1;
  repeated CellEntryState cells = 2;
  repeated TenantEntryState tenants = 3;
  repeated uint64 forgotten = 4;
}

message CellEntryState {
  uint64 cell_id = 1;
  // 0 registering, 1 ready, 2 removing, 3 restoring.
  uint32 state = 2;
  uint32 metadata_version = 3;
}

message TenantEntryState {
  uint64 tenant = 1;
  bytes name = 2;
  uint64 cell_id = 3;
  // 0 registering, 1 ready, 2 removing, 3 updating configuration,
  // 4 renaming, 5 error.
  uint32 state = 4;
  uint64 config_seq = 5;
  // 0: none (reserved, unused in M9).
  uint64 tenant_group = 6;
}

message RegisteredNodeState {
  uint64 id = 1;
  string addr = 2;
  string failure_domain = 3;
  string class = 4;
  uint64 capacity = 5;
  // 0 registered, 1 draining, 2 retired.
  uint32 standing = 6;
  uint64 registrations = 7;
}

message BookingState {
  uint64 booking = 1;
  uint64 node = 2;
  string class = 3;
  uint64 tenant = 4;
  uint64 journal = 5;
}
