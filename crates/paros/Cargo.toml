[package]
name = "paros"
description = "Paxos in Rust — the node library: sans-IO core re-export + the provider-generic driver; client API and binary land here"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/paros"
readme = "../../README.md"

[dependencies]
# `tracing` is spelled out: the library's spans are non-optional, so the core's
# spans under them must not depend on the core's default feature set.
paros-core = { path = "../paros-core", version = "0.2.0", features = ["tracing", "serde"] }

# The driver is generic over moonpool's `Providers` abstraction, and speaks
# moonpool-rpc over those providers, so the SAME code — transport included —
# runs in production (TokioProviders) and deterministic simulation
# (SimProviders). Both Moonpool crates come in without production providers so
# `paros` stays wasm-safe; the `parosd` crate layers tokio back on (#206).
# Pinned to a commit on moonpool's `main` (it evolves fast; not
# the crates.io release) — same rev as paros-sim.
moonpool-core = { git = "https://github.com/PierreZ/moonpool", rev = "d2788360bc96cb8ea0fb4217a0fb4c68139dfb7c", default-features = false, features = ["select"] }
# Typed request/reply RPC over the provider traits, protobuf bodies (prost).
moonpool-rpc = { git = "https://github.com/PierreZ/moonpool", rev = "d2788360bc96cb8ea0fb4217a0fb4c68139dfb7c", default-features = false, features = ["prost"] }
# The durable store behind `JournalStorage` / `JournalMatchmakerStorage`: the
# CLSTORE write-ahead journal over moonpool's `BlockFile`, generic over the
# provider's `StorageProvider` — the same bytes on Tokio and on the simulator.
moonpool-journal = { git = "https://github.com/PierreZ/moonpool", rev = "d2788360bc96cb8ea0fb4217a0fb4c68139dfb7c" }
# Inline fault injection in the shipped code (#294): `hint!` names a moment
# the simulator may strike at, `buggify_*!` tilts a choice; inert outside a
# simulation. `reachable!`/`sometimes!` are the probes beside them.
moonpool-buggify = { git = "https://github.com/PierreZ/moonpool", rev = "d2788360bc96cb8ea0fb4217a0fb4c68139dfb7c" }
moonpool-assertions = { git = "https://github.com/PierreZ/moonpool", rev = "d2788360bc96cb8ea0fb4217a0fb4c68139dfb7c" }

prost = "0.14"
# The journal stores' record codec (paros-core's `serde` derives, one compact
# binary encoding) and the decided-snapshot chunk checksums.
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
crc32c = "0.6"
# The driver emits standard observability events (node_tick, peer_message_received)
# and wraps every loop stage in an `#[instrument]` span carrying the node id.
tracing = "0.1"
# Runtime-neutral queues between the RPC edge and the single-owner driver
# loop. The runtime itself is supplied by the Moonpool providers.
tokio = { version = "1", features = ["sync"] }
# `CancellationToken` is the driver's shutdown signal (what `ctx.shutdown()`
# hands back in sim; production constructs its own).
tokio-util = "0.7"

[dev-dependencies]
# `block_on`, to drive the async storage seam's contract suites against the
# in-memory stores from plain unit tests (the sim awaits them in a workload).
futures = { version = "0.3", default-features = false, features = ["executor"] }
# The journal stores' tests run on the simulator's storage (the provider the
# harness ships), stepped by hand beside a current-thread runtime.
moonpool-sim = { git = "https://github.com/PierreZ/moonpool", rev = "d2788360bc96cb8ea0fb4217a0fb4c68139dfb7c", default-features = false }
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[build-dependencies]
prost-build = "0.14"

[lints]
workspace = true
