[package]
name = "consensus-sim"
description = "Seeded random walks over the sans-IO roles of paros-consensus, with independent safety and liveness oracles"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Test only: the walks live in `tests/`, the model and the oracles in `src/`.
# It depends on paros-consensus directly, never on the `paros` facade (rule 3
# of `crates/lib/paros/AGENTS.md`). `assertions` puts the core's coverage
# probes in the walk's assertion table.
[dependencies]
paros-consensus = { workspace = true, features = ["assertions"] }
# The seeded walk (moonpool #554). Pinned to the same moonpool rev as the
# `moonpool-assertions` line of paros-consensus, so the workspace resolves one
# copy of the assertion table.
moonpool-walk = { git = "https://github.com/PierreZ/moonpool", rev = "ab3d8a80329649c1dc1231486230390b44599331" }
# The campaign owns the assertion table, so it judges which sites a flavor
# must reach (`src/campaign.rs`).
moonpool-assertions = { git = "https://github.com/PierreZ/moonpool", rev = "ab3d8a80329649c1dc1231486230390b44599331" }
# Model-based trace checking (moonpool #550): a walk's steps as a TLA+
# trace, judged by TLC against the models of `specs/tla/` (#1198).
moonpool-tla = { git = "https://github.com/PierreZ/moonpool", rev = "ab3d8a80329649c1dc1231486230390b44599331" }

# Tests only: `tests/coverage.rs`.
[dev-dependencies]
# Code coverage for the exploring walks (#1199): `sancov_edges_covered_live`
# reads the SanitizerCoverage counters of `paros-consensus` when
# `scripts/sancov-rustc.sh` instruments it, and returns 0 otherwise.
moonpool-explorer = { git = "https://github.com/PierreZ/moonpool", rev = "ab3d8a80329649c1dc1231486230390b44599331" }

[lints]
workspace = true
