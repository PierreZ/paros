[package]
name = "journal-sim"
description = "Seeded random walks over the pure journal core of paros (paros-journal), with independent oracles and a trace check against the TLA+ model"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Test only: the walks live in `tests/`, the models and the oracles in `src/`.
# It depends on paros-journal directly, never on the `paros` facade (rule 3 of
# `crates/lib/paros/AGENTS.md`). The moonpool rev is the rev of consensus-sim
# and of the `moonpool-assertions` line of paros-consensus: one copy of the
# assertion table in the workspace.
[dependencies]
paros-journal = { workspace = true }
paros-journal-control = { workspace = true }
paros-journal-io = { workspace = true }
moonpool-walk = { git = "https://github.com/PierreZ/moonpool", rev = "cf24c75f38b945a2b306c3ee0125a37dfd26e1e6" }
moonpool-assertions = { git = "https://github.com/PierreZ/moonpool", rev = "cf24c75f38b945a2b306c3ee0125a37dfd26e1e6" }
moonpool-tla = { git = "https://github.com/PierreZ/moonpool", rev = "cf24c75f38b945a2b306c3ee0125a37dfd26e1e6" }

[lints]
workspace = true
