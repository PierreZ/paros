[package]
name = "paros-sim-wasm-check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Proof that a seed of paros-sim is the same run on wasm32 as natively: one fingerprint per seed, from both builds"
publish = false

[lib]
# `cdylib` for the wasm-bindgen bundle node loads, `rlib` for the native
# binary that prints the same lines.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sim-seed-fingerprint"
path = "src/bin/sim-seed-fingerprint.rs"

[dependencies]
paros-sim = { path = "../paros-sim", version = "0.2.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# MUST stay exactly 0.2.129: the flake pins `wasm-bindgen-cli` 0.2.129, and the
# CLI refuses a bundle produced by any other version of the crate.
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"

[lints]
workspace = true
