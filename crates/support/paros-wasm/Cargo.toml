[package]
name = "paros-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The site's wasm tools: the Paxos step-through engine on paros-consensus (`paxos`), the journal fold lab on paros-journal (`journal`)"
publish = false

[lib]
# `cdylib` for the wasm-bindgen bundle the browser loads, `rlib` for the
# native tests.
crate-type = ["cdylib", "rlib"]

# Each feature is one wasm tool and one `.wasm` bundle, built alone
# (`scripts/build-wasm.sh` builds with `--no-default-features --features <tool>`).
# The `playground` tool (paros + moonpool-sim) was removed on 2026-11-19; it is
# at the tag `v0.2.0-alpha.1` (docs/archive/v0.2.0-alpha.1/paros-wasm-playground.md).
[features]
default = ["paxos", "journal"]
# The Paxos step-through engine (#308, #811): `paros-consensus` driven by hand, and
# nothing else.
paxos = ["dep:paros-consensus", "dep:serde", "dep:serde_json"]
# The journal fold lab (#1363): `paros-journal` driven by hand, and nothing
# else.
journal = ["dep:paros-journal", "dep:serde", "dep:serde_json"]

[[test]]
name = "paxos_traces"
required-features = ["paxos"]

[[test]]
name = "paxos_world"
required-features = ["paxos"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

# `paxos`: the sans-IO core alone, with its serde derives.
paros-consensus = { workspace = true, default-features = false, features = [
  "serde",
], optional = true }

# `journal`: the pure journal core alone (it takes `paros-consensus` with its
# features off).
paros-journal = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# MUST stay exactly 0.2.130: the flake pins `wasm-bindgen-cli` 0.2.130, and the
# CLI refuses a bundle produced by any other version of the crate.
wasm-bindgen = "=0.2.130"
# The JSON the wasm exports take and answer.
serde_json = { version = "1", optional = true }
console_error_panic_hook = "0.1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
