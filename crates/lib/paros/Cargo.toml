[package]
name = "paros"
description = "Paxos in Rust: the library. One crate a program depends on; today it holds the sans-IO consensus core (`paros::consensus`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../../README.md"
# Agent notes stay in the repository, out of the published crate.
exclude = ["AGENTS.md", "CLAUDE.md"]

# The facade: each layer is its own crate, and this crate re-exports each one
# as a module: today the sans-IO consensus core. The
# journal layers of the old designs are at the tags `v0.2.0-alpha.1` and
# `journal-design-a` (docs/archive/).
[dependencies]
paros-consensus = { workspace = true, features = ["tracing", "assertions", "serde"] }

[lints]
workspace = true
