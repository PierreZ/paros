[package]
name = "paros"
description = "Paxos in Rust: the library. One crate a program depends on; today it holds the sans-IO consensus core (`paros::consensus`), the pure journal core (`paros::journal`) and the journal's IO traits and driver (`paros::journal_io`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../../README.md"
# Agent notes stay in the repository, out of the published crate.
exclude = ["AGENTS.md", "CLAUDE.md"]

# The facade: each layer is its own crate, and this crate re-exports each one
# as a module: the sans-IO consensus core, the pure core of the journal v1
# (`docs/journal/`), and the journal's IO traits and generic driver. The journal layers of the old design are at the tag
# `v0.2.0-alpha.1` (docs/archive/v0.2.0-alpha.1/).
[dependencies]
paros-consensus = { workspace = true, features = ["tracing", "assertions", "serde"] }
paros-journal = { workspace = true }
paros-journal-io = { workspace = true }

# The examples only. A program brings its own runtime; the example
# `tokio_tasks` shows one. The library itself depends on no runtime
# (`scripts/check-core-deps.sh` checks the facade's normal dependencies).
[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }

[lints]
workspace = true
