[package]
name = "paros-model"
description = "paros's model layer: the pure folds of the control journals and the types every layer shares"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/paros-model"

[dependencies]
paros-core = { workspace = true, features = ["tracing", "assertions", "serde"] }
paros-wire = { workspace = true }
crc32c = { workspace = true }
futures = { workspace = true }
moonpool-assertions = { workspace = true }
moonpool-core = { workspace = true, features = ["select"] }
moonpool-journal = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
moonpool-sim = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
