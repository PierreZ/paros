[package]
name = "paros-net"
description = "paros's net layer: addresses, the transport, the RPC clients and the inbound edge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/paros-net"

[dependencies]
paros-core = { workspace = true, features = ["tracing", "assertions", "serde"] }
paros-model = { workspace = true }
paros-wire = { workspace = true }
paros-tunables = { workspace = true }
futures = { workspace = true }
moonpool-assertions = { workspace = true }
moonpool-core = { workspace = true, features = ["select"] }
moonpool-rpc = { workspace = true, features = ["prost"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[features]
# Session protection (`net::tls`): TLS 1.3 and mutual TLS through
# moonpool-rpc's upgrade. Off by default: rustls and ring are host code.
tls = ["moonpool-rpc/tls-pki"]

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
moonpool-sim = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
