[package]
name = "paros-election"
description = "A coordination store over a paros journal, on the ideas of ZooKeeper and Apache Curator: sessions, a tree of nodes, leader latches and their terms, as a pure fold that every member runs. Sans-IO, no clock, no randomness"
version.workspace = true
publish = false
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]

# A pure crate (docs/journal/04-roles.md §J4.3): it depends on the journal
# core only, and it holds one journal client (docs/architecture/04-roles.md
# §4.4, "The coordination store"). The program gives it the time and each
# draw (a session id, a jitter) as values.
[dependencies]
paros-journal = { workspace = true }

[lints]
workspace = true
