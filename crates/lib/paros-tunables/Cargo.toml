[package]
name = "paros-tunables"
description = "paros's tunables: every role's and the client's plain-data knobs, and their floors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/paros-tunables"

[dependencies]
paros-core = { workspace = true, features = ["tracing", "assertions", "serde"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
moonpool-sim = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
