[package]
name = "paros-journal-control"
description = "The grid controller of the paros journal: the pure decision of the v1 controller (heal, scrub, hold and alert) over the journal's health measures. Sans-IO, no clock, no randomness"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]

# A pure crate (docs/journal/04-roles.md §J4.3): with no feature on it depends
# on workspace crates only, and its one feature only observes.
[features]
default = ["assertions"]
# Coverage probes on every branch of `decide` (docs/journal/06-controller.md
# §J6.2, test 6): moonpool's `reachable` accounting, as in paros-consensus.
# With the feature off a probe compiles to nothing.
assertions = ["dep:moonpool-assertions"]

[dependencies]
paros-consensus = { workspace = true }
paros-journal = { workspace = true }
# The rev of every other moonpool line of the workspace: one assertion table.
moonpool-assertions = { git = "https://github.com/PierreZ/moonpool", rev = "c698161bf4dea4ffbf43253254ce0fdf8204a905", version = "0.8", optional = true }

[lints]
workspace = true
