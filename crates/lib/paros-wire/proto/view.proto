syntax = "proto3";

package paros.view.v1;

import "common.proto";

// The administrative views (#399): read-only answers about one cell, its
// machines, its tenants and who holds which role. Every view is a request to
// one cell: a founding member of that cell answers it from the cell's own
// journals (the registry, the universe directory, the election journal and
// the tenant control journals), and filters the answer by the caller's scope
// before it sends it. The caller never filters.
//
// Ids are on the wire; every entity also carries its name, which is what
// `parosctl` prints (hex ids are for local debugging only).
service Views {
  rpc View(.paros.view.v1.ViewRequest) returns (.paros.view.v1.ViewReply);
}

// Who asks. Until the frontend checks tokens (#192, #245), every caller is
// an admin and may narrow itself to one tenant's scope; #245 derives the
// scope from the caller's Biscuit token instead (`view.detail` is admin).
message Scope {
  oneof kind {
    // Every detail of the cell.
    AdminScope admin = 1;
    // The spread of one tenant over its cell, by the tenant's name.
    bytes tenant = 2;
  }
}

message AdminScope {}

message ViewRequest {
  Scope scope = 1;
  oneof query {
    // The cell: its machines, its tenants and every role holder (admin).
    CellQuery cell = 2;
    // One tenant, by name: its journals and the machines they use.
    TenantQuery tenant = 3;
    // The universe directory: its cells and its tenants (admin), answered
    // by the cell that hosts the universe tenant.
    UniverseQuery universe = 4;
    // The cell's balance (admin, #687 (rebalance a cell)): `CellBalance`.
    BalanceQuery balance = 5;
  }
}

message BalanceQuery {}

message CellQuery {}

message TenantQuery {
  bytes name = 1;
}

message UniverseQuery {}

message ViewReply {
  // Empty when answered. Else: "forbidden" (the scope does not cover the
  // query), "unknown_tenant", "other_cell" (the tenant lives in the cell
  // `cell_id`, `cell_name` names it), "not_universe" (this cell does not
  // host the universe tenant), "unavailable" (a journal could not be read
  // to its tail), "malformed".
  string refusal = 1;
  // The answering cell (or, on "other_cell", the tenant's cell).
  uint64 cell_id = 2;
  bytes cell_name = 3;
  bytes universe_name = 4;
  // The cell's state in the universe directory ("" unknown).
  string cell_state = 5;
  // Where the answer was folded: the next position of the registry and of
  // the universe directory it read (0: not read). An answer is never newer
  // than these.
  uint64 registry_at = 6;
  uint64 directory_at = 7;
  // The machine that answered.
  uint64 answered_by = 8;
  // The cell coordinator now, as the election journal names it (0: none).
  uint64 coordinator = 9;
  uint64 coordinator_term = 10;
  repeated MachineView machines = 11;
  repeated TenantView tenants = 12;
  repeated CellView cells = 13;
  // The universe's id (0: this cell does not host its directory).
  uint64 universe_id = 14;
  // On "other_cell": the tenant's cell's entry endpoint, as the universe
  // directory records it (#232 (multiple cells)), one `HOST:PORT` each. A
  // caller asks those machines again.
  repeated string endpoint = 15;
  // How the cell's balance stands (#687 (rebalance a cell)): on a cell or a
  // balance query, judged live from the registry fold the answer names.
  CellBalance balance = 16;
}

// How the cell's balance stands (#687 (rebalance a cell)), from the
// registry alone: the busyness the cell coordinator measures is not in it,
// so a busyness gap shows only once its move is in flight.
message CellBalance {
  // "moving" (a move is in flight), "paused", "repairing" (a machine
  // leaves or is unwell: its moves come first), "unbalanced" (a gap the
  // balancer closes), "stuck" (a gap no move can close) or "balanced".
  string state = 1;
  // Whether an operator paused the balancer. A paused balancer may still
  // show "moving": the move in flight ends.
  bool paused = 2;
  // On "moving": the move.
  BalanceMoveView moving = 3;
  // On "repairing": why ("draining", "unwell" or "stranded": a role on a
  // machine that leaves) and the machine.
  string repair = 4;
  uint64 repair_machine = 5;
  string repair_machine_name = 6;
  // On "unbalanced" and "stuck": the gap.
  BalanceGap gap = 7;
  // The largest gap, in roles, that needs no move (`balance_spread`).
  uint32 spread = 8;
  // The last moves that ended, oldest first.
  repeated BalanceMoveView ended = 9;
  // Every storage machine that stays and is up, by zone then name, with
  // the roles it hosts.
  repeated BalanceMachine machines = 10;
}

message BalanceMoveView {
  uint64 tenant = 1;
  uint64 journal = 2;
  bytes tenant_name = 3;
  bytes journal_name = 4;
  uint64 from = 5;
  string from_name = 6;
  uint64 to = 7;
  string to_name = 8;
  // "roles" or "busy".
  string reason = 9;
  // The registry positions it started and ended at (0: in flight).
  uint64 started = 10;
  uint64 ended = 11;
  // "done", "abandoned", or "" in flight.
  string outcome = 12;
}

message BalanceGap {
  string zone = 1;
  // "roles" or "busy".
  string reason = 2;
  uint64 from = 3;
  string from_name = 4;
  uint64 from_roles = 5;
  uint64 to = 6;
  string to_name = 7;
  uint64 to_roles = 8;
}

message BalanceMachine {
  uint64 node_id = 1;
  string name = 2;
  string zone = 3;
  uint64 roles = 4;
}

// One machine. A tenant scope sees only the machines its journals use, and
// of each only its id, name, zone, rack and up, down or slow state.
message MachineView {
  // 4 was `class` and 7 `failure_domain`, now reserved tags (#575 (key:value
  // tags)).
  // 5 was `capacity`, removed with the role slots (#837 (remove role slots)).
  reserved 4, 5, 7;
  reserved "class", "failure_domain", "capacity";
  uint64 node_id = 1;
  string name = 2;
  string addr = 3;
  // The roles the machine hosts: its live bookings.
  uint64 booked = 6;
  // "registered", "draining", "drained" (draining, no slot left, #359),
  // "retired"; "founding" for a founding member the registry never held.
  string standing = 8;
  bool up = 9;
  fixed64 incarnation_high = 10;
  fixed64 incarnation_low = 11;
  bool founder = 12;
  repeated BookingView bookings = 13;
  // Its tags (#575): its reserved tags (`paros/class`, `paros/zone`,
  // `paros/rack`), then its user tags. A tenant scope sees only `paros/zone`
  // and `paros/rack`.
  repeated .paros.common.v1.Tag tags = 14;
  // The longest open maintenance window over the machine or its failure
  // domain, in milliseconds, as the registry records it (#359); 0 when none
  // is open. The window runs on the cell coordinator's clock.
  uint64 maintenance_ms = 15;
  // Whether the cell coordinator holds it slow (#361 (slow machines)): alive,
  // but its journals move off it.
  bool slow = 16;
}

message BookingView {
  uint64 booking = 1;
  string role = 2;
  uint64 tenant = 3;
  // The journal booked for (0 for a matchmaker set).
  uint64 journal = 4;
  // The matchmaker set booked for (0 for a journal).
  uint64 set = 5;
  // A slot of the tenant as a whole (#476): its footprint or a tenant-wide
  // role. `journal` and `set` are 0.
  bool tenant_level = 6;
}

// One tenant. A tenant scope sees only its own.
message TenantView {
  uint64 tenant = 1;
  // The tenant's name; for an internal tenant, the universe's or the
  // cell's.
  bytes name = 2;
  // "users", "universe" or "cell".
  string kind = 3;
  string state = 4;
  // 5 was `groups`, now the reserved tags (#575 (key:value tags)).
  reserved 5;
  reserved "groups";
  string survives = 6;
  uint64 cell_id = 7;
  repeated JournalView journals = 8;
  // Its tags (#575): its reserved tags (`paros/kind`, `paros/role`,
  // `paros/movable`), then its user tags.
  repeated .paros.common.v1.Tag tags = 9;
  // The tenant scrubber's progress (#362 (background scrubbing)), as its
  // control journal records it; unset before its first record.
  ScrubView scrub = 10;
}

// Where the tenant scrubber stands (#362): the pass, whether it read every
// live journal, whether it outlived its full-pass bound, the journal and
// slot it reads next, this pass's counts and the counts over every pass.
message ScrubView {
  uint64 pass = 1;
  bool done = 2;
  bool late = 3;
  uint64 journal = 4;
  uint64 next_slot = 5;
  uint64 checked = 6;
  uint64 damaged = 7;
  uint64 repaired = 8;
  uint64 mismatched = 9;
  uint64 damaged_total = 10;
  uint64 repaired_total = 11;
  uint64 mismatched_total = 12;
}

message JournalView {
  uint64 journal = 1;
  bytes name = 2;
  // "control", "election", "directory" (the universe directory), or
  // "data" for a journal the tenant created.
  string kind = 3;
  string writer = 4;
  string desired = 5;
  // The acceptors, by node id (their names are in `machines`).
  repeated uint64 acceptors = 6;
  // The matchmaker set's members (empty: plain Multi-Paxos).
  repeated uint64 matchmakers = 7;
  // The status (#191 (status), `docs/architecture/03-6-status.md` §3.6), computed live
  // from the registry fold the answer names, never written back.
  //
  // The acceptors the desired shape asks for (the founding members for a
  // journal the cell made).
  uint64 desired_acceptors = 8;
  // The placed configuration: `acceptors` with its quorum system.
  .paros.common.v1.AcceptorConfig placed = 9;
  // The word this answer judged from the machines it names: "healthy",
  // "degraded" or "unavailable" (`paros::status::Word`).
  string observed = 10;
  // The word the cell shows: `observed` once it held for the cell's
  // `status_hold`, else the word shown before (hysteresis).
  string word = 11;
  // Its user tags (#575); a journal the cell made carries none.
  repeated .paros.common.v1.Tag tags = 12;
  // How its stores commit a batch (#599 (durability mode per journal)):
  // "ordered" or "batched".
  string store_durability = 13;
}

// One cell of the universe directory.
message CellView {
  uint64 cell_id = 1;
  bytes name = 2;
  string state = 3;
  // How many tenants it hosts.
  uint64 tenants = 4;
  // Its tags (#575): its reserved kind tags, then its user tags.
  repeated .paros.common.v1.Tag tags = 5;
}
