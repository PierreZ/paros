syntax = "proto3";

package paros.checkpoint.v1;

// A checkpoint is a run of records in the journal it checkpoints (#353):
// `Begin`, then `Chunk` records, then `End`. Each record follows a magic
// prefix (`paros::client::checkpoint::MAGIC`) so a reader tells it from the
// owner's own entries, which paros never interprets. The owner writes the
// run as ordinary fenced `Write` batches, with no entry inside it, then
// makes `Begin` the journal's floor with a fenced `Truncate(up_to = Begin)`.
//
// `End` is the commit point: a run with no `End`, or with an `End` whose
// count or checksum is wrong, is not a checkpoint.
//
// Fields 1 to 3 held the retired `Inline` and `Ref` forms (#230); an old
// record decodes to no form, which a reader refuses.
message CheckpointRecord {
  reserved 1, 2, 3;
  oneof form {
    Begin begin = 4;
    Chunk chunk = 5;
    End end = 6;
  }
}

// The start of a run. The state covers every position below
// `covers_up_to`, which is the position of this record.
message Begin {
  uint64 covers_up_to = 1;
}

// One piece of the state. The state is the run's chunks concatenated in
// position order.
message Chunk {
  bytes bytes = 1;
}

// The end of a run: the count of its chunks and the CRC-32C of the chunks
// concatenated.
message End {
  uint64 chunks = 1;
  uint32 checksum = 2;
}
