syntax = "proto3";

package paros.common.v1;

// Types both paros contracts speak. A ballot and an acceptor configuration
// mean the same thing on the consensus wire (`internal.proto`) and on the
// matchmaker wire (`matchmaker.proto`) — a matchmaker registers exactly the
// configuration a `Prepare` later carries — so they are declared once here
// rather than twice, where the two copies could drift (in particular the
// quorum system, whose variants must stay identical on both wires).
//
// Declaring them in one package changes no bytes: protobuf encodes field
// numbers and wire types, never type names.

// A Paxos ballot: a round, disambiguated by the node that minted it.
message Ballot {
  uint64 round = 1;
  uint64 node = 2;
}

// How a quorum is derived from a membership. A majority is the default and
// the plain deployment's system; a grid (Compartmentalized Paxos §3.2: the
// sorted membership laid out row-major, `acks` accepts of one column choose
// a value, `rows - acks + 1` acceptors of every column elect,
// `rows * cols == n`) carries its two dimensions and its ack count. The same
// enum on both wires, so the variants cannot drift.
enum QuorumSystem {
  QUORUM_SYSTEM_MAJORITY = 0;
  QUORUM_SYSTEM_GRID = 1;
}

// An acceptor configuration: a membership plus the quorum system over it.
// The ack count and the two dimensions are meaningful only under
// `QUORUM_SYSTEM_GRID`, and a zero ack count is the full column; a majority
// configuration leaves all three at zero, so its encoding, and every
// message a plain deployment exchanges, carries none of them (proto3 omits
// default-valued fields).
message AcceptorConfig {
  repeated uint64 members = 1;
  QuorumSystem quorum_system = 2;
  uint64 acks = 3;
  uint64 rows = 4;
  uint64 cols = 5;
  // Each member's failure domain, parallel to `members` (#215 (zones)).
  // Empty is an unlabeled configuration; otherwise one per member, or the
  // configuration is refused.
  repeated FailureDomain domains = 6;
  // The cell that owns the journal (#215 (zones), `docs/architecture/03-7-universe.md`
  // §3.7). Zero is none.
  uint64 cell_id = 7;
  // The proxy leaders and the replicas of this configuration, bound to its
  // ballot (#754 (counts off the format marker)). Zero is none, the plain
  // arm. Each is at most 64, or the configuration is refused.
  uint64 proxies = 8;
  uint64 replicas = 9;
}

// A failure domain (#215 (zones)): the region and the availability zone a
// machine stands in, as the registry names them. Compared for equality
// only. Each name is at most 64 bytes.
message FailureDomain {
  string region = 1;
  string az = 2;
}

// A single-writer journal's leader uuid (#241, `docs/architecture/02-data-plane.md`
// §2.3): 128 random bits, `hi` the high half. All zero is unset, never a
// leader.
message LeaderUuid {
  fixed64 hi = 1;
  fixed64 lo = 2;
}

// A journal's control state (#204, #241) as the nodes exchange it: the
// current leader uuid, the hidden term, and where its dense positions stand.
// `leader` is absent until the first `SetLeader` (term zero is led by
// nobody). Internal only: a client is answered a `JournalView`.
message JournalState {
  uint64 next_seq = 1;
  uint64 first_seq = 2;
  LeaderUuid leader = 3;
  uint64 term = 4;
}

// Who may write a journal (#241), fixed when it is created: one leader
// under its leader uuid, or anyone. Single-writer is the zero value.
enum WriterMode {
  WRITER_MODE_SINGLE = 0;
  WRITER_MODE_MULTI = 1;
}

// What a client learns of a journal's state (#241): the leader uuid and the
// positions, never the term.
message JournalView {
  LeaderUuid leader = 1;
  uint64 next_seq = 2;
  uint64 first_seq = 3;
}

// One `key:value` tag (#575 (key:value tags), `docs/architecture/03-8-identifiers-checkpoints-recovery-security.md` §3.9).
// A key is `[prefix/]name` of lowercase ASCII letters, digits, `-` and `_`,
// at most 63 bytes; a key under the reserved prefix `paros/` is written only
// by the control plane. A value is printable UTF-8 without `,`, at most 255
// bytes. An entity's tags travel in key order, each key once.
message Tag {
  string key = 1;
  string value = 2;
}
