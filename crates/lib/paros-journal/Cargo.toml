[package]
name = "paros-journal"
description = "The pure journal core of paros: the journal fold, the segment records, the codec and the record headers. Sans-IO, no clock, no randomness"
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
exclude = ["AGENTS.md", "CLAUDE.md"]

# The journal composes the consensus core and adds no concept to it
# (docs/journal/04-roles.md §J4.3). It uses the core's identifiers (`Seq`,
# `LeaderUuid`, `NodeId`, `Slot`) as data only, with the core's optional
# features off, so this crate stays dependency-free and wasm-safe.
[features]
default = ["assertions"]
# Coverage probes on the rare branches of the journal roles
# (docs/journal/07-verification.md §J7.3, the coverage gate): moonpool's
# `reachable` accounting, as in paros-consensus. With the feature off a probe
# compiles to nothing, and the crate depends on workspace crates only.
assertions = ["dep:moonpool-assertions"]

[dependencies]
paros-consensus = { workspace = true }
# The rev of every other moonpool line of the workspace: one assertion table.
moonpool-assertions = { git = "https://github.com/PierreZ/moonpool", rev = "cf24c75f38b945a2b306c3ee0125a37dfd26e1e6", version = "0.8", optional = true }

[lints]
workspace = true
