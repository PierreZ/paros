[package]
name = "paros-play"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The interactive Paxos game engine: paros-core driven by hand, levels, prompts and views"
publish = false

[lib]
# `cdylib` for the wasm-bindgen bundle the browser loads, `rlib` for the native
# tests and the level registry.
crate-type = ["cdylib", "rlib"]

[dependencies]
paros-core = { path = "../paros-core", version = "0.2.0", default-features = false, features = [
  "serde",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `serde-compat` (a default feature) is what makes the generated TypeScript
# honour the `#[serde(tag = ..)]` / `#[serde(rename_all = ..)]` attributes.
ts-rs = { version = "12", features = ["serde-compat"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# MUST stay exactly 0.2.117: the flake pins `wasm-bindgen-cli` 0.2.117, and the
# CLI refuses a bundle produced by any other version of the crate.
wasm-bindgen = "=0.2.117"
console_error_panic_hook = "0.1"

[lints]
workspace = true
