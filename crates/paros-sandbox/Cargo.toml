[package]
name = "paros-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Paxos sandbox: a paros cell on moonpool's simulated network, disk and clock, replayed from a seed and an action log"
publish = false

[lib]
# `cdylib` for the wasm-bindgen bundle the browser loads, `rlib` for the
# native tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The library alone, with no TLS (rustls and ring are host code): the
# machines run the shipped `run_machine`, the operator the shipped client.
paros = { path = "../paros", version = "0.2.0" }
# The simulator without its exploration and Tokio features builds for
# wasm32-unknown-unknown. The pin is the one every paros crate shares.
moonpool-sim = { git = "https://github.com/PierreZ/moonpool", rev = "4bab77e6e13ea0a6f919880eabfdb43fbc0ad360", default-features = false }
moonpool-rpc = { git = "https://github.com/PierreZ/moonpool", rev = "4bab77e6e13ea0a6f919880eabfdb43fbc0ad360", default-features = false, features = ["prost"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio-util = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# MUST stay exactly 0.2.129: the flake pins `wasm-bindgen-cli` 0.2.129, and the
# CLI refuses a bundle produced by any other version of the crate.
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"

[lints]
workspace = true
