# The paros toy (#196), a demo to run paros by hand (no test runs it): one cell of five machines over three failure
# domains, every one the same `parosd` image configured by PAROS_* variables.
#
#   docker compose up -d --build
#   docker compose run --rm init
#   docker compose run --rm parosctl tenant create acme
#   docker compose run --rm parosctl journal create acme orders   # prints journal=T/J
#   docker compose run --rm parosctl write T/J hello world --leader 7
#   docker compose run --rm parosctl read T/J
#
# The copy-paste demo is DEMO.md; the walkthrough is crates/parosd/README.md.
# A machine mints its node id on
# its first start and waits, configured with no peer; `init` forms the cell over the
# three nodes the `members` alias resolves to (`cell init`'s founding members, #277)
# and claims its control journal. `storage4` and `stateless1` idle until `parosctl cell add-machine` admits them, then wait for placement,
# which is M9 (#211, #212). No restart policy: exit 78 means "do not restart" (an operator acts),
# and `docker compose start <machine>` brings a killed machine back.
#
# Every machine's IP is pinned (`ipv4_address` below, subnet in `networks.default.ipam`): the
# cell plan records each member's resolved address at `init`, and a machine serves on it until
# the registry publishes addresses (#216). Without a pin, Compose can hand a restarted
# container a different IP, and `parosd` fails to bind the one the plan froze.

name: paros

x-parosd: &parosd
  image: paros:local
  build: .
  environment: &env
    PAROS_STORE_LAYOUT: small
    RUST_LOG: warn,parosd=info,paros::machine=info

x-parosctl: &parosctl
  image: paros:local
  entrypoint: ["parosctl", "--servers", "members:4500", "--timeout-ms", "10000"]
  profiles: ["tools"]
  restart: "no"

services:
  node1:
    <<: *parosd
    hostname: node1
    environment:
      <<: *env
      PAROS_LISTEN: node1:4500
      PAROS_CLASS: storage
      PAROS_FAILURE_DOMAIN: zone-a
    volumes: [node1:/var/lib/paros]
    networks: { default: { aliases: [members], ipv4_address: 172.30.89.11 } }

  node2:
    <<: *parosd
    hostname: node2
    environment:
      <<: *env
      PAROS_LISTEN: node2:4500
      PAROS_CLASS: storage
      PAROS_FAILURE_DOMAIN: zone-b
    volumes: [node2:/var/lib/paros]
    networks: { default: { aliases: [members], ipv4_address: 172.30.89.12 } }

  node3:
    <<: *parosd
    hostname: node3
    environment:
      <<: *env
      PAROS_LISTEN: node3:4500
      PAROS_CLASS: storage
      PAROS_FAILURE_DOMAIN: zone-c
    volumes: [node3:/var/lib/paros]
    networks: { default: { aliases: [members], ipv4_address: 172.30.89.13 } }

  storage4:
    <<: *parosd
    hostname: storage4
    environment:
      <<: *env
      PAROS_LISTEN: storage4:4500
      PAROS_CLASS: storage
      PAROS_FAILURE_DOMAIN: zone-a
    volumes: [storage4:/var/lib/paros]
    networks: { default: { ipv4_address: 172.30.89.14 } }

  stateless1:
    <<: *parosd
    hostname: stateless1
    environment:
      <<: *env
      PAROS_LISTEN: stateless1:4500
      PAROS_CLASS: stateless
      PAROS_FAILURE_DOMAIN: zone-b
    volumes: [stateless1:/var/lib/paros]
    networks: { default: { ipv4_address: 172.30.89.21 } }

  # `init`, once, after `up`: `cell init` over the three nodes the `members`
  # alias names, every one of them needed. It waits for them to listen;
  # re-running it resumes an interrupted init, and is refused on an
  # initialized cell.
  init:
    <<: *parosctl
    entrypoint: ["parosctl", "--servers", "members:4500", "init", "--patience-ms", "60000"]
    depends_on: [node1, node2, node3]

  # Any parosctl command against the members: `docker compose run --rm parosctl …`.
  parosctl:
    <<: *parosctl

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.89.0/24
          ip_range: 172.30.89.128/25

volumes:
  node1:
  node2:
  node3:
  storage4:
  stateless1:
