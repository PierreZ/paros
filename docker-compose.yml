    # The servers by default: cell-1's machines. A `--servers` on the command line replaces
    # them (`--servers cell2:4500` asks cell-2), where an entrypoint flag would add to them.
    PAROSCTL_SERVERS: members:4500
    # The admin certificate and the admin token of the demo set.
    PAROSCTL_TLS_CA_PEM: *ca
    PAROSCTL_TLS_CERT_PEM: |
      -----BEGIN CERTIFICATE-----
      MIIBcTCCASOgAwIBAgIUClBwQEc9MBflrCGoBHYzEP7ndcowBQYDK2VwMBkxFzAV
