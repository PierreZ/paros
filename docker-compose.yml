# The paros toy (#196), a demo to run paros by hand (no test runs it): one cell of five machines over three failure
# domains, every one the same `parosd` image configured by PAROS_* variables.
#
#   docker compose up -d --build
#   docker compose run --rm init          # prints journals=T/J
#   docker compose run --rm parosctl write T/J hello world --owner 7
#   docker compose run --rm parosctl read T/J
#
# The copy-paste demo is DEMO.md; the walkthrough is crates/parosd/README.md.
# A machine mints its node id on
# its first start and waits; `init`, sent to node1, forms the cell over the
# three nodes the `seeds` alias resolves to (the rendezvous) and claims its control
# journal. `storage4` and `stateless1` wait for placement, which is M9 (#211,
# #212). No restart policy: exit 78 means "do not restart" (an operator acts),
# and `docker compose start <machine>` brings a killed machine back.

name: paros

x-parosd: &parosd
  image: paros:local
  build: .
  environment: &env
    PAROS_RENDEZVOUS: seeds:4500
    PAROS_STORE_LAYOUT: small
    RUST_LOG: warn,parosd=info,paros::machine=info

x-parosctl: &parosctl
  image: paros:local
  entrypoint: ["parosctl", "--servers", "seeds:4500", "--timeout-ms", "10000"]
  profiles: ["tools"]
  restart: "no"

services:
  node1:
    <<: *parosd
    hostname: node1
    environment:
      <<: *env
      PAROS_LISTEN: node1:4500
      PAROS_CLASS: storage
      PAROS_FAILURE_DOMAIN: zone-a
    volumes: [node1:/var/lib/paros]
    networks: { default: { aliases: [seeds] } }

  node2:
    <<: *parosd
    hostname: node2
    environment:
      <<: *env
      PAROS_LISTEN: node2:4500
      PAROS_CLASS: storage
      PAROS_FAILURE_DOMAIN: zone-b
    volumes: [node2:/var/lib/paros]
    networks: { default: { aliases: [seeds] } }

  node3:
    <<: *parosd
    hostname: node3
    environment:
      <<: *env
      PAROS_LISTEN: node3:4500
      PAROS_CLASS: storage
      PAROS_FAILURE_DOMAIN: zone-c
    volumes: [node3:/var/lib/paros]
    networks: { default: { aliases: [seeds] } }

  storage4:
    <<: *parosd
    hostname: storage4
    environment:
      <<: *env
      PAROS_LISTEN: storage4:4500
      PAROS_CLASS: storage
      PAROS_FAILURE_DOMAIN: zone-a
    volumes: [storage4:/var/lib/paros]

  stateless1:
    <<: *parosd
    hostname: stateless1
    environment:
      <<: *env
      PAROS_LISTEN: stateless1:4500
      PAROS_CLASS: stateless
      PAROS_FAILURE_DOMAIN: zone-b
    volumes: [stateless1:/var/lib/paros]

  # `init`, once, after `up`: sent to node1 (one of the nodes the `seeds` join
  # list names). It waits for the seed to listen; re-running it resumes an
  # interrupted init, and is refused on an initialized cell.
  init:
    <<: *parosctl
    entrypoint: ["parosctl", "--servers", "node1:4500", "init", "--patience-ms", "60000"]
    depends_on: [node1, node2, node3]

  # Any parosctl command against the seeds: `docker compose run --rm parosctl …`.
  parosctl:
    <<: *parosctl

volumes:
  node1:
  node2:
  node3:
  storage4:
  stateless1:
