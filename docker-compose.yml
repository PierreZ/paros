# The paros toy (#196), a demo to run paros by hand (no test runs it): one cell of five machines over three failure
# domains, every one the same `parosd` image configured by PAROS_* variables.
#
#   docker compose up -d --build
#   docker compose run --rm init
#   docker compose run --rm parosctl tenant create acme
#   docker compose run --rm parosctl journal create acme orders   # prints journal=T/J
#   docker compose run --rm parosctl write T/J hello world --leader 7
#   docker compose run --rm parosctl read T/J
#   docker compose run --rm parosctl bench --tenant bench --journals 4 --clients 8 --duration 60s --ramp 10s
#
# The copy-paste demo is DEMO.md; the walkthrough is crates/parosd/README.md.
# A rebuilt image does not read volumes an older build wrote (no upgrades until M13, #363 (upgrades)). If every
# machine exits 78 with `machine record: ...`, run `docker compose down -v`, then `up -d --build` and `init` again.
# A machine mints its node id on
# its first start and waits, configured with no peer; `init` forms the cell over the
# three nodes it names (`cell init`'s founding members, #277) and claims its control journal. `storage4` and `stateless1` idle until `parosctl cell add-machine` admits them, then wait for placement,
# which is M9 (#211, #212). No restart policy: exit 78 means "do not restart" (an operator acts),
# and `docker compose start <machine>` brings a killed machine back.
#
# Every machine listens on all its interfaces (`PAROS_LISTEN`) and advertises its service name
# (`PAROS_ADVERTISE`, #257). The cell plan keeps the names, and each peer resolves a name when
# it dials. Compose can give a restarted container a new IP: its peers find it at its name.

name: paros

x-parosd: &parosd
  image: paros:local
  build: .
  environment: &env
    # /metrics, /healthz and /readyz on each machine (#366 (metrics)), inside the Compose
    # network: http://node1:9100/metrics.
    PAROS_HTTP_LISTEN: 0.0.0.0:9100
    RUST_LOG: warn,parosd=info,paros::machine=info

x-parosctl: &parosctl
  image: paros:local
  entrypoint: ["parosctl", "--servers", "members:4500", "--timeout-ms", "10000"]
  profiles: ["tools"]
  restart: "no"

services:
  node1:
    <<: *parosd
    hostname: node1
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: node1:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-a
    volumes: [node1:/var/lib/paros]
    networks: { default: { aliases: [members] } }

  node2:
    <<: *parosd
    hostname: node2
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: node2:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-b
    volumes: [node2:/var/lib/paros]
    networks: { default: { aliases: [members] } }

  node3:
    <<: *parosd
    hostname: node3
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: node3:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-c
    volumes: [node3:/var/lib/paros]
    networks: { default: { aliases: [members] } }

  storage4:
    <<: *parosd
    hostname: storage4
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: storage4:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-a
    volumes: [storage4:/var/lib/paros]

  stateless1:
    <<: *parosd
    hostname: stateless1
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: stateless1:4500
      PAROS_CLASS: stateless
      PAROS_ZONE: zone-b
    volumes: [stateless1:/var/lib/paros]

  # `init`, once, after `up`: `cell init` over the three nodes, every one of
  # them needed, each named by its advertised address. It waits for them to listen;
  # re-running it resumes an interrupted init, and is refused on an
  # initialized cell.
  init:
    <<: *parosctl
    entrypoint:
      - parosctl
      - --servers
      - members:4500
      - init
      - --members
      - node1:4500,node2:4500,node3:4500
      - --patience-ms
      - "60000"
    depends_on: [node1, node2, node3]

  # Any parosctl command against the members: `docker compose run --rm parosctl …`.
  parosctl:
    <<: *parosctl

volumes:
  node1:
  node2:
  node3:
  storage4:
  stateless1:
