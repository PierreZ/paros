services:
  node1:
    <<: *parosd
    hostname: node1
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: node1:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-a
    volumes: [node1:/var/lib/paros]
    networks: { default: { aliases: [members] } }

  node2:
    <<: *parosd
    hostname: node2
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: node2:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-b
    volumes: [node2:/var/lib/paros]
    networks: { default: { aliases: [members] } }

  node3:
    <<: *parosd
    hostname: node3
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: node3:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-c
    volumes: [node3:/var/lib/paros]
    networks: { default: { aliases: [members] } }

  storage4:
    <<: *parosd
    hostname: storage4
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: storage4:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-a
    volumes: [storage4:/var/lib/paros]

  stateless1:
    <<: *parosd
    hostname: stateless1
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: stateless1:4500
      PAROS_CLASS: stateless
      PAROS_ZONE: zone-b
    volumes: [stateless1:/var/lib/paros]

  # The second cell (#232 (multiple cells)): three machines, one per zone. They idle until
  # `init-cell2` forms them into a cell of their own, and `add-cell2` joins it to the universe
  # that cell-1 hosts. Every machine of both cells serves the resolver (#233 (resolver)).
  cell2-a:
    <<: *parosd
    hostname: cell2-a
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: cell2-a:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-a
    volumes: [cell2-a:/var/lib/paros]
    networks: { default: { aliases: [cell2] } }
  cell2-b:
    <<: *parosd
    hostname: cell2-b
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: cell2-b:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-b
    volumes: [cell2-b:/var/lib/paros]
    networks: { default: { aliases: [cell2] } }
  cell2-c:
    <<: *parosd
    hostname: cell2-c
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: cell2-c:4500
      PAROS_CLASS: storage
      PAROS_ZONE: zone-c
    volumes: [cell2-c:/var/lib/paros]
    networks: { default: { aliases: [cell2] } }
  # cell-2's stateless machine: it idles until `parosctl --servers cell2:4500 cell add-machine
  # cell2-stateless:4500` admits it, then takes cell-2's frontends, proxy leaders and batchers.
  cell2-stateless:
    <<: *parosd
    hostname: cell2-stateless
    environment:
      <<: *env
      PAROS_LISTEN: 0.0.0.0:4500
      PAROS_ADVERTISE: cell2-stateless:4500
      PAROS_CLASS: stateless
      PAROS_ZONE: zone-a
    volumes: [cell2-stateless:/var/lib/paros]

  # `init`, once, after `up`: `cell init` over the three nodes, every one of
  # them needed, each named by its advertised address. It waits for them to listen;
  # re-running it resumes an interrupted init, and is refused on an
  # initialized cell.
  init:
    <<: *parosctl
    environment:
      <<: *ctlenv
      # The universe keeps the demo root key for its frontends.
      PAROSCTL_ROOT_PUBLIC_KEY_JSON: *root
    entrypoint:
      - parosctl
      - --servers
      - members:4500
      - init
      - --universe-name
      - demo
      - --members
      - node1:4500,node2:4500,node3:4500
      - --patience-ms
      - "60000"
    depends_on: [node1, node2, node3]

  # The second cell, once, after `init`: an idle cell over its three machines (no universe
  # yet), then joined to the universe as `cell-2`. Each step resumes when run again.
  init-cell2:
    <<: *parosctl
    entrypoint:
      - parosctl
      - --servers
      - cell2:4500
      - init
      - --idle
      - --members
      - cell2-a:4500,cell2-b:4500,cell2-c:4500
      - --patience-ms
      - "60000"
    depends_on: [cell2-a, cell2-b, cell2-c]

  add-cell2:
    <<: *parosctl
    entrypoint:
      - parosctl
      - --servers
      - members:4500
      - --timeout-ms
      - "10000"
      - universe
      - add-cell
      - --members
      - cell2-a:4500,cell2-b:4500,cell2-c:4500
      - --name
      - cell-2

  # Any parosctl command against the members: `docker compose run --rm parosctl …`.
  parosctl:
    <<: *parosctl

  # The load generator against the members: `docker compose run --rm paros-bench …`.
  paros-bench:
    <<: *parosctl
    entrypoint: ["paros-bench", "--servers", "members:4500", "--timeout-ms", "10000"]

volumes:
  node1:
  node2:
  node3:
  storage4:
  stateless1:
  cell2-a:
  cell2-b:
  cell2-c:
  cell2-stateless:
