\* The design on one grid of three acceptors with a Truncate: a write at slot 0, a Truncate
\* over it at slot 1, one acceptor's vote rots at a boot, the replica compacts past slot 0
\* and an acceptor drops it. A later leader blocks the slot; a late answer that dropped it
\* skips it (`ProbeSkip`), and the probe never tallies it.
