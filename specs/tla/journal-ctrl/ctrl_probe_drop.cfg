\* Control: the probe tallies a slot that an answer dropped. The other answers predate
\* the compaction: the faulty vote does not qualify and the third acceptor never voted, so
\* the dropped answer and the empty one decide a `Noop` over the chosen write, and
\* `Agreement` breaks.
SPECIFICATION SpecR
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  u1 = u1
  None = None
  Unset = Unset
  Tags = {}
  Noop = Noop
  L0 = None
  MaxCrash = 0
  RetireAt = 1
  Partial = FALSE
  Reply1b = "disk"
  Reply2b = "disk"
  WriteOrder = "atomic"
  EndRule = "voted"
  EndAct = "done"
  BoundAct = "done"
  GapFill = TRUE
  RetireRule = "full"
  ReshapeGuard = TRUE
  Lookup = "below"
  Resolve = "write"
  TrimRule = "sealed"
  ReadRule = "all"
  Bind = "cas"
  Compact = "replicas"
  CompactAt = 1
  MaxRot = 1
  Acceptors = {a1, a2, a3}
  CfgOf <- Cfg3
  QOf <- Q3
  RepOf <- Rep1
  Values <- SOneTrunc
  G = 1
  NS = 2
  NB = 2
  GenOK <- AllFirst
  Damage = "keep"
  Repair = "chosen"
  ProbeDrops = "ignore"
INVARIANT Agreement
