\* ctrl_trunc.cfg with SpecRR: an acceptor answers a Prepare again at a ballot it promised, so the probe, the skip and the decide meet a second answer that carries what its disk holds now.
SPECIFICATION SpecRR
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  u1 = u1
  None = None
  Unset = Unset
  Tags = {}
  Noop = Noop
  L0 = None
  MaxCrash = 0
  RetireAt = 1
  Partial = FALSE
  Reply1b = "disk"
  Reply2b = "disk"
  WriteOrder = "atomic"
  EndRule = "voted"
  EndAct = "done"
  BoundAct = "done"
  GapFill = TRUE
  RetireRule = "full"
  ReshapeGuard = TRUE
  Lookup = "below"
  Resolve = "write"
  TrimRule = "sealed"
  ReadRule = "all"
  Bind = "cas"
  Compact = "replicas"
  CompactAt = 1
  MaxRot = 1
  Acceptors = {a1, a2, a3}
  CfgOf <- Cfg3
  QOf <- Q3
  RepOf <- Rep1
  Values <- SOneTrunc
  G = 1
  NS = 2
  NB = 2
  GenOK <- AllFirst
  Damage = "keep"
  Repair = "chosen"
  ProbeDrops = "skip"
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT SealedFrozen
INVARIANT AckTrue
INVARIANT OneFold
INVARIANT RecordTrue
INVARIANT NoMoveBack
INVARIANT OneUnretired
INVARIANT Readable
INVARIANT ResolveTrue
INVARIANT Learnable
INVARIANT DropChosen
INVARIANT DroppedEmpty
INVARIANT BaseFirst
INVARIANT TrimTrue
INVARIANT OneValueAtBallot
INVARIANT NoProposeBlocked
INVARIANT SkipCompacted
PROPERTY CompactStays
PROPERTY EndOnce
PROPERTY BoundOnce
PROPERTY TrimStays
PROPERTY PromiseRead
PROPERTY ResolveReadOnly
