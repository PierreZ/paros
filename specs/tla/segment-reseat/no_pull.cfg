\* Control: a replica gets only its routed Commits, so the new member never gets the slots below the SetReplicas (Whole is violated).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  Reps = {a, b, c}
  Old = {a, b}
  New = {b, c}
  SetAt = 2
  N = 3
  Asks <- Reads
  Route = "fold"
  Pull = FALSE
  Moved = TRUE
INVARIANT TypeOK
PROPERTY Whole
