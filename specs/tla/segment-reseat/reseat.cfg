\* SetReplicas at slot 2 replaces a by c: every Commit goes to the set that the fold names, the new member joins from the start of the segment, the removed one answers moved, every member in force walks the segment and every read is answered.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  Reps = {a, b, c}
  Old = {a, b}
  New = {b, c}
  SetAt = 2
  N = 3
  Asks <- Reads
  Route = "fold"
  Pull = TRUE
  Moved = TRUE
INVARIANT TypeOK
INVARIANT Sound
PROPERTY Whole
PROPERTY Answered
PROPERTY ReadOnce
