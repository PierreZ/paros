\* Control: the leader routes by the SetReplicas that it proposed, before it is chosen (Routed is violated: a slot above the SetReplicas goes to the new set before it is chosen, and a Noop may keep the old set).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  Reps = {a, b, c}
  Old = {a, b}
  New = {b, c}
  SetAt = 2
  N = 3
  Asks <- Reads
  Route = "proposed"
  Pull = TRUE
  Moved = TRUE
INVARIANT TypeOK
INVARIANT Sound
INVARIANT Routed
