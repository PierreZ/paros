\* Control: the removed member never answers moved, so a read above the SetReplicas waits for ever (Answered is violated).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  Reps = {a, b, c}
  Old = {a, b}
  New = {b, c}
  SetAt = 2
  N = 3
  Asks <- Reads
  Route = "fold"
  Pull = TRUE
  Moved = FALSE
INVARIANT TypeOK
PROPERTY Answered
