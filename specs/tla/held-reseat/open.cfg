\* `SetReplicas` at slot 1 replaces c by d in the open segment: the tally counts the whole reports of the set in force, and no slot is lost.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c, d}
  Old = {a, b, c}
  New = {a, b, d}
  SetAt = 1
  N = 2
  HealOut = a
  HealIn = d
  Heal = FALSE
  F = 1
  Losses = 2
  Count = "inforce"
  Report = "whole"
INVARIANT TypeOK
INVARIANT Sound
INVARIANT Kept
