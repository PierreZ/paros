\* The control: `heal` with a tally that knows only the set of the fold. Its held mark of a, b stands after the heal, a is released, and a slot is lost.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c, d}
  Old = {a, b, c}
  New = {a, b, c}
  SetAt = 0
  N = 2
  HealOut = a
  HealIn = d
  Heal = TRUE
  F = 1
  Losses = 3
  Count = "fold"
  Stamp = "version"
  Report = "whole"
INVARIANT TypeOK
INVARIANT Sound
INVARIANT Kept
