\* The control: `open` with a report of the slots that the leader routed. The new d reports without slot 1; the segment is held over a, d, c is released, and slot 1 is lost.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c, d}
  Old = {a, b, c}
  New = {a, b, d}
  SetAt = 1
  N = 2
  HealOut = a
  HealIn = d
  Heal = FALSE
  F = 1
  Losses = 2
  Count = "inforce"
  Report = "routed"
INVARIANT TypeOK
INVARIANT Sound
INVARIANT Kept
