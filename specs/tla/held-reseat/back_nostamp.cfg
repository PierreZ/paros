\* The control: `back` with reports that carry no version. c reports at version 0, is released and drops its copy; the heal adds c back, its old report counts, a is released, and a slot is lost.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c, d}
  Old = {a, b, c}
  New = {a, b, d}
  SetAt = 1
  N = 2
  HealOut = a
  HealIn = c
  Heal = TRUE
  F = 1
  Losses = 3
  Count = "inforce"
  Stamp = "none"
  Report = "whole"
INVARIANT TypeOK
INVARIANT Sound
INVARIANT Kept
