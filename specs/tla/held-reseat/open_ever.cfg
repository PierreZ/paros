\* The control: `open` with a tally that counts the report of the removed c. It marks the segment held over a, c, releases c, and a slot is lost.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c, d}
  Old = {a, b, c}
  New = {a, b, d}
  SetAt = 1
  N = 2
  HealOut = a
  HealIn = d
  Heal = FALSE
  F = 1
  Losses = 3
  Count = "ever"
  Stamp = "version"
  Report = "whole"
INVARIANT TypeOK
INVARIANT Sound
INVARIANT Kept
