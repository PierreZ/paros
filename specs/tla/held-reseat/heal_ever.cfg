\* The control: `heal` with a tally that counts any report: it judges the segment again at once over a, b, and a is released.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c, d}
  Old = {a, b, c}
  New = {a, b, c}
  SetAt = 0
  N = 2
  HealOut = a
  HealIn = d
  Heal = TRUE
  F = 1
  Losses = 3
  Count = "ever"
  Stamp = "version"
  Report = "whole"
INVARIANT TypeOK
INVARIANT Sound
INVARIANT Kept
