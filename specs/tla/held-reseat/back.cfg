\* The set goes back: `SetReplicas` at slot 1 replaces c by d, and a heal of the sealed segment replaces a by c. A report counts only at its version, so the old report of c does not count again.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c, d}
  Old = {a, b, c}
  New = {a, b, d}
  SetAt = 1
  N = 2
  HealOut = a
  HealIn = c
  Heal = TRUE
  F = 1
  Losses = 3
  Count = "inforce"
  Stamp = "version"
  Report = "whole"
INVARIANT TypeOK
INVARIANT Sound
INVARIANT Kept
