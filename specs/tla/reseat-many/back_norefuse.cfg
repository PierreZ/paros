\* Control: the fold takes the SetReplicas that names a again, and a stopped at its removal, so a member in force never walks the segment (Whole is violated).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c}
  Old = {a, b}
  N = 3
  SetSlots = {1, 2}
  Prop <- PropBack
  Refuse = FALSE
  OutRule = "removed"
INVARIANT TypeOK
PROPERTY Whole
