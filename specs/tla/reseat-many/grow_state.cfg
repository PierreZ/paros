\* Control: a replica is out once the set at its walk leaves it out, so d, which slot 2 adds, is out from the start and never walks (Whole is violated).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c, d}
  Old = {a, b}
  N = 3
  SetSlots = {1, 2}
  Prop <- PropGrow
  Refuse = TRUE
  OutRule = "state"
INVARIANT TypeOK
INVARIANT Sound
PROPERTY Whole
