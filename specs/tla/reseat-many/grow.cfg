\* Two SetReplicas in one segment: slot 1 replaces a by c, slot 2 replaces b by d. Each removed member stops where it was removed, each added one walks the segment, and the removed members only grow.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c, d}
  Old = {a, b}
  N = 3
  SetSlots = {1, 2}
  Prop <- PropGrow
  Refuse = TRUE
  OutRule = "removed"
INVARIANT TypeOK
INVARIANT Sound
PROPERTY Whole
