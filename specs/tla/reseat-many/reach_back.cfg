\* Reaches: a SetReplicas that names a removed member again is chosen (NoNamedAgain is violated).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c}
  Old = {a, b}
  N = 3
  SetSlots = {1, 2}
  Prop <- PropBack
  Refuse = TRUE
  OutRule = "removed"
INVARIANT TypeOK
INVARIANT NoNamedAgain
