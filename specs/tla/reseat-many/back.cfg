\* Slot 1 replaces a by c, slot 2 names a again: the fold refuses slot 2 when slot 1 holds its SetReplicas, and every member in force walks the segment.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c}
  Old = {a, b}
  N = 3
  SetSlots = {1, 2}
  Prop <- PropBack
  Refuse = TRUE
  OutRule = "removed"
INVARIANT TypeOK
INVARIANT Sound
PROPERTY Whole
