\* Reaches: two SetReplicas remove a member each (NoTwoRemoved is violated).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  d = d
  Reps = {a, b, c, d}
  Old = {a, b}
  N = 3
  SetSlots = {1, 2}
  Prop <- PropGrow
  Refuse = TRUE
  OutRule = "removed"
INVARIANT TypeOK
INVARIANT NoTwoRemoved
