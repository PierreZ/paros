\* The design on two segments, multi-writer: two writes and a Truncate that cuts the first. A
\* replica set of two in the first segment, so a replica can lag and jump into a blind fold;
\* replicas compact, the acceptors of each segment drop the votes below a slot that F + 1
\* replicas of its set compacted to, and a campaign may write from its oldest segment start.
SPECIFICATION SpecC
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  u1 = u1
  Acceptors = {a1, a2}
  None = None
  Unset = Unset
  Tags = {}
  Noop = Noop
  CfgOf <- Cfg1
  QOf <- Q1
  RepOf <- Rep2
  Values <- SMultiBlind
  L0 = None
  G = 2
  NS = 3
  NB = 2
  MaxCrash = 0
  RetireAt = 1
  Partial = FALSE
  Reply1b = "disk"
  Reply2b = "disk"
  WriteOrder = "atomic"
  EndRule = "voted"
  EndAct = "done"
  BoundAct = "done"
  GapFill = TRUE
  RetireRule = "full"
  ReshapeGuard = TRUE
  Lookup = "below"
  Resolve = "write"
  TrimRule = "sealed"
  ReadRule = "all"
  Bind = "cas"
  Compact = "replicas"
  CompactAt = 1
  GenOK <- OneEach
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT SealedFrozen
INVARIANT AckTrue
INVARIANT OneFold
INVARIANT RecordTrue
INVARIANT NoMoveBack
INVARIANT OneUnretired
INVARIANT Readable
INVARIANT ResolveTrue
INVARIANT Learnable
INVARIANT DropChosen
INVARIANT DroppedEmpty
INVARIANT BaseFirst
INVARIANT TrimTrue
PROPERTY CompactStays
PROPERTY EndOnce
PROPERTY BoundOnce
PROPERTY TrimStays
PROPERTY PromiseRead
PROPERTY ResolveReadOnly
