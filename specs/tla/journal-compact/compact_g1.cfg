\* One segment, one acceptor, one replica, two leaders and a crash between two writes: an
\* acceptor queues its compaction behind its votes, and a crash before the flush brings back
\* the votes on its disk. Three acceptors do not fit the time of a CI job.
SPECIFICATION SpecC
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  u1 = u1
  Acceptors = {a1, a2}
  None = None
  Unset = Unset
  Noop = Noop
  CfgOf <- Cfg1
  QOf <- Q1
  RepOf <- Rep1
  Values <- SMultiTrunc
  L0 = None
  G = 1
  NS = 2
  NB = 2
  MaxCrash = 1
  RetireAt = 1
  Partial = FALSE
  Reply1b = "disk"
  Reply2b = "disk"
  WriteOrder = "atomic"
  EndRule = "voted"
  EndAct = "done"
  BoundAct = "done"
  GapFill = TRUE
  RetireRule = "full"
  ReshapeGuard = TRUE
  Lookup = "below"
  Resolve = "write"
  TrimRule = "sealed"
  Compact = "replicas"
  CompactAt = 1
  GenOK <- TwoInFirst
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT SealedFrozen
INVARIANT AckTrue
INVARIANT OneFold
INVARIANT RecordTrue
INVARIANT NoMoveBack
INVARIANT OneUnretired
INVARIANT Readable
INVARIANT ResolveTrue
INVARIANT Learnable
INVARIANT DropChosen
INVARIANT DroppedEmpty
INVARIANT TrimTrue
PROPERTY CompactStays
PROPERTY EndOnce
PROPERTY BoundOnce
PROPERTY TrimStays
PROPERTY PromiseRead
PROPERTY ResolveReadOnly
