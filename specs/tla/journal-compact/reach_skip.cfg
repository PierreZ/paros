\* Reach: an acceptor dropped votes, and a leader whose Phase 1 saw it writes.
\* below a slot that a replica of its set compacted to, a laggard jumps.
SPECIFICATION SpecC
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  u1 = u1
  Acceptors = {a1, a2}
  None = None
  Unset = Unset
  Noop = Noop
  CfgOf <- Cfg1
  QOf <- Q1
  RepOf <- Rep2
  Values <- STrunc
  L0 = Unset
  G = 2
  NS = 3
  NB = 2
  MaxCrash = 0
  RetireAt = 1
  Partial = FALSE
  Reply1b = "disk"
  Reply2b = "disk"
  WriteOrder = "atomic"
  EndRule = "voted"
  EndAct = "done"
  BoundAct = "done"
  GapFill = TRUE
  RetireRule = "full"
  ReshapeGuard = TRUE
  Lookup = "below"
  Resolve = "write"
  TrimRule = "sealed"
  Compact = "replicas"
  CompactAt = 1
  GenOK <- OneEach
INVARIANT NoSkipWrite
