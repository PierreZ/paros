  a1 = a1
  a2 = a2
  a3 = a3
  a4 = a4
  a5 = a5
  a6 = a6
  Acceptors = {a1, a2, a3}
  Learners = {a1}
  Commands = {c1, c2}
  Noop = noop
  NB = 1
  NS = 1
  Q1 <- Majorities
  Q2 <- MajQ2
  Owner <- Own3
  Alloc = "frontier"
  Gap = "noop"
  Durable = "after"
  Restarts = 1
  Wipes = 0
  Identity = TRUE
  Pick = "highest"
  Restartable <- AllAcceptors
  Down = {}
INVARIANT TypeOK
INVARIANT OneProposal
SYMMETRY Symmetry
