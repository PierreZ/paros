\* Control: S1 retires at F replicas, not F + 1. One rot after the retire
\* leaves no good copy.
SPECIFICATION Spec
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  Acceptors = {a1, a2, a3}
  Replicas = {r1, r2, r3}
  K = 1
  F = 1
  RetireAt = 1
  RetireCount = "clean"
  UploadFrom = "good"
  DropWhen = "mark"
  ObjFaults = 0
INVARIANT Survive
