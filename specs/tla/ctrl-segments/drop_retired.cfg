\* Control: a replica drops its copy once S1 retired, before the record
\* says offloaded.
SPECIFICATION Spec
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  Acceptors = {a1, a2, a3}
  Replicas = {r1, r2, r3}
  K = 1
  F = 1
  RetireAt = 2
  RetireCount = "clean"
  UploadFrom = "good"
  DropWhen = "retired"
  ObjFaults = 0
INVARIANT Survive
