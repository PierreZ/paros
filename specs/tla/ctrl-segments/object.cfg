\* Item 4 of #1263: one damaged object. While a replica holds a good log,
\* the object is put again; once no replica holds it, the controller reports
\* data loss, and a report is always true.
SPECIFICATION Spec
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  Acceptors = {a1, a2, a3}
  Replicas = {r1, r2, r3}
  K = 1
  F = 1
  RetireAt = 2
  RetireCount = "clean"
  UploadFrom = "good"
  DropWhen = "mark"
  ObjFaults = 1
INVARIANT TypeOK
INVARIANT TrueLoss
INVARIANT Repairable
INVARIANT FoundBad
INVARIANT ObjAfterRetire
PROPERTY LostForEver
PROPERTY SegForward
