\* The design, F = 1: three acceptors, three replicas, one sealed slot.
\* S1 retires at F + 1 = 2 replicas, is offloaded, and the replicas drop.
\* One failed machine copy at a time (a rot until its repair, or a lost
\* machine), no damaged object.
SPECIFICATION Spec
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  Acceptors = {a1, a2, a3}
  Replicas = {r1, r2, r3}
  K = 1
  F = 1
  RetireAt = 2
  RetireCount = "clean"
  UploadFrom = "good"
  DropWhen = "mark"
  ObjFaults = 0
INVARIANT TypeOK
INVARIANT Survive
INVARIANT TrueLoss
INVARIANT Repairable
