\* Every machine copy may fail (F = 6): the slot can be lost, and no step
\* makes a good copy from no good copy (no unsafe recover in v1).
SPECIFICATION Spec
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  Acceptors = {a1, a2, a3}
  Replicas = {r1, r2, r3}
  K = 1
  F = 6
  RetireAt = 2
  RetireCount = "clean"
  UploadFrom = "good"
  DropWhen = "mark"
  ObjFaults = 0
INVARIANT TypeOK
INVARIANT TrueLoss
INVARIANT FoundBad
INVARIANT ObjAfterRetire
PROPERTY LostForEver
PROPERTY SegForward
PROPERTY NoResurrection
