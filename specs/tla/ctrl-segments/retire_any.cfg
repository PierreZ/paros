\* Item 2 of #1263: S1 retires while a scrub found damage in a counted
\* replica that no repair fixed. Safe: the damaged copy is the one failed
\* copy of the promise, so the other counted replica stays good, and the
\* repair reads it, never the retired grid.
SPECIFICATION Spec
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  r1 = r1
  r2 = r2
  r3 = r3
  Acceptors = {a1, a2, a3}
  Replicas = {r1, r2, r3}
  K = 1
  F = 1
  RetireAt = 2
  RetireCount = "any"
  UploadFrom = "good"
  DropWhen = "mark"
  ObjFaults = 0
INVARIANT TypeOK
INVARIANT Survive
INVARIANT TrueLoss
INVARIANT Repairable
