\* The leader is outside the set; of two replica peers only the second holds the segment, and the replicas may crash twice: the turn reaches the holder.
SPECIFICATION Spec
CONSTANTS
  r1 = r1
  r2 = r2
  n0 = n0
  n1 = n1
  lag = lag
  Lag = lag
  Leader = n0
  NodePeers = {}
  RepPeers <- Two
  Holders = {r2}
  Crashes = 2
  Beats = TRUE
  PullRule = "replicas"
INVARIANT TypeOK
PROPERTY Heals
