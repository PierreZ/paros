\* The leader is a node of the set, beside one replica that holds the segment and may crash once: the replica pulls from its replica peer and heals.
SPECIFICATION Spec
CONSTANTS
  r1 = r1
  r2 = r2
  n0 = n0
  n1 = n1
  lag = lag
  Lag = lag
  Leader = n1
  NodePeers = {n1}
  RepPeers <- One
  Holders = {r1}
  Crashes = 1
  Beats = TRUE
  PullRule = "replicas"
INVARIANT TypeOK
PROPERTY Heals
