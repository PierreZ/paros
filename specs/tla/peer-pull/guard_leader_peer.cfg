\* Control: leader_peer with the first rule. Every trim point comes from a peer of the set, so the replica never pulls (Heals is violated).
SPECIFICATION Spec
CONSTANTS
  r1 = r1
  r2 = r2
  n0 = n0
  n1 = n1
  lag = lag
  Lag = lag
  Leader = n1
  NodePeers = {n1}
  RepPeers <- One
  Holders = {r1}
  Crashes = 1
  Beats = TRUE
  PullRule = "guard"
INVARIANT TypeOK
PROPERTY Heals
