\* The control: `leader_peer` with no beat. No trim point comes, so the replica never pulls and never heals (a pull leaves only on a trim point).
SPECIFICATION Spec
CONSTANTS
  r1 = r1
  r2 = r2
  n0 = n0
  n1 = n1
  lag = lag
  Lag = lag
  Leader = n1
  NodePeers = {n1}
  RepPeers <- One
  Holders = {r1}
  Crashes = 1
  Beats = FALSE
  PullRule = "replicas"
INVARIANT TypeOK
PROPERTY Heals
