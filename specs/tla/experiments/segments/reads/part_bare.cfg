\* Control on the partitioned grid (3 x 1, acks 2: the default grid of the journal, a reader asks every member): no fence. One reshape, two ballots.
SPECIFICATION Spec
CONSTANTS
  Acceptors = {"a1", "a2", "a3", "a4"}
  Values = {v1}
  None = None
  Noop = Noop
  CfgOf <- PartCfg
  Q1s <- PartQ1
  Q2s <- PartQ2
  RowsOf <- PartRows
  ColsOf <- PartCols
  NS = 2
  NB = 2
  NG = 2
  Fence = FALSE
  SealRows = FALSE
  Wipe = FALSE
  Belief = FALSE
  ReadRule = "row"
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT SealedFrozen
INVARIANT ReadFresh
INVARIANT ServedChosen
