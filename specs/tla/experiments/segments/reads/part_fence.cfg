\* The partitioned grid with the fence on the promise and no seal of each row: two Phase-1 quorums meet. One reshape, two ballots.
SPECIFICATION Spec
CONSTANTS
  Acceptors = {"a1", "a2", "a3", "a4"}
  Values = {v1}
  None = None
  Noop = Noop
  CfgOf <- PartCfg
  Q1s <- PartQ1
  Q2s <- PartQ2
  RowsOf <- PartRows
  ColsOf <- PartCols
  NS = 2
  NB = 2
  NG = 2
  Fence = TRUE
  SealRows = FALSE
  Wipe = FALSE
  Belief = FALSE
  ReadRule = "row"
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT SealedFrozen
INVARIANT ReadFresh
