\* Reachability: a read that started on a stale record, after configuration 2 chose a slot, is served.
SPECIFICATION Spec
CONSTANTS
  Acceptors = {"a1", "a2", "a3"}
  Values = {v1}
  None = None
  Noop = Noop
  CfgOf <- NarrowCfg
  Q1s <- NarrowQ1
  Q2s <- NarrowQ2
  RowsOf <- NarrowRows
  ColsOf <- NarrowCols
  NS = 2
  NB = 2
  NG = 2
  Fence = TRUE
  SealRows = TRUE
  Wipe = FALSE
  Belief = FALSE
  ReadRule = "row"
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT SealedFrozen
INVARIANT NoStaleStart
