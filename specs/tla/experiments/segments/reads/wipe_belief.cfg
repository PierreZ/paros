\* The code with #1209: the fence on the promise and on the configuration the acceptor heard of, the refusal of an acceptor that lost its state, the seal of each row; an acceptor of a retired configuration can lose its state. 2 x 1 grids, one reshape, two ballots.
SPECIFICATION Spec
CONSTANTS
  Acceptors = {"a1", "a2", "a3"}
  Values = {v1}
  None = None
  Noop = Noop
  CfgOf <- NarrowCfg
  Q1s <- NarrowQ1
  Q2s <- NarrowQ2
  RowsOf <- NarrowRows
  ColsOf <- NarrowCols
  NS = 2
  NB = 2
  NG = 2
  Fence = TRUE
  SealRows = TRUE
  Wipe = TRUE
  Belief = TRUE
  ReadRule = "row"
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT SealedFrozen
INVARIANT ReadFresh
INVARIANT ServedChosen
