\* Control (rule 3 of #1254): no fence, no seal of each row, no record check. 2 x 1 grids, one reshape, two ballots.
SPECIFICATION Spec
CONSTANTS
  Acceptors = {"a1", "a2", "a3"}
  Values = {v1}
  None = None
  Noop = Noop
  CfgOf <- NarrowCfg
  Q1s <- NarrowQ1
  Q2s <- NarrowQ2
  RowsOf <- NarrowRows
  ColsOf <- NarrowCols
  NS = 2
  NB = 2
  NG = 2
  Fence = FALSE
  SealRows = FALSE
  Wipe = FALSE
  Belief = FALSE
  ReadRule = "row"
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT SealedFrozen
INVARIANT ReadFresh
