\* Control of rule 2b: with no Noop gap fill, a slot below the end with no vote stays a hole for ever (NoStrandedHole fails).
SPECIFICATION Spec
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  a4 = a4
  Acceptors = {a1, a2}
  CfgOf <- Cfg1
  Replicas = {r1, r2}
  Values = {v1, v2}
  None = None
  Noop = Noop
  NS = 2
  NB = 3
  NG = 2
  F = 1
  EndRule = "voted"
  ReadOld = "belowEnd"
  SealCas = TRUE
  Fence = "config"
  RetireRule = "paper"
  DropRule = "offloaded"
  TrimCheck = TRUE
  ReadFence = TRUE
  Reader = FALSE
  Storage = TRUE
  GapFill = FALSE
SYMMETRY Symmetry
INVARIANT NoStrandedHole
