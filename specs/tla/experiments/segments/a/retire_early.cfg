  a1 = a1
  a2 = a2
  a3 = a3
  a4 = a4
  Acceptors = {a1, a2}
  CfgOf <- Cfg1
  Replicas = {r1, r2}
  Values = {v1, v2}
  None = None
  Noop = Noop
  NS = 2
  NB = 3
  NG = 2
  F = 1
  EndRule = "voted"
  ReadOld = "all"
  SealCas = TRUE
  Fence = "config"
  RetireRule = "early"
  DropRule = "offloaded"
  TrimCheck = TRUE
  ReadFence = TRUE
  Reader = FALSE
  Storage = TRUE
  GapFill = TRUE
SYMMETRY Symmetry
INVARIANT Agreement
INVARIANT Readable
