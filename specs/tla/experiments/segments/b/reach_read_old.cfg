\* Reachability of check 5 with the read rule of paros: a read of configuration 2 ends while the tail is a slot that configuration 1 chose and no replica applied.
SPECIFICATION Spec
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  a4 = a4
  Acceptors = {a1, a2}
  CfgOf <- Cfg1
  Replicas = {r1, r2}
  Values = {v1, v2}
  None = None
  NS = 2
  NB = 2
  NG = 2
  F = 1
  Claims = "none"
  RetireRule = "paper"
  TrimCheck = TRUE
  ReadFence = TRUE
  Reader = TRUE
  ReadScope = "fence"
  Storage = FALSE
  Cuts = "free"
SYMMETRY Symmetry
INVARIANT TypeOK
INVARIANT NoOldTailRead
