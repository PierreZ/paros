\* A write that goes alone (an empty write here) and writes that together
\* pass one limit each: a lane batch fits the limits, holds no write that
\* goes alone, and the batches leave in the order the batcher got them.
SPECIFICATION Spec
CONSTANTS
  t1 = t1
  t2 = t2
  t3 = t3
  j1 = j1
  j2 = j2
  Tokens = {t1, t2}
  Journals = {j1}
  MaxRecords = 2
  MaxBytes = 1
  MaxN = 2
  MaxB = 1
  MaxBatches = 2
  MaxLog = 3
  MaxPushes = 2
  Order = "push"
  Scatter = "batch"
INVARIANT TypeOK
INVARIANT AnswerHolds
INVARIANT LaneOrder
INVARIANT BatchFits
INVARIANT SendOrder
