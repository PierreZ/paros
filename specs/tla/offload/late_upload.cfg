  r2 = r2
  r3 = r3
  o1 = o1
  o2 = o2
  Replicas = {r1, r2, r3}
  Offloaders = {o1, o2}
  Release <- TwoReleases
  NP = 1
  L = 2
  F = 1
  NCrash = 0
  Build = "full"
  Put = "cond"
  Conflict = "content"
  Recheck = "none"
  Cleanup = "trimonly"
  TrimKey = "key"
  Drop = "offloaded"
  Gate = "retired"
