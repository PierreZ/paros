\* The wipe of `wipe` with a command as well as the truncate: two values, so a wiped owner that promises with an empty store breaks a chosen slot.
SPECIFICATION Spec
CONSTANTS
  a1 = a1
  a2 = a2
  a3 = a3
  a4 = a4
  a5 = a5
  Acceptors = {a1, a2, a3, a4}
  Learners = {a2, a3, a4}
  Commands = {c1}
  c1 = c1
  Cuts = {trunc}
  Noop = noop
  NB = 2
  NS = 1
  Owner <- Own
  C1 = {a1, a2, a3}
  C2 = {a2, a3, a4}
  R = 2
  C3 = {a1}
  R2 = 3
  GcRule = "fence"
  Cover = "chosen"
  Wipes = 1
  Identity = TRUE
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT LearnedChosen
INVARIANT NoFillChosen
INVARIANT FloorChosen
INVARIANT RecordChosen
INVARIANT Recoverable
