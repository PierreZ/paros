\* A control: with a proposer that ignores the reported votes, a step from a
\* state where Inv holds breaks Inv. #1307.
INIT IndInit
NEXT Next
CONSTANTS
  Acceptors = {a1, a2, a3}
  Values = {v1, v2}
  NB = 2
  Quorums <- Majorities
  Phase1 = "quorum"
  Pick = "ignore"
  Identity = TRUE
  Refuse = TRUE
  Wipes = 1
  Down = {}
SYMMETRY Symmetry
INVARIANT Inv
INVARIANT Agreement
