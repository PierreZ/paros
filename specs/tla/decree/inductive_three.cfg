\* Inv is inductive at three ballots: TLC starts from every state where Inv
\* holds (IndInit) and checks Inv after one step. #1307.
INIT IndInit
NEXT Next
CONSTANTS
  Acceptors = {a1, a2, a3}
  Values = {v1, v2}
  NB = 3
  Quorums <- Majorities
  Phase1 = "quorum"
  Pick = "highest"
  Identity = TRUE
  Refuse = TRUE
  Wipes = 1
  Down = {}
SYMMETRY Symmetry
INVARIANT Inv
INVARIANT Agreement
