\* Control: one matchmaker, one configuration, one crash. When the matchmaker crashes, no read gets an answer, so no ballot wins.
SPECIFICATION LiveSpec
CONSTANTS
  Acceptors = {"a1", "a2", "a3", "a4"}
  Matchmakers = {"m1"}
  Host <- HostOne
  Values = {v1}
  NB = 2
  Configs <- OnlyA
  C0 = "A"
  Mem <- MemAB
  Q1s <- QAB
  Q2s <- QAB
  Switch = "after"
  Stale = FALSE
  Abandon = FALSE
  Reannounce = TRUE
  Rejoin = FALSE
  Release = "never"
  Crashes = 1
PROPERTY Wins
