[book]
title = "The paros book"
authors = ["Pierre Zemb"]
language = "en"
src = "book/src"

[build]
build-dir = "book/output"

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "rust"
additional-js = [
    "book/theme/mermaid.min.js",
    "book/theme/mermaid-init.js",
    "book/theme/iframe-autosize.js",
]
