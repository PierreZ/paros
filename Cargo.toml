[workspace]
members = ["crates/*/*"]
resolver = "3"

# One line per dependency the workspace shares. `paros-consensus`,
# `paros-journal` and `paros` are published to crates.io by release-plz (`release-plz.toml`), at one
# version; the `version` below is what a published `paros` resolves, and
# release-plz moves it with each release. The code removed on 2026-11-19 is at
# the tag `v0.2.0-alpha.1` (docs/archive/v0.2.0-alpha.1/).
[workspace.dependencies]
paros-consensus = { path = "crates/lib/paros-consensus", version = "0.2.0", default-features = false }
paros-journal = { path = "crates/lib/paros-journal", version = "0.2.0" }
paros-journal-io = { path = "crates/lib/paros-journal-io", version = "0.2.0" }


[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PierreZ/paros"
authors = ["Pierre Zemb <contact@pierrezemb.fr>"]
homepage = "https://pierrez.github.io/paros/"
keywords = ["paxos", "consensus", "distributed-systems", "replication"]
categories = ["algorithms", "network-programming"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"


# The build of a mutant (`.cargo/mutants.toml`): release code, so the walks run
# fast, built incrementally in many units, so a mutant that edits one function
# rebuilds in seconds, not in a minute.
[profile.mutants]
inherits = "release"
incremental = true
codegen-units = 256
