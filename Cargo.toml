[workspace]
members = ["crates/*/*"]
resolver = "3"

# One line per dependency the workspace shares. Nothing is published to
# crates.io for now: every crate is `publish = false`. The code removed on
# 2026-11-19 is at the tag `v0.2.0-alpha.1` (docs/archive/v0.2.0-alpha.1/).
[workspace.dependencies]
paros-consensus = { path = "crates/lib/paros-consensus", default-features = false }


[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PierreZ/paros"
authors = ["Pierre Zemb <contact@pierrezemb.fr>"]
keywords = ["paxos", "consensus", "distributed-systems", "replication"]
categories = ["algorithms", "network-programming"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"
