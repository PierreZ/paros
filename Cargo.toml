[workspace]
members = ["crates/*/*"]
resolver = "3"

# One line per dependency the workspace shares. moonpool is pinned to one
# commit on its `main` (it evolves fast; not the crates.io release): advance
# the `rev` of the six moonpool lines here, and the one in
# `crates/lib/paros-core/Cargo.toml`, together.
[workspace.dependencies]
# Only `paros-core` carries a `version`: it is the one crate release-plz releases
# (#968 (release-plz)), and a release bumps the workspace version.
paros = { path = "crates/lib/paros" }
paros-core = { path = "crates/lib/paros-core", version = "0.2.0", default-features = false }
paros-wire = { path = "crates/lib/paros-wire" }
paros-model = { path = "crates/lib/paros-model" }
paros-tunables = { path = "crates/lib/paros-tunables" }
paros-storage = { path = "crates/lib/paros-storage" }
paros-net = { path = "crates/lib/paros-net" }
paros-client = { path = "crates/lib/paros-client" }
paros-observe = { path = "crates/lib/paros-observe" }
paros-roles = { path = "crates/lib/paros-roles" }
paros-coordinator = { path = "crates/lib/paros-coordinator" }
paros-machine = { path = "crates/lib/paros-machine" }
paros-sim = { path = "crates/sim/paros-sim" }
paros-authz-biscuit = { path = "crates/support/paros-authz-biscuit" }

moonpool-core = { git = "https://github.com/PierreZ/moonpool", rev = "93c8ed36faac99d0853dc506e10daab926e1295a", default-features = false }
moonpool-rpc = { git = "https://github.com/PierreZ/moonpool", rev = "93c8ed36faac99d0853dc506e10daab926e1295a", default-features = false }
moonpool-journal = { git = "https://github.com/PierreZ/moonpool", rev = "93c8ed36faac99d0853dc506e10daab926e1295a" }
moonpool-buggify = { git = "https://github.com/PierreZ/moonpool", rev = "93c8ed36faac99d0853dc506e10daab926e1295a" }
moonpool-assertions = { git = "https://github.com/PierreZ/moonpool", rev = "93c8ed36faac99d0853dc506e10daab926e1295a" }
moonpool-sim = { git = "https://github.com/PierreZ/moonpool", rev = "93c8ed36faac99d0853dc506e10daab926e1295a", default-features = false }

prometheus = { version = "0.14", default-features = false }
prost = "0.14"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
crc32c = "0.6"
tracing = "0.1"
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PierreZ/paros"
authors = ["Pierre Zemb <contact@pierrezemb.fr>"]
keywords = ["paxos", "consensus", "distributed-systems", "replication"]
categories = ["algorithms", "network-programming"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"
# Rust 1.99 pedantic lints, allowed as in moonpool:
# - unused_async_trait_impl wants `fn ... -> impl Future` + `std::future::ready`
#   for async trait impls that never await; the `async fn` form reads better.
# - assert_is_empty rewrites `assert!(x.is_empty())` to
#   `assert_eq!(x, [] as [T; 0])`, noisier than the message it buys.
unused_async_trait_impl = "allow"
assert_is_empty = "allow"

