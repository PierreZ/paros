[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PierreZ/paros"
authors = ["Pierre Zemb <contact@pierrezemb.fr>"]
keywords = ["paxos", "consensus", "distributed-systems", "replication"]
categories = ["algorithms", "network-programming"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"

# The profile the sancov sweep (`cargo xtask sim`) builds with: optimised, since a
# debug build runs the whole simulation (executor, simulated disk and network, the
# audit's linearizability search) many times slower, with every check a debug build
# carries kept on, so the sweep judges exactly what the debug suite does.
[profile.sim]
inherits = "release"
debug-assertions = true
overflow-checks = true
