[workspace]
members = ["crates/*/*"]
resolver = "3"

# One line per dependency the workspace shares. moonpool is pinned to one
# commit on its `main` (it evolves fast): advance the `rev` of the five
# moonpool lines here, and the one in `crates/lib/paros-core/Cargo.toml`,
# together. Their `version` is what a crates.io publish resolves instead of
# the git rev: keep it on the moonpool release that holds that commit.
[workspace.dependencies]
# Every published crate carries a `version` (crates.io needs one beside the
# path); release-plz releases them together and bumps these lines.
paros-core = { path = "crates/lib/paros-core", version = "0.2.0", default-features = false }
paros-storage = { path = "crates/lib/paros-storage", version = "0.2.0" }
paros-testkit = { path = "crates/testkit/paros-testkit" }

moonpool-core = { git = "https://github.com/PierreZ/moonpool", rev = "fcfe67433f5c9eebe67a8cf2f95dcd888b682483", version = "0.8", default-features = false }
moonpool-journal = { git = "https://github.com/PierreZ/moonpool", rev = "fcfe67433f5c9eebe67a8cf2f95dcd888b682483", version = "0.8" }
moonpool-buggify = { git = "https://github.com/PierreZ/moonpool", rev = "fcfe67433f5c9eebe67a8cf2f95dcd888b682483", version = "0.8" }
moonpool-assertions = { git = "https://github.com/PierreZ/moonpool", rev = "fcfe67433f5c9eebe67a8cf2f95dcd888b682483", version = "0.8" }
moonpool-sim = { git = "https://github.com/PierreZ/moonpool", rev = "fcfe67433f5c9eebe67a8cf2f95dcd888b682483", version = "0.8", default-features = false }

postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
crc32c = "0.6"
tracing = "0.1"
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PierreZ/paros"
authors = ["Pierre Zemb <contact@pierrezemb.fr>"]
keywords = ["paxos", "consensus", "distributed-systems", "replication"]
categories = ["algorithms", "network-programming"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"
# Rust 1.99 pedantic lints, allowed as in moonpool:
# - unused_async_trait_impl wants `fn ... -> impl Future` + `std::future::ready`
#   for async trait impls that never await; the `async fn` form reads better.
# - assert_is_empty rewrites `assert!(x.is_empty())` to
#   `assert_eq!(x, [] as [T; 0])`, noisier than the message it buys.
unused_async_trait_impl = "allow"
assert_is_empty = "allow"

