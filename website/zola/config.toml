# The paros site (#254): Zola. Build with `website/zola/build.sh` (through Nix).
# The look is the site's own (templates/, static/css/site.css and website/shared/,
# #804 (flat engineering redesign)). Goyo stays the theme only for its assets
# (mermaid.min.js); build.sh installs the pinned Goyo into `website/zola/themes/goyo`.
base_url = "https://pierrez.github.io/paros"
title = "paros"
description = "Paxos in Rust, and parosd, a multi-tenant journal service built on it"
theme = "goyo"
default_language = "en"
compile_sass = false
build_search_index = true
generate_feeds = false
generate_sitemap = true

[markdown]
bottom_footnotes = true

# Class mode: static/css/site.css colours the z-* classes from the tokens.
[markdown.highlighting]
style = "class"
theme = "github-dark"

[link_checker]
internal_level = "error"

[extra]
footer_html = "paros ~ a learning project, not for production · built with <a href='https://www.getzola.org'>Zola</a>"
repo_url = "https://github.com/PierreZ/paros"
source_url = "https://github.com/PierreZ/paros/blob/main/website/zola/content"

# The top bar and the phone menu. `url` is a path under the site root.
nav = [
    { name = "parosd", url = "/parosd/" },
    { name = "Paxos", url = "/paxos/" },
    { name = "Play", url = "/play/" },
    { name = "Playground", url = "/sandbox/" },
]
